<!doctype html>
<html lang="pt-BR">
<head>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Il Fredolin</title>
<meta name="description" content="Laboratório de gelato artesanal da equipe Il Fredolin">
<meta name="theme-color" content="#080c14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Il Fredolin">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/favicon-64.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Instrument+Sans:wdth,wght@75..100,400..700&family=Syne:wght@800&display=swap">
<style>
/* Il Fredolin · laboratório de gelato. Superfícies escuras de bancada, régua de temperatura como instrumento central,
   números em fonte de leitura (mono) e textos de interface em sans de proporção técnica. */
:root{
  --bg:#080c14; --surf:#0e1420; --raise:#141c2b; --hov:#1a2437; --line:#1b2638; --line2:#2b3c58;
  --ice:#7dd3fc; --ice2:#38a0d4; --ice-a:rgba(125,211,252,.12); --ink:#04121c;
  --gold:#f6c90e; --ok:#6ee7b7; --warn:#fbbf24; --crit:#fb7185; --info:#a78bfa;
  --ok-a:rgba(110,231,183,.1); --warn-a:rgba(251,191,36,.1); --crit-a:rgba(251,113,133,.1); --info-a:rgba(167,139,250,.1);
  --t1:#e8eef6; --t2:#a0aec2; --t3:#6a7a93;
  --fw:'Syne',system-ui,sans-serif; --fb:'Instrument Sans',system-ui,-apple-system,'Segoe UI',sans-serif; --fm:'DM Mono',ui-monospace,Menlo,monospace; --fd:var(--fb);
  --r1:8px; --r2:12px; --r3:16px;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
/* a página inteira não rola nem "quica" (Safari no Mac/iPad): só as áreas internas rolam */
html,body{overflow:hidden;overscroll-behavior:none}
main,nav,.pal-l,.crlist,.res{overscroll-behavior:contain}
/* campos numéricos sem as setinhas do navegador: os números ficam limpos e alinhados */
input[type=number]{-moz-appearance:textfield;appearance:textfield}
input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
body{margin:0;background:var(--bg);color:var(--t1);font:14px/1.5 var(--fb);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ice);outline-offset:2px;border-radius:6px}
.ico{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}
kbd{font:500 10.5px/1 var(--fm);padding:3px 5px;border-radius:5px;border:1px solid var(--line2);background:var(--bg);color:var(--t3);white-space:nowrap}

/* ---------- estrutura ---------- */
.app{display:grid;grid-template-columns:248px minmax(0,1fr);grid-template-rows:auto minmax(0,1fr);grid-template-areas:"nav hdr" "nav main";height:100%}
header{grid-area:hdr;display:flex;align-items:center;gap:18px;padding:10px 22px;background:var(--bg);border-bottom:1px solid var(--line);min-width:0}
nav{grid-area:nav;display:flex;flex-direction:column;background:var(--surf);border-right:1px solid var(--line);padding:16px 10px 10px;overflow-y:auto;min-height:0}
main{grid-area:main;overflow-y:auto;padding:22px 26px 48px;min-width:0}
.pg{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:16px}

/* marca */
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.hex{width:24px;height:24px;flex:none;background:linear-gradient(135deg,var(--ice),var(--info));clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%)}
.brand b{font:800 17px/1 var(--fw);letter-spacing:-.01em;white-space:nowrap}.brand b span{color:var(--ice)}
.brand small{display:block;font:500 11px/1.2 var(--fb);color:var(--t3);margin-top:3px;white-space:nowrap}

/* barra lateral */
.nbrand{padding:2px 8px 16px}
.nsearch{display:flex;align-items:center;gap:9px;width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--t3);cursor:pointer;margin-bottom:18px;font-size:13.5px}
.nsearch:hover{border-color:var(--line2);color:var(--t2)}.nsearch kbd{margin-left:auto}
.nlist{display:flex;flex-direction:column;gap:16px;flex:1}
.nfam{display:flex;flex-direction:column;gap:1px}
.fam{display:flex;align-items:center;gap:10px;padding:5px 10px;border:0;background:none;color:var(--t3);font:600 12.5px/1.3 var(--fb);cursor:pointer;border-radius:var(--r1);text-align:left;position:relative}
.fam:hover{color:var(--t1)}.nfam.on .fam{color:var(--t1)}.nfam.on .fam .ico{color:var(--ice)}
.nb{margin-left:auto;font:500 10.5px/1 var(--fm);font-style:normal;padding:3px 6px;border-radius:99px}
.nb.c{background:var(--crit-a);color:var(--crit)}.nb.w{background:var(--warn-a);color:var(--warn)}
.np{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;padding:6px 10px 6px 38px;border:0;background:none;color:var(--t2);border-radius:var(--r1);cursor:pointer;font-size:13.5px;text-align:left}
.np:hover{background:var(--raise);color:var(--t1)}
.np[aria-current=page]{background:var(--ice-a);color:var(--ice);font-weight:500}
.nfam.on .nb{display:none}
nav .cnt{display:flex;gap:4px}
nav .cnt i{font:500 10px/1 var(--fm);font-style:normal;padding:3px 6px;border-radius:99px}
nav .cnt .c{background:var(--crit-a);color:var(--crit)}nav .cnt .w{background:var(--warn-a);color:var(--warn)}
.nfoot{display:flex;align-items:center;gap:9px;width:100%;margin-top:16px;padding:10px;border:0;border-top:1px solid var(--line);background:none;color:var(--t3);font-size:12.5px;cursor:pointer;text-align:left}
.nfoot:hover{color:var(--t1)}.nfoot small{margin-left:auto;font-size:11.5px}
.dot{width:7px;height:7px;border-radius:50%;flex:none;background:var(--t3)}.dot.ok{background:var(--ok)}.dot.info{background:var(--ice)}.dot.warn{background:var(--warn)}.dot.crit{background:var(--crit)}

/* abas das páginas irmãs (iPad e celular) */
.ptabs{display:none;gap:2px;overflow-x:auto;padding:3px;border:1px solid var(--line);border-radius:var(--r2);background:var(--surf);width:fit-content;max-width:min(1180px,100%);margin:0 auto 18px;scrollbar-width:none}
.ptabs::-webkit-scrollbar{display:none}
.ptabs button{flex:none;border:0;background:none;color:var(--t2);padding:7px 13px;border-radius:9px;cursor:pointer;white-space:nowrap;font-size:13.5px}
.ptabs button:hover{color:var(--t1)}
.ptabs button[aria-selected=true]{background:var(--raise);color:var(--t1);font-weight:500;box-shadow:inset 0 1px 0 rgba(255,255,255,.04),0 1px 3px rgba(0,0,0,.35)}
.seg{display:flex;gap:2px;overflow-x:auto;padding:3px;border:1px solid var(--line);border-radius:var(--r2);background:var(--surf);width:fit-content;max-width:100%;scrollbar-width:none}.seg::-webkit-scrollbar{display:none}
.seg button{flex:none;border:0;background:none;color:var(--t2);padding:7px 13px;border-radius:9px;cursor:pointer;white-space:nowrap;font-size:13.5px;min-height:36px}.seg button:hover{color:var(--t1)}
.seg button[aria-selected=true]{background:var(--raise);color:var(--t1);font-weight:500;box-shadow:inset 0 1px 0 rgba(255,255,255,.04),0 1px 3px rgba(0,0,0,.35)}
.pghead{display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px 20px}.pghead>div:first-child{flex:1;min-width:240px}
.cphead{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center}.cphead input{max-width:none}
.cpmeta{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;margin-top:10px}.cpmeta select{width:auto;max-width:100%;flex:0 1 auto}
.cpnum,.cpg{display:inline-flex;align-items:center;gap:6px;margin:0}.cpnum input[type=number],.cpg input[type=number]{width:76px;min-width:0;flex:none}.cpnum span,.cpg span{color:var(--t3);font-size:12.5px;white-space:nowrap}
.cplist{display:flex;flex-direction:column;gap:8px;margin:12px 0 8px}.cpi{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:6px;align-items:center}.cpi select{min-width:0;width:100%}
.bxlist{display:flex;flex-direction:column;margin-top:6px}.bxrow{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:6px 14px;padding:10px 0;border-bottom:1px solid var(--line)}.bxrow:last-child{border-bottom:0}
.bxn b{display:block;font-weight:550;font-size:14px}.bxn small{color:var(--t3);font-size:12px}.bxin{display:flex;align-items:center;gap:6px}.bxin input{width:84px;text-align:right}.bxin span{color:var(--t3);font-size:12.5px}
.bxin input[type=number]{width:86px;min-width:0;flex:none;text-align:right}
.dcard>summary{display:flex;align-items:center;gap:10px;cursor:pointer;list-style:none;min-height:28px}.dcard>summary::-webkit-details-marker{display:none}.dcard>summary::after{content:"";margin-left:auto;flex:none;width:8px;height:8px;border-right:1.5px solid var(--t3);border-bottom:1.5px solid var(--t3);transform:rotate(45deg);transition:transform .15s}.dcard[open]>summary::after{transform:rotate(225deg)}

/* ---------- cabeçalho: receita, termômetro, índice, busca ---------- */
.hbrand{display:none}
.rcp{display:flex;flex-direction:column;min-width:0;flex:0 1 250px}
.rname,header input.rname{background:transparent;border:1px solid transparent;border-radius:var(--r1);font:600 17px/1.25 var(--fb);padding:3px 7px;margin-left:-8px;width:100%;color:var(--t1);text-overflow:ellipsis}
.rname:hover,header input.rname:hover{border-color:var(--line)}header input.rname:focus{border-color:var(--ice2);background:var(--surf);outline:none}
.rtype,header select.rtype{align-self:flex-start;background:transparent;border:0;box-shadow:none;color:var(--t2);font-size:12.5px;padding:1px 4px;margin-left:-5px;width:auto;max-width:100%;cursor:pointer}
.rtype:hover{color:var(--t1)}
output.ro,.rname.ro{display:block;font-weight:600;color:var(--t1);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border:0;margin:0;padding:2px 0}
.r-lbl{font-size:11.5px;color:var(--t3)}
.thermo{flex:1 1 560px;display:flex;align-items:center;gap:22px;min-width:0;max-width:760px;padding:8px 16px;border-radius:16px;background:rgba(255,255,255,.035);box-shadow:inset 0 0 0 .5px rgba(255,255,255,.08)}
.thermo{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text',var(--fb)}
/* leitura no estilo Apple: rótulo pequeno, valor grande com números tabulares, ajuste em cápsula logo abaixo */
.tq{display:grid;grid-template-columns:auto auto;grid-template-areas:"l l" "v s";align-items:center;column-gap:10px;row-gap:1px;flex:none}
.tq-l{grid-area:l;font-size:11.5px;font-weight:500;color:var(--t3);letter-spacing:.01em}
.tq-v{grid-area:v;display:flex;align-items:baseline;gap:2px;font-variant-numeric:tabular-nums}
.tq-v b{font:600 21px/1.1 -apple-system,BlinkMacSystemFont,'SF Pro Display',var(--fb);letter-spacing:-.02em;color:var(--t1)}
.tq-v span{font-size:12px;color:var(--t3);font-weight:500}
.tq.sec .tq-v b{font-size:17px;color:var(--t2)}
.ios-step{grid-area:s;display:flex;align-items:center;height:28px;border-radius:8px;background:rgba(255,255,255,.08);overflow:hidden}
.ios-step button{width:34px;height:100%;border:0;background:none;color:var(--t1);font:400 18px/1 -apple-system,BlinkMacSystemFont,var(--fb);cursor:pointer;padding:0}
.ios-step button:hover{background:rgba(255,255,255,.06)}.ios-step button:active{background:rgba(255,255,255,.14)}
.ios-step i{width:1px;height:16px;background:rgba(255,255,255,.14)}
.tbar{flex:1;min-width:180px;display:flex;flex-direction:column;gap:6px}
.tbar-cap{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-size:12px;color:var(--t3);white-space:nowrap;min-width:0}
.tbar-cap b{color:var(--t1);font-weight:600;font-variant-numeric:tabular-nums}
.tbar-cap em{font-style:normal;margin-left:6px;color:var(--t3);font-variant-numeric:tabular-nums}
.tbar-st{font-weight:500;overflow:hidden;text-overflow:ellipsis}.tbar-st.ok{color:var(--ok)}.tbar-st.warn{color:var(--warn)}.tbar-st.crit{color:var(--crit)}
.th-rail{position:relative;height:18px;cursor:pointer;touch-action:none;user-select:none;-webkit-user-select:none}
.th-track{position:absolute;left:0;right:0;top:6px;height:6px;border-radius:3px;background:rgba(255,255,255,.09)}
.th-band{position:absolute;top:6px;height:6px;border-radius:3px;background:linear-gradient(90deg,#38a0d4,#6ee7b7)}
.th-ideal{position:absolute;top:4px;width:2px;height:10px;margin-left:-1px;border-radius:1px;background:rgba(255,255,255,.55)}
.th-rail:focus-visible{outline:2px solid var(--ice);outline-offset:4px;border-radius:9px}
.th-dot{transition:left .2s cubic-bezier(.2,.7,.2,1);will-change:left}.th-rail.dragging .th-dot{transition:none}.th-rail.dragging{cursor:grabbing}
.th-dot{position:absolute;top:2px;width:14px;height:14px;margin-left:-7px;border-radius:50%;background:#fff;box-shadow:0 0 0 2.5px var(--bg),0 1px 4px rgba(0,0,0,.5)}
.th-dot.warn{box-shadow:0 0 0 2.5px var(--bg),0 0 0 4.5px var(--warn)}.th-dot.crit{box-shadow:0 0 0 2.5px var(--bg),0 0 0 4.5px var(--crit)}
.tbar-ax{display:flex;justify-content:space-between;font-size:10.5px;color:var(--t3);font-variant-numeric:tabular-nums;margin-top:-2px}
.hright{display:flex;align-items:center;gap:10px;margin-left:auto;flex:none}
.score{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surf);border-radius:var(--r2);padding:4px 12px 4px 5px;cursor:pointer;color:var(--t3)}
.score:hover{border-color:var(--line2)}
.score svg{width:30px;height:30px}.sc-bg{fill:none;stroke:var(--line2);stroke-width:3}.sc-fg{fill:none;stroke:currentColor;stroke-width:3;stroke-linecap:round}
.score.ok{color:var(--ok)}.score.warn{color:var(--warn)}.score.crit{color:var(--crit)}
.sc-v{font:500 17px/1 var(--fm);color:var(--t1);font-variant-numeric:tabular-nums}.sc-t{font-size:12px;color:var(--t2);white-space:nowrap}
.kbtn{display:flex;align-items:center;gap:8px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--surf);color:var(--t2);cursor:pointer;font-size:13.5px}
.kbtn:hover{border-color:var(--line2);color:var(--t1)}

/* ---------- tipografia ---------- */
h1{font:600 26px/1.15 var(--fb);font-stretch:90%;margin:0;letter-spacing:-.018em;text-wrap:balance}
h2{font:600 15px/1.3 var(--fb);color:var(--t1);margin:0 0 12px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
h2 .muted{font-weight:400;font-size:13px}
h3{font:600 14.5px/1.3 var(--fb);margin:0}
.lead{color:var(--t2);margin:6px 0 0;max-width:72ch;font-size:14.5px}
.lbl{font:500 12px/1.3 var(--fb);color:var(--t3)}
.note{font-size:12.5px;color:var(--t3);max-width:80ch;line-height:1.5}
.muted{color:var(--t3)}.t2{color:var(--t2)}
.c-ok{color:var(--ok)}.c-warn{color:var(--warn)}.c-crit{color:var(--crit)}.c-info{color:var(--info)}.c-ice{color:var(--ice)}.c-gold{color:var(--gold)}
.big{font:500 32px/1 var(--fm);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
svg text{font-family:var(--fm)}

/* ---------- superfícies ---------- */
.card{background:var(--surf);border:1px solid var(--line);border-radius:var(--r3);padding:18px;min-width:0}
.card.flat{background:transparent}
.card .card,.card .card.flat{background:var(--raise);border-color:transparent;border-radius:var(--r2)}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.tiles{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px}
.tile{background:var(--surf);border:1px solid var(--line);border-radius:var(--r2);padding:12px 13px;display:flex;flex-direction:column;gap:6px;min-width:0}
.tile .v{font:500 24px/1 var(--fm);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.tile .v small{font:500 12px var(--fm);color:var(--t3);margin-left:2px}
.tile .t{font:12px/1.3 var(--fb);color:var(--t3)}
.rb{position:relative;height:6px;border-radius:3px;background:var(--bg);overflow:hidden}
.rb .band{position:absolute;top:0;bottom:0;background:rgba(110,231,183,.22)}
.rb .pin{position:absolute;top:-2px;width:3px;height:10px;border-radius:2px;margin-left:-1.5px}
.tbl{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.tbl th{font:500 12px/1.3 var(--fb);color:var(--t3);text-align:left;padding:8px;border-bottom:1px solid var(--line)}
.tbl td{padding:8px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl tbody tr:hover td{background:rgba(255,255,255,.015)}
.tbl .r{text-align:right}.tbl .mono{font-family:var(--fm)}
.tw{overflow-x:auto;margin:0 -4px;padding:0 4px}
.tbl input[type=number]{width:96px;padding:6px 8px}
.kv{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
.kv:last-child{border-bottom:0}.kv span:first-child{color:var(--t2)}.kv span:last-child{font-family:var(--fm);text-align:right}

/* ---------- controles ---------- */
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
input[type=text],input[type=number],input[type=date],select,textarea{background:var(--bg);border:1px solid var(--line2);border-radius:var(--r1);padding:7px 10px;min-width:0;width:100%}
input[type=number]{font-family:var(--fm);font-variant-numeric:tabular-nums}
input:hover,select:hover,textarea:hover{border-color:#3a4f72}
input:focus,select:focus,textarea:focus{border-color:var(--ice2);outline:none;box-shadow:0 0 0 3px rgba(56,160,212,.18)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:8px 14px;border-radius:var(--r1);border:1px solid var(--line2);background:var(--raise);color:var(--t1);cursor:pointer;font-weight:500;font-size:13.5px;white-space:nowrap}
.btn:hover{background:var(--hov);border-color:#3a4f72}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.pri{background:var(--ice);border-color:var(--ice);color:var(--ink);font-weight:600}
.btn.pri:hover{background:#a5e2fd;border-color:#a5e2fd}
.btn.sm{padding:5px 10px;font-size:12.5px}
.btn.sm.pri{background:var(--ice-a);border-color:rgba(125,211,252,.35);color:var(--ice);font-weight:500}
.btn.sm.pri:hover{background:rgba(125,211,252,.2)}
.btn.okb{background:var(--ok-a);border-color:rgba(110,231,183,.4);color:var(--ok)}
.btn.okb:hover{background:rgba(110,231,183,.18)}
.btn.del{background:transparent;border-color:transparent;color:var(--t3);padding:5px 9px}
.btn.del:hover{background:var(--crit-a);border-color:rgba(251,113,133,.35);color:var(--crit)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--t2)}
.btn.wide{width:100%;padding:11px 14px;font-size:14px;margin-top:6px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.sp{flex:1}
.chip.nat{font-size:10.5px;font-weight:500;letter-spacing:.02em;color:var(--t2);border-style:dashed;vertical-align:2px;margin-left:6px;text-transform:none}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:99px;font:500 12px/1.4 var(--fb);border:1px solid var(--line2);background:var(--raise);white-space:nowrap;color:var(--t2)}
button.chip{cursor:pointer}
.chip.ok{color:var(--ok);border-color:rgba(110,231,183,.35);background:var(--ok-a)}
.chip.warn{color:var(--warn);border-color:rgba(251,191,36,.35);background:var(--warn-a)}
.chip.crit{color:var(--crit);border-color:rgba(251,113,133,.35);background:var(--crit-a)}
.chip.info{color:var(--info);border-color:rgba(167,139,250,.35);background:var(--info-a)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{border:1px solid var(--line2);background:transparent;color:var(--t2);border-radius:99px;padding:6px 12px;cursor:pointer;font-size:13px}

.form{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:14px}
.form .hint,.field .hint{font-size:11.5px;color:var(--t3);line-height:1.4}
.search{position:relative;flex:1;min-width:200px}
.res{position:absolute;z-index:20;left:0;right:0;top:calc(100% + 4px);background:var(--surf);border:1px solid var(--line2);border-radius:var(--r2);max-height:320px;overflow-y:auto;box-shadow:0 16px 36px rgba(0,0,0,.5);padding:4px}

.tag{font:500 11px/1.4 var(--fb);color:var(--t3);background:var(--bg);border-radius:5px;padding:2px 7px;white-space:nowrap}

/* ---------- laudo ---------- */
.find{display:grid;grid-template-columns:3px minmax(0,1fr);gap:14px;padding:14px 0;border-bottom:1px solid var(--line)}
.find:last-child{border-bottom:0}
.find .bar{border-radius:2px}
.find .area{font:500 12px/1 var(--fb);color:var(--t3)}
.find h3{margin:5px 0 4px}

.find .fix{margin-top:8px;padding:9px 12px;border-radius:var(--r1);background:var(--raise);color:var(--t1);max-width:80ch}
.find .fix b{color:var(--ice);font:600 12.5px var(--fb);margin-right:6px}
.find .acts .btn{white-space:normal;text-align:left;max-width:100%;height:auto;line-height:1.3;padding-top:7px;padding-bottom:7px}
.find>div{min-width:0}.find .acts .btn{box-sizing:border-box}
.find .acts{margin-top:8px}
.bar.crit{background:var(--crit)}.bar.warn{background:var(--warn)}.bar.info{background:var(--info)}.bar.ok{background:var(--ok)}

/* ---------- produção, rótulo e listas ---------- */
.check{display:flex;align-items:center;gap:14px;padding:12px;border:1px solid var(--line);border-radius:var(--r2);background:var(--surf);cursor:pointer;width:100%;text-align:left;color:var(--t1)}
.check .box{width:22px;height:22px;border:2px solid var(--line2);border-radius:6px;flex:none;display:grid;place-items:center}
.check[aria-pressed=true]{opacity:.5}.check[aria-pressed=true] .box{background:var(--ok);border-color:var(--ok);color:var(--bg)}
.check .w{margin-left:auto;font:500 18px/1 var(--fm);color:var(--ice);font-variant-numeric:tabular-nums}
.steps{counter-reset:s;display:flex;flex-direction:column;gap:8px;margin:0;padding:0;list-style:none}
.steps li{counter-increment:s;display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px}
.steps li::before{content:counter(s);width:24px;height:24px;border-radius:50%;background:var(--ice-a);color:var(--ice);display:grid;place-items:center;font:500 11px var(--fm)}
.lupa{display:inline-flex;flex-direction:column;border:2px solid #fff;background:#000;color:#fff;font:800 12px/1.15 Arial,Helvetica,sans-serif;text-transform:uppercase;min-width:150px}
.lupa .h{display:flex;align-items:center;gap:6px;padding:5px 8px;border-bottom:2px solid #fff;font-size:10px}
.lupa .i{padding:5px 8px;border-bottom:1px solid #fff}.lupa .i:last-child{border-bottom:0}
.nut{background:#fff;color:#111;border:2px solid #111;border-radius:2px;padding:10px;max-width:460px;font-family:Arial,Helvetica,sans-serif}
.nut table{width:100%;border-collapse:collapse;font-size:12px}
.nut th,.nut td{border-bottom:1px solid #111;padding:3px 4px;text-align:right}
.nut th:first-child,.nut td:first-child{text-align:left}
.nut .in{padding-left:14px}
.nut caption{font-weight:800;font-size:15px;text-align:left;padding-bottom:4px;border-bottom:4px solid #111}
.al{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.al div{border:1px solid var(--line);border-radius:var(--r1);padding:8px 4px;text-align:center;font-size:11.5px;color:var(--t3);background:var(--bg)}
.al div.on{border-color:rgba(251,113,133,.55);color:var(--crit);background:var(--crit-a);font-weight:600}
.pills{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.pill2{display:grid;grid-template-columns:10px minmax(0,1fr);column-gap:8px;padding:9px 11px;border:1px solid var(--line);border-radius:var(--r2);background:var(--bg)}
.pill2 .dot{grid-row:1/3;width:8px;height:8px;border-radius:50%;margin-top:5px;background:var(--t3)}
.pill2 .n{font-size:12.5px;color:var(--t2)}.pill2 .v{font:500 12px var(--fm);color:var(--t1)}
.pill2.ok .dot{background:var(--ok)}.pill2.warn .dot{background:var(--warn)}.pill2.crit .dot{background:var(--crit)}.pill2.info .dot{background:var(--t3)}
.pill2.crit{border-color:rgba(251,113,133,.35)}.pill2.warn{border-color:rgba(251,191,36,.3)}
button.pill2{font:inherit;color:inherit;width:100%}button.pill2[aria-pressed=true]{border-color:var(--ice);box-shadow:0 0 0 1px var(--ice) inset}
.seal{display:flex;align-items:center;gap:12px;padding:11px 13px;margin-bottom:12px;border:1px solid rgba(110,231,183,.45);border-radius:var(--r2);background:var(--ok-a)}
.seal b{display:block;color:var(--ok);font:600 14.5px var(--fb)}.seal span{font-size:12.5px;color:var(--t2)}

/* ---------- creator ---------- */
.crgrid{display:grid;grid-template-columns:minmax(280px,360px) minmax(0,1fr);gap:16px;align-items:start}
.crleft{position:sticky;top:0}
.crcenter{display:flex;flex-direction:column;gap:16px;min-width:0}
.crlist{display:flex;flex-direction:column;gap:6px;max-height:520px;overflow-y:auto;margin:0 -4px;padding:0 4px}

.crrow .nm{font-weight:500;font-size:13px;min-width:0;line-height:1.3}.crrow .nm small{display:block;font-weight:400;font-size:11.5px;color:var(--t3)}
.crrow .sw{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:6px;vertical-align:1px}
.stp{display:flex;align-items:center;border:1px solid var(--line2);border-radius:var(--r1);overflow:hidden}
.stp button{width:28px;height:30px;border:0;background:var(--raise);color:var(--ice);cursor:pointer;font-size:15px}

.stp input[type=number]{width:66px;border:0;border-radius:0;text-align:center;padding:5px 2px;background:var(--bg);box-shadow:none}
.simhost{width:100%;line-height:0;background:#070b13;border-radius:var(--r2) var(--r2) 0 0;overflow:hidden}

/* bancada em duas colunas */
.bgrid{display:flex;flex-direction:column;gap:16px}.bcol{display:flex;flex-direction:column;gap:16px;min-width:0}

/* ---------- paleta de comandos ---------- */
.pal-bg{position:fixed;inset:0;background:rgba(3,6,12,.62);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);z-index:60}
.pal{position:fixed;z-index:61;left:50%;top:11vh;transform:translateX(-50%);width:min(640px,calc(100vw - 24px));max-height:72vh;display:flex;flex-direction:column;overflow:hidden;background:var(--surf);border:1px solid var(--line2);border-radius:18px;box-shadow:0 30px 70px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.04)}
.pal-in{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line);color:var(--t3)}

.pal-l{overflow-y:auto;padding:6px}
.pal-g{font:500 12px/1 var(--fb);color:var(--t3);padding:12px 10px 6px}
.pal-l button{display:flex;align-items:center;gap:12px;width:100%;padding:9px 10px;border:0;background:none;border-radius:10px;color:var(--t1);text-align:left;cursor:pointer;font-size:14px}

.pal-l button[aria-selected=true]{background:var(--ice-a)}.pal-l button[aria-selected=true] .ico{color:var(--ice)}
.pal-l button:hover{background:var(--raise)}
.pal-t{flex:1;min-width:0;display:flex;gap:10px;align-items:baseline;overflow:hidden;white-space:nowrap}
.pal-t small{color:var(--t3);font-size:12.5px;overflow:hidden;text-overflow:ellipsis}
.pal-empty{color:var(--t3);padding:18px 12px;margin:0}
.pal-f{display:flex;flex-wrap:wrap;gap:6px 18px;padding:10px 16px;border-top:1px solid var(--line);font-size:12px;color:var(--t3)}
.pal-f kbd{margin-right:3px}

/* ---------- aviso ---------- */
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);display:flex;align-items:center;gap:14px;background:var(--raise);border:1px solid var(--line2);color:var(--t1);padding:10px 12px 10px 16px;border-radius:12px;font-size:13.5px;z-index:70;box-shadow:0 14px 34px rgba(0,0,0,.5);max-width:calc(100vw - 24px)}
.toast[hidden]{display:none}

}

/* ---------- CURVA DE DEPRESSÃO DO PONTO DE CONGELAMENTO (v17.9) ----------
   Até 180 g de equivalente de sacarose por 100 g de água: tabela completa de Goff–Hartel (passo de 3 g, Univ. de Guelph).
   Acima disso (freezer, abatedor, fase concentrada): atividade de água pela equação de Norrish para sacarose (K = −6,47)
   e equação de Clausius–Clapeyron integrada (ΔHf 6008 J/mol), emendada à tabela em 180 g. Confere com o Tm′ da sacarose
   (≈ −35 °C a 80% m/m). Antes (até v17.8) a curva era estendida em linha reta acima de 180 g e subestimava a depressão
   no freezer (−20 °C: ~4 °C a menos na fase concentrada).
   Sais do leite pelo termo de Leighton: 2,37 × MSNF / água.

/* ---------- TEXTURA NA COLHER E PONTO DE QUENELLE (v17.9) ----------

   e o ar dilui esse volume. Por isso dois gelatos com o mesmo % de água congelada não têm a mesma dureza: o sorbet
   (mais água, menos ar) tem ~0,50 de gelo em volume no ponto, a crema ~0,38.
   Quenelle: a massa precisa ser plástica (moldar sem rachar), coesa (não esfarelar) e segurar a forma no prato.

/* ---------- MAESTRO GELATIERE (Maqp1): carga × tempo, saída por receita, pré-resfriamento (v17.10) ----------

   + calor latente do gelo formado (334 kJ/kg). A capacidade líquida da máquina (W) sai do ciclo que você usa
   (carga e minutos do Processo; de fábrica: 1 L de retirada ≈ 1,1 kg em ~15 min). Sem pré-resfriar, a máquina
   ainda gasta energia esfriando o tanque de inox (~1,2 kg de aço, estimativa). Alvo de saída: 35% da água
   congelada no centro (cada grau abaixo do ponto de congelamento vale ~12–15 pontos de gelo nesse trecho).

function score(st,m,F){if(F===m._F)return m._sc||(m._sc=scoreCore(st,m,F));return scoreCore(st,m,F);}
function scoreCore(st,m,F){

 const parts=[
  ['Congelamento',22,rangeScore(m.fzVit,P.fz,10)],
  ['Doçura',12,rangeScore(m.pod,P.pod,5)],
  ['Sólidos',14,rangeScore(m.sol,P.sol,6)],
  ['Estrutura',10,st.tipo==='sorbetto'?rangeScore(m.fat,P.fat,3):(rangeScore(m.fat,P.fat,4)*.6+rangeScore(m.prot,P.prot,2.5)*.4)],
  ['Lactose',12,m.lac>0?clamp(1-(m.lacW-9)/3,0,1):1],
  ['Estabilização',10,(m.hydro>.02||m.keyPct.starch>.3)?rangeScore(m.hydro,P.stab,P.stab[1]):.3],
  ['Processo',12,m.ci/100*.6+clamp(1-Math.max(0,4-m.pr.matH)/4,0,1)*.4],
  ['Segurança',8,F.some(f=>f.sev==='crit'&&f.area==='Segurança')?0:1]

/* ===================== BALANCEADOR DE AÇÚCARES =====================
   Resolve sacarose (S), dextrose (D) e maltodextrina DE19 (M) para atingir ao mesmo tempo:
   congelamento-alvo na vitrine, POD-alvo e sólidos-alvo. Sistema linear 3×3 iterado. */
function solve3(a,b){const d=x=>x[0][0]*(x[1][1]*x[2][2]-x[1][2]*x[2][1])-x[0][1]*(x[1][0]*x[2][2]-x[1][2]*x[2][0])+x[0][2]*(x[1][0]*x[2][1]-x[1][1]*x[2][0]);
 const D=d(a);if(Math.abs(D)<1e-9)return null;return[0,1,2].map(i=>{const c=a.map((r,k)=>r.map((v,j)=>j===i?b[k]:v));return d(c)/D;});}

function balanceExact(st){
 const P=PROF[st.tipo];if(!P||st.tipo==='gastro'||st.tipo==='semacucar')return{ok:false,msg:'O balanceador automático trabalha com açúcares convencionais (crema, frutta, sorbetto e vegano).'};
 const dexId=dexPref(st);
 const ctrl=['sacarose',dexId,'malto'];
 const rest={...st,recipe:(st.recipe||[]).filter(r=>!ctrl.includes(r.id))};
 const m0=analyze(rest);if(m0.empty)return{ok:false,msg:'Adicione a base da receita primeiro.'};
 const dx=ING_BY[dexId].c,mx=ING_BY.malto.c;
 const pS=99.9,pD=dx.glu*1.9,pM=mx.gs*1.9*19/100;
 const oS=99.9,oD=dx.glu*.7,oM=mx.gs*.9*19/100;
 const sS=.999,sD=dx.glu/100,sM=mx.gs/100,wD=dx.w/100,wM=mx.w/100;
 const R=m0.A.tot,W0=m0.A.w,PAC0=m0.A.pac-m0.hfAbs,POD0=m0.A.pod,SOL0=R-W0-m0.A.alc;
 const mc=analyze(st),Pp=mc.P;const podT=(Pp.pod[0]+Pp.pod[1])/2/100,solT=clamp(mc.sol,Pp.sol[0]+.5,Pp.sol[1]-.5)/100,fzT=(Pp.fz[0]+Pp.fz[1])/2;
 let x=[0,0,0],mode='3';
 let S=m0.S;
 for(let it=0;it<6;it++){
  const se=seRequired(+st.vit,fzT,S)/100;
  // PAC: pS S + pD D + pM M - se*(wD D + wM M) = se*W0 - PAC0   (pac por 100 g de ingrediente → /100)
  const r1=[pS/100,pD/100-se*wD,pM/100-se*wM],b1=se*W0-PAC0;
  const r2=[oS/100-podT,oD/100-podT,oM/100-podT],b2=podT*R-POD0;
  const r3=[sS-solT,sD-solT,sM-solT],b3=solT*R-SOL0;
  let s=solve3([r1,r2,r3],[b1,b2,b3]);mode='3';
  if(!s||s.some(v=>v<-.5)){const t=solve2([r1.slice(0,2),r2.slice(0,2)],[b1,b2]);s=t?[t[0],t[1],0]:null;mode='2';}
  if(!s||s.some(v=>v<-.5)){const t=solve2([r1.slice(0,2),r3.slice(0,2)],[b1,b3]);s=t?[t[0],t[1],0]:null;mode='2s';}
  if(!s||s.some(v=>v<-.5))return{ok:false,msg:'Não há combinação de sacarose, dextrose e maltodextrina que atinja os três alvos com a base atual. Ajuste primeiro a base (água, gordura, sólidos) ou a temperatura da vitrine.'};
  x=s.map(v=>Math.max(0,v));
  const W=W0+wD*x[1]+wM*x[2],ms=(m0.A.msnf)/(R+x[0]+x[1]+x[2])*100,wp=W/(R+x[0]+x[1]+x[2])*100;S=wp>0?2.37*ms/wp:0;
 }
 const prop=[{id:'sacarose',g:x[0]},{id:dexId,g:x[1]},{id:'malto',g:x[2]}];
 const cur=ctrl.map(id=>{const r=(st.recipe||[]).find(q=>q.id===id);return r?+r.g:0;});
 const newRecipe=(st.recipe||[]).filter(r=>!ctrl.includes(r.id)).concat(prop.filter(p=>p.g>=.5).map(p=>({id:p.id,g:Math.round(p.g*10)/10})));
 const m1=analyze({...st,recipe:newRecipe});
 return{ok:true,mode,prop,cur,ctrl,newRecipe,m1};
}

/* Balanceador: tenta a solução exata com três açúcares; se ela não existe (ou deixa a doçura fora da faixa),
   busca o melhor compromisso com sacarose, dextrose, maltodextrina e o líquido da base, sempre com o congelamento
   na temperatura de serviço como prioridade, e termina com um ajuste fino iterativo até o congelamento bater. */
function balance(st){const ex=balanceExact(st);
 if(ex.ok&&ex.mode!=='2s')return ex;
 const P=PROF[st.tipo];if(!P||st.tipo==='gastro'||st.tipo==='semacucar')return ex;
 const rb=balanceRobust(st);if(!rb.ok)return ex.ok?ex:rb;
 if(ex.ok){const sc=b=>Math.abs(b.m1.fzVit-b.m1.fzMid)*10+(b.mode==='aprox'?(b.prop[b.prop.length-1].g-b.cur[b.cur.length-1])/Math.max(1,b.m1.tot)*12:0)+Math.max(0,b.m1.P.pod[0]-b.m1.pod,b.m1.pod-b.m1.P.pod[1])+Math.max(0,b.m1.P.sol[0]-b.m1.sol,b.m1.sol-b.m1.P.sol[1])*.5;return sc(rb)<sc(ex)-.05?rb:ex;}
 return rb;}
const BAL_SUG=new Set(['glicose38','glicose60','xarope40','invertido','frutose','trealose','dextrose','dextrosem']);
const _COEF=new Map();
function ingCoef(id,st){const key=id+'|'+((st.brix||{})[id]||'')+'|'+ING_VER;if(_COEF.has(key))return _COEF.get(key);
 const m=analyzeRaw({tipo:st.tipo,vit:-13,recipe:[{id,g:100}],proc:Object.assign({},st.proc,{lossPct:0}),brix:st.brix||{},costs:{}});const A=m.A;

/* mínimos quadrados ponderados com variáveis ≥ 0 (enumera os conjuntos ativos: no máximo 4 variáveis) */
function nnlsSmall(cols,b,w){const n=cols.length,m=b.length;let best=null;
 const cost=x=>{let c=0;for(let r=0;r<m;r++){let v=-b[r];for(let j=0;j<n;j++)v+=cols[j][r]*x[j];c+=w[r]*w[r]*v*v;}return c;};
 const zero=new Array(n).fill(0);best={x:zero,c:cost(zero)};
 for(let mask=1;mask<(1<<n);mask++){const idx=[];for(let j=0;j<n;j++)if(mask&(1<<j))idx.push(j);if(idx.length>m)continue;const k=idx.length;
  const M=[],v=[];for(let a=0;a<k;a++){M.push([]);let s=0;for(let r=0;r<m;r++)s+=w[r]*w[r]*cols[idx[a]][r]*b[r];v.push(s);for(let c=0;c<k;c++){let t=0;for(let r=0;r<m;r++)t+=w[r]*w[r]*cols[idx[a]][r]*cols[idx[c]][r];M[a].push(t);}}
  const sol=gaussSolve(M,v);if(!sol||sol.some(q=>q<-1e-9||!isFinite(q)))continue;const x=new Array(n).fill(0);idx.forEach((j,a)=>x[j]=Math.max(0,sol[a]));const c=cost(x);if(c<best.c-1e-12)best={x,c};}
 return best.x;}
function gaussSolve(M,v){const n=v.length,A=M.map((r,i)=>[...r,v[i]]);for(let c=0;c<n;c++){let p=c;for(let r=c+1;r<n;r++)if(Math.abs(A[r][c])>Math.abs(A[p][c]))p=r;if(Math.abs(A[p][c])<1e-12)return null;[A[c],A[p]]=[A[p],A[c]];
  for(let r=0;r<n;r++){if(r===c)continue;const f=A[r][c]/A[c][c];for(let k=c;k<=n;k++)A[r][k]-=f*A[c][k];}}return A.map((r,i)=>r[n]/r[i]);}
function balanceRobust(st){

 const sug=[...new Set(['sacarose',dexId,'malto',...(st.recipe||[]).map(r=>r.id).filter(id=>BAL_SUG.has(id))])];const D=sug.length;

  const cols=C.map(c=>[(c.pac-se*c.w)/R,(c.pod-podT)/R,(c.sol-solT)/R]);const b=[(se*W0-PAC0)/R,(podT*R-POD0)/R,(solT*R-SOL0)/R];

 if(x[D]>=.5)notes.push('entram '+f0(x[D])+' g de '+ING_BY[dil].n.toLowerCase()+' para diluir');
 const prop=ctrl.map((id,j)=>({id,g:j===D?+dil0+x[D]:x[j]}));const cur=ctrl.map(id=>{const r=(st.recipe||[]).find(q=>q.id===id);return r?+r.g:0;});

function sweep(st,id,lo,hi,n){const r=(st.recipe||[]).find(x=>x.id===id);if(!r)return[];const base=+r.g;const out=[];
 for(let i=0;i<n;i++){const k=lo+(hi-lo)*i/(n-1);const g=Math.max(0,Math.round(base*(1+k/100)*10)/10);const s2=stReal({...st,recipe:st.recipe.map(x=>x.id===id?{...x,g}:x)});const m=analyze(s2);const F=diagnose(s2,m);out.push({k,g,fz:m.fzVit,pod:m.pod,sol:m.sol,sc:score(s2,m,F).total,serve:m.serveT,fat:m.fat});}
 return out;}


/* ---------- VITRINE ---------- */
function vitrineAnalysis(items,temp){return items.map(it=>{const st={tipo:it.tipo,vit:temp,recipe:it.recipe,proc:it.proc||PROC0,brix:{},costs:{}};const m=analyze(st);const F=diagnose(st,m);return{it,st,m,sc:score(st,m,F).total,dev:m.serveT-temp};});}
function bestVitrineTemp(rows){const v=rows.map(r=>r.m.serveT).filter(x=>isFinite(x)).sort((a,b)=>a-b);if(!v.length)return -13;const med=v[Math.floor(v.length/2)];return Math.round(med*2)/2;}

/* ---------- PLANEJAMENTO E ESTOQUE ---------- */
/* saldo por ingrediente (puro: pode ser chamado no render) */
/* v18 · ESTOQUE POR MOVIMENTOS. Até a v17.12 a baixa reduzia o saldo (qty) dentro do registro da entrada e regravava
   o registro inteiro: duas baixas em aparelhos diferentes se sobrescreviam (vence o último) e baixar o mesmo lote duas
   vezes descontava duas vezes. Agora a entrada guarda a quantidade recebida e cada baixa é um registro próprio
   {kind:'mov'} com id determinístico (lote + ingrediente + entrada): só é inserido, nunca alterado, então baixas
   concorrentes se somam e repetir a baixa de um lote não desconta de novo. Saldo = entrada − soma dos movimentos.
   Entradas antigas já trazem o saldo descontado e continuam valendo como estão. */
const isMov=e=>!!e&&e.kind==='mov';
function invLeft(inv){const used={};(inv||[]).forEach(e=>{if(isMov(e))used[e.entry]=(used[e.entry]||0)+(+e.g||0);});
 const left=new Map();(inv||[]).forEach(e=>{if(!isMov(e))left.set(String(e.id),Math.max(0,(+e.qty||0)-(used[e.id]||0)));});return left;}
/* entradas com o saldo atual em qty (cópias: só para leitura) */
function invEntries(inv){const L=invLeft(inv);return(inv||[]).filter(e=>!isMov(e)).map(e=>Object.assign({},e,{qty:L.get(String(e.id))}));}
function invStock(inv){const by={};invEntries(inv).forEach(e=>{if(+e.qty<=0)return;const b=by[e.ingId]=by[e.ingId]||{q:0,c:0};b.q+=+e.qty;b.c+=+e.qty*(+e.costKg||0);});return by;}
/* custo médio ponderado do estoque → custos das receitas; só invalida a memória de cálculo se mudou */
function invRecompute(inv){const by=invStock(inv);const nc={};for(const k in by)if(by[k].q>0&&by[k].c>0)nc[k]=by[k].c/by[k].q;
 if(JSON.stringify(nc)!==JSON.stringify(INVCOST)){INVCOST=nc;INVVER++;}return by;}
function planNeeds(plan,getRec,cap){const need={},runs=[];(plan||[]).forEach(p=>{const r=getRec(p);if(!r||!(+p.kg>0))return;const tot=r.recipe.reduce((a,x)=>a+(+x.g||0),0)||1;const g=+p.kg*1000;const f=g/tot;
  r.recipe.forEach(x=>{need[x.id]=(need[x.id]||0)+x.g*f;});runs.push({name:r.name,g,cycles:cap?Math.ceil(g/cap):1,perCycle:cap?g/Math.ceil(g/cap):g});});return{need,runs};}
/* baixa FEFO de g gramas do ingrediente id para o lote lotId: devolve os movimentos a gravar (não altera nada).
   Se o lote já tem baixa desse ingrediente, não desconta de novo (already). */
function consumeFIFO(inv,id,g,lotId){const tag=String(lotId||'x');
 if((inv||[]).some(e=>isMov(e)&&e.ingId===id&&String(e.lot)===tag))return{rest:0,movs:[],already:true,firstLot:''};
 let rest=+g||0;const movs=[];let firstLot='';
 invEntries(inv).filter(e=>e.ingId===id&&+e.qty>0).sort((a,b)=>String(a.exp||'9999').localeCompare(String(b.exp||'9999'))).forEach(e=>{if(rest<=0)return;const t=Math.min(+e.qty,rest);
  if(!movs.length)firstLot=e.lot||'';movs.push({id:('M-'+tag+'-'+id+'-'+e.id).slice(0,120),kind:'mov',entry:String(e.id),ingId:id,g:Math.round(t*10)/10,lot:tag});rest-=t;});
 return{rest,movs,already:false,firstLot};}

/* ==== 35-tests.js ==== */
/* ===================== IL FREDOLIN · BATERIA DE TESTES =====================
   Roda igual no Node (antes de publicar) e dentro do app (Dados e sincronização → Testes do motor).
   Usa todas as receitas dos mestres e as bases como referência fixa. A calibração pelos lotes do usuário
   fica desligada durante os testes, para que o resultado dependa só do motor. */
const TEST_VITS=[-11,-14.5,-18];
const GOLD_KEYS=['sol','fat','pod','pacKg','fzVit','serveT','ov','visc','ph','shelfVit'];
function testRecipes(){const out=[];
 MASTERS.forEach((p,k)=>out.push({key:'mas'+k,name:p.a+' · '+p.name,tipo:p.tipo,vit:p.vit,recipe:p.recipe.map(([id,g])=>({id,g}))}));
 PRESETS.forEach((p,k)=>out.push({key:'pre'+k,name:'Base · '+p.name,tipo:p.tipo,vit:p.vit,recipe:p.recipe.map(([id,g])=>({id,g}))}));
 return out;}
const stTest=(r,vit,proc)=>({tipo:r.tipo,vit:vit!=null?vit:r.vit,recipe:r.recipe,proc:Object.assign({},PROC0,proc||{}),brix:{},costs:{}});
function applyOps(recipe,ops){const rec=recipe.map(x=>({...x}));ops.forEach(([id,d])=>{const r=rec.find(x=>x.id===id);if(r)r.g=+r.g+d;else rec.push({id,g:d});});return rec.filter(r=>r.g>1e-9);}
function badNums(m){const bad=[];for(const k in m){const v=m[k];if(typeof v==='number'&&!isFinite(v))bad.push(k);}for(const k in m.nut)if(!isFinite(m.nut[k]))bad.push('nut.'+k);return bad;}
const badText=s=>/NaN|undefined|Infinity|\[object/.test(s);

function runTests(opt){opt=opt||{};const t0=(typeof performance!=='undefined'?performance:Date).now();
 const list=[];const T=(group,name,fn)=>{let ok,detail;try{const r=fn();ok=r===true||(r&&r.ok);detail=r&&r.detail||'';}catch(e){ok=false;detail='erro: '+(e&&e.message||e);}list.push({group,name,ok,detail});};
 const calPrev=CAL.on;CAL.on=false;
 try{
 const recs=testRecipes();
 /* ---- 1. banco de ingredientes ---- */
 T('Dados','Composição de cada ingrediente do banco soma 98–100,6%',()=>{const bad=ING.filter(i=>{if(i.custom)return false;const t=MASS.reduce((a,f)=>a+(i.c[f]||0),0);return t<98||t>100.6;});return{ok:!bad.length,detail:bad.length?bad.map(i=>i.id).join(', '):ING.length+' ingredientes'};});
 T('Dados','Ids únicos e receitas só com ingredientes do banco',()=>{const ids=new Set();const dup=[];ING.forEach(i=>{if(ids.has(i.id))dup.push(i.id);ids.add(i.id);});const miss=[];recs.forEach(r=>r.recipe.forEach(x=>{if(!ING_BY[x.id])miss.push(r.name+': '+x.id);}));return{ok:!dup.length&&!miss.length,detail:[...dup,...miss].join('; ')||recs.length+' receitas'};});
 T('Dados','pH só em faixa física (2–7,5)',()=>{const bad=ING.filter(i=>i.ph!=null&&(i.ph<2||i.ph>7.5));return{ok:!bad.length,detail:bad.map(i=>i.id).join(', ')};});
 /* ---- 2. física ---- */
 T('Física','Curva Goff–Hartel crescente e invertível',()=>{let prev=-1;for(let se=0;se<=300;se+=5){const d=fpdSE(se);if(d<prev)return{ok:false,detail:'decresce em SE '+se};prev=d;if(se>0&&Math.abs(seFromFpd(d)-se)>.01)return{ok:false,detail:'inversa falha em SE '+se};}return true;});
 T('Física','Âncora: sacarose 64% (180 g/100 g de água) a −13,7 °C (Goff–Hartel)',()=>{const d=fpdSE(180);return{ok:Math.abs(d-13.68)<.02,detail:'FPD '+f2(d)+' °C'};});
 T('Física','Âncora: sacarose 80% (Cg′) perto do Tm′ de −32 a −36 °C',()=>{const d=fpdSE(400);return{ok:d>32&&d<36,detail:'FPD '+f1(d)+' °C'};});
 T('Física','Água não congelável: fração congelada para no limite do Cg′',()=>{const SE=60;const f=frozenPct(-60,SE,0);return{ok:Math.abs(f-(1-SE/SE_CG)*100)<.5,detail:f1(f)+'%'};});
 T('Física','Âncora: sacarose 10% em água congela a ≈ −0,6 °C',()=>{const se=10/90*100;const d=fpdSE(se);return{ok:d>.55&&d<.75,detail:'FPD '+f2(d)+' °C'};});
 T('Física','Âncora: leite integral congela a ≈ −0,52 °C',()=>{const m=analyzeRaw(stTest({tipo:'crema',recipe:[{id:'leite',g:1000}]},-13));return{ok:m.fp<-.45&&m.fp>-.62,detail:'ponto de congelamento '+f2(m.fp)+' °C'};});
 T('Física','Fração congelada cresce com o frio e inverte tempForFrozen',()=>{const SE=60,Sx=.8;let prev=-1;for(let t=-1;t>=-30;t-=.5){const f=frozenPct(t,SE,Sx);if(f<prev-1e-9)return{ok:false,detail:'não monotônica em '+t};prev=f;}for(const p of [40,55,68,74,85]){const t=tempForFrozen(p,SE,Sx);const back=frozenPct(t,SE,Sx);if(Math.abs(back-p)>.05)return{ok:false,detail:p+'% → '+t.toFixed(2)+' °C → '+back.toFixed(2)+'%'};}return true;});
 T('Física','Âncora Corvitto: fiordilatte serve entre −14 e −10 °C',()=>{const r=recs.find(x=>x.key==='pre0');const m=analyzeRaw(stTest(r));return{ok:m.serveT<-10&&m.serveT>-14,detail:'serviço '+f1(m.serveT)+' °C, PAC '+f0(m.pacKg)+'/kg'};});
 T('Física','Mais dextrose → mais mole; mais creme → mais gordura',()=>{const r=recs.find(x=>x.key==='pre0');const base=analyzeRaw(stTest(r));const dx=analyzeRaw(stTest({...r,recipe:applyOps(r.recipe,[['dextrose',30]])}));const cr=analyzeRaw(stTest({...r,recipe:applyOps(r.recipe,[['creme35',80]])}));return{ok:dx.fzVit<base.fzVit&&cr.fat>base.fat&&dx.SE>base.SE,detail:'congelada '+f1(base.fzVit)+' → '+f1(dx.fzVit)+'%'};});
 /* ---- 3. todas as receitas em três vitrines e no modo freezer ---- */
 T('Receitas',MASTERS.length+' mestres + '+PRESETS.length+' bases sem valores inválidos em 4 condições',()=>{const bad=[];let n=0;recs.forEach(r=>{[...TEST_VITS.map(v=>[v,{}]),[-18,{serveFrom:'freezer',storeT:-18,storeFluct:3}]].forEach(([v,pr])=>{const st=stTest(r,v,pr);const m=analyze(st);n++;const b=badNums(m);if(b.length)bad.push(r.name+' '+v+': '+b.join(','));});});return{ok:!bad.length,detail:bad.slice(0,3).join('; ')||n+' análises'};});
 T('Receitas','Laudo, índice e defeitos com texto válido',()=>{const bad=[];recs.forEach(r=>TEST_VITS.forEach(v=>{const st=stTest(r,v);const m=analyze(st);const F=diagnose(st,m);const sc=score(st,m,F);if(!(sc.total>=0&&sc.total<=100))bad.push(r.name+': índice '+sc.total);F.forEach(f=>{if(badText(f.title+f.why+f.fix))bad.push(r.name+': '+f.title);});DEFECTS.forEach(d=>rankDefect(d,m).forEach(x=>{if(badText(x.txt+x.fix))bad.push(r.name+': defeito '+d.id);}));}));return{ok:!bad.length,detail:bad.slice(0,3).join('; ')};});
 T('Receitas','Nenhuma sugestão de "0 g" ou gramas negativas',()=>{const bad=[];recs.forEach(r=>TEST_VITS.forEach(v=>{const st=stTest(r,v);const m=analyze(st);diagnose(st,m).forEach(f=>{const s=(f.fix||'')+(f.acts||[]).map(a=>a.t).join(' ');if(/(^|[^\d,])0 g\b|−\d+ g de|-\d+ g de/.test(s))bad.push(r.name+' '+v+': '+f.title);});}));return{ok:!bad.length,detail:bad.slice(0,3).join('; ')};});
 /* ---- 4. as soluções do laudo funcionam ---- */
 T('Soluções','Texto da solução e botões mostram as mesmas gramas (vitrine e pote, dextrose mono e anidra)',()=>{let n=0;const bad=[];
  try{['mono','anid'].forEach(df=>{DEX_OVR=df;recs.forEach(r=>[-14.5,-18].forEach(v=>['vitrine','pote'].forEach(sf=>{const st=stReal(stTest(r,v,{serveFrom:sf}));const m=analyze(st);diagnose(st,m).filter(f=>f.acts&&f.acts.length).forEach(f=>f.acts.forEach(a=>{n++;(a.t.match(/(\d+|menos de 1) g/g)||[]).forEach(x=>{if(f.fix.indexOf(x)<0)bad.push(r.name+' '+v+' '+sf+': "'+a.t+'" ≠ texto');});
    const ing=a.ops.map(o=>o[0]).find(id=>id==='dextrose'||id==='dextrosem');if(ing){const nm=ing==='dextrosem'?'mono':'anidra';if(a.t.indexOf(nm)<0||f.fix.indexOf(nm)<0)bad.push(r.name+': nome da dextrose não bate com o ingrediente');
     if(!r.recipe.some(x=>x.id==='dextrose'||x.id==='dextrosem')&&ing!==(df==='anid'?'dextrose':'dextrosem'))bad.push(r.name+': ignorou a preferência de dextrose');}}));})));});}
  finally{DEX_OVR=null;}
  return{ok:!bad.length,detail:bad.slice(0,3).join('; ')||n+' botões conferidos com o texto'};});
 T('Soluções','Ajustes térmicos também resolvem no modo pote e com dextrose monoidratada',()=>{let n=0;const bad=[];
  try{DEX_OVR='mono';recs.forEach(r=>[-14.5,-18].forEach(v=>['vitrine','pote'].forEach(sf=>{const s0=stTest(r,v,{serveFrom:sf}),st=stReal(s0);const m=analyze(st);diagnose(st,m).filter(f=>f.acts).forEach(f=>f.acts.forEach(a=>{n++;const m2=analyze(stReal({...s0,recipe:applyOps(s0.recipe,a.ops)}));const dz=m2.fzVit-m2.fzMid;if(Math.abs(dz)>3.2)bad.push(r.name+' '+v+' '+sf+' · '+a.t+' → '+f1(m2.fzVit)+'%');}));})));}
  finally{DEX_OVR=null;}
  return{ok:!bad.length,detail:bad.slice(0,3).join('; ')||n+' ajustes verificados'};});
 T('Soluções','Cada ajuste térmico sugerido leva à faixa de congelamento',()=>{let n=0;const bad=[];recs.forEach(r=>TEST_VITS.forEach(v=>{const st=stTest(r,v);const m=analyze(st);diagnose(st,m).filter(f=>f.acts).forEach(f=>f.acts.forEach(a=>{n++;const m2=analyze({...st,recipe:applyOps(st.recipe,a.ops)});const dz=m2.fzVit-m2.fzMid;if(Math.abs(dz)>3.2)bad.push(r.name+' '+v+' °C · '+a.t+' → '+f1(m2.fzVit)+'%');if(a.ops.some(([id,d])=>{const x=st.recipe.find(y=>y.id===id);return d<0&&(!x||+x.g+d<-1e-6);}))bad.push(r.name+': retira mais do que existe');}));}));return{ok:!bad.length,detail:bad.slice(0,3).join('; ')||n+' ajustes verificados'};});
 T('Soluções','Balanceador de açúcares não piora o congelamento',()=>{let n=0;const bad=[];recs.forEach(r=>TEST_VITS.forEach(v=>{const st=stTest(r,v);const b=balance(st);if(!b.ok)return;n++;const m0=analyze(st),m1=analyze({...st,recipe:b.newRecipe});const d0=Math.abs(m0.fzVit-m0.fzMid),d1=Math.abs(m1.fzVit-m1.fzMid);if(d1>Math.max(3,d0)+.3)bad.push(r.name+' '+v+': '+f1(d0)+' → '+f1(d1));if(b.newRecipe.some(x=>!(x.g>=0)))bad.push(r.name+': grama negativa');}));return{ok:!bad.length,detail:bad.slice(0,3).join('; ')||n+' balanceamentos'};});
 T('Soluções','Gerador por alvo: congelamento e sólidos na faixa em todos os tipos',()=>{const fx={sorbetto:[{id:'manga',g:450}],frutta:[{id:'morango',g:350}],gastro:[{id:'gorgonzola',g:80}]};const bad=[];Object.keys(GEN_DEF).forEach(t=>{[-11,-14.5].forEach(v=>{const g=generate({tipo:t,batch:1000,fixed:fx[t]||[{id:'pistache',g:100}],...GEN_DEF[t],stabId:'nx_fredolin',stabGkg:t==='sorbetto'?4:25,vit:v});if(!g.ok){bad.push(t+' '+v+': '+g.msg);return;}const dz=g.m.fzVit-g.m.fzMid;if(Math.abs(dz)>3.2)bad.push(t+' '+v+': '+f1(g.m.fzVit)+'%');const rs=g.m.P.sol;if(g.m.sol<rs[0]-1.5||g.m.sol>rs[1]+1.5)bad.push(t+' '+v+': sólidos '+f1(g.m.sol)+'%');});});return{ok:!bad.length,detail:bad.join('; ')};});
 /* ---- 5. regressão contra a referência ---- */
 if(typeof GOLDEN!=='undefined')T('Regressão','Métricas das receitas iguais à referência',()=>{const bad=[];let n=0;recs.forEach(r=>{const g=GOLDEN[r.key];if(!g)return;const st=stTest(r);const m=analyze(st);const sc=score(st,m,diagnose(st,m)).total;GOLD_KEYS.forEach((k,i)=>{n++;const a=g[i],b=m[k];if(Math.abs(a-b)>1e-4*Math.max(1,Math.abs(a)))bad.push(r.name+' '+k+' '+a+' → '+(+b).toFixed(4));});n++;if(g[GOLD_KEYS.length]!==sc)bad.push(r.name+' índice '+g[GOLD_KEYS.length]+' → '+sc);});return{ok:!bad.length,detail:bad.slice(0,3).join('; ')||n+' valores conferidos'};});

 let msg=ss.msg;if(P&&!m.empty)msg=P.tReady==null?'Não chega ao ponto em 40 min':ss.st==='ok'?'No ponto em '+f0(Math.max(0,+S.proc.waitMin))+' min':'Ponto em '+f0(P.tReady)+' min';

function palItems(q){const nq=norm(q.trim());const words=nq.split(/\s+/).filter(Boolean);const out=[];
 const sc=(title,alias)=>{if(!words.length)return 1;const t=norm(title),a=norm((alias||[]).join(' '));let s=0;
  for(const w of words){if(t.startsWith(w))s+=100;else if(new RegExp('(^|\\s)'+w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).test(t))s+=70;else if(t.includes(w))s+=40;else if(a.includes(w))s+=25;else return 0;}return s;};
 const recent=U.recent||[];
 FAMILIES.forEach(([f,fn,P])=>P.forEach(([k,n])=>{if(!can.page(k))return;const s=sc(n,[fn]);if(s)out.push({g:'Ir para',t:n,sub:fn,ic:f,a:'go',v:k,s:s+(recent.includes(k)?(8-recent.indexOf(k)):0)+(words.length?0:5)});}));
 if(words.length)Object.entries(PAGE_ALIAS).forEach(([k,[to,,n]])=>{if(!can.page(to))return;const s=sc(n,[PAGE_N[to]]);if(s)out.push({g:'Ir para',t:n,sub:PAGE_N[to],ic:PAGE_FAM[to],a:'go',v:k,s:s-1});});
 PAL_ACTS.forEach(([a,t,key,al])=>{const[act,v]=a.split(':');if(!ACT[act]||!can.act(act))return;if(act==='undo'&&!UNDO.length)return;const s=sc(t,al);if(s)out.push({g:'Ações',t,ic:'acao',a:act,v:v||'',key,s:s+(words.length?0:3)});});
 if(nq.length>=2){
  if(can.act('crAdd'))ING.filter(i=>i.id!=='nx_tmp').map(i=>({i,s:sc(i.n,[i.cat,i.lab||''])})).filter(x=>x.s).sort((a,b)=>b.s-a.s).slice(0,6).forEach(({i,s})=>out.push({g:'Adicionar à bancada',t:i.n,sub:i.cat,ic:'ingrediente',a:'crAdd',v:i.id,s:s*.8}));
  if(can.act('master'))MASTERS.map((p,k)=>({p,k,s:sc(p.name,[p.a,p.g||''])})).filter(x=>x.s).sort((a,b)=>b.s-a.s).slice(0,6).forEach(({p,k,s})=>out.push({g:'Receitas dos mestres',t:p.name,sub:p.a,ic:'receita',a:'master',v:String(k),s:s*.7}));
  if(can.act('load'))LIB.map(l=>({l,s:sc(l.name,[])})).filter(x=>x.s).slice(0,5).forEach(({l,s})=>out.push({g:'Minhas receitas',t:l.name,sub:l.date,ic:'receita',a:'load',v:String(l.id),s:s*.9}));
  if(can.act('execRun'))EXEC.map(e=>({e,s:sc(e.name,[])})).filter(x=>x.s).slice(0,5).forEach(({e,s})=>out.push({g:'Em execução',t:e.name,sub:'v'+e.v,ic:'receita',a:'execRun',v:String(e.id),s}));}
 const order=['Ir para','Ações','Minhas receitas','Em execução','Adicionar à bancada','Receitas dos mestres'];
 out.sort((a,b)=>words.length?b.s-a.s:order.indexOf(a.g)-order.indexOf(b.g)||b.s-a.s);
 return out.slice(0,words.length?14:16);}
function palHTML(){const P=U.pal;if(!P)return'';const L=palItems(P.q||'');const sel=clamp(P.sel||0,0,Math.max(0,L.length-1));P.sel=sel;let lastG='';
 return`<div class="pal-bg" data-a="palClose"></div><div class="pal" role="dialog" aria-modal="true" aria-label="Buscar e comandos">
  <div class="pal-in">${icon('busca')}<input type="text" id="palQ" data-i="palQ" value="${esc(P.q||'')}" placeholder="Buscar páginas, ações, ingredientes e receitas" autocomplete="off" aria-controls="palL" aria-activedescendant="pal-${sel}"><kbd>esc</kbd></div>
  <div class="pal-l" id="palL" role="listbox">${L.length?L.map((x,i)=>{const h=x.g!==lastG?`<div class="pal-g">${x.g}</div>`:'';lastG=x.g;
   return h+`<button id="pal-${i}" role="option" aria-selected="${i===sel}" data-a="palRun" data-v="${i}">${icon(x.ic)}<span class="pal-t">${esc(x.t)}${x.sub?`<small>${esc(x.sub)}</small>`:''}</span>${x.key?kbd(x.key):''}</button>`;}).join(''):`<p class="pal-empty">Nada encontrado para "${esc(P.q)}". Tente o nome de um ingrediente, de um mestre ou de uma página.</p>`}</div>
  <div class="pal-f"><span><kbd>↑</kbd><kbd>↓</kbd> navegar</span><span><kbd>↵</kbd> abrir</span><span>${kbd('K')} abre de qualquer tela</span></div></div>`;}
function palRun(i){const L=palItems((U.pal&&U.pal.q)||'');const x=L[+i];U.pal=null;if(!x)return render();if(!can.act(x.a)){denied();return render();}
 const before=undoSnap();if(['crAdd','master','load','norm','execRun'].includes(x.a))undoMark();ACT[x.a](x.v);if(UNDO_TOAST.has(x.a)&&undoSnap()!==before)toastUndo();else undoSettle();}

const SHELL_ACT={
 navTog:()=>{const cur=navMode();if(cur==='tab')return;try{localStorage.setItem(NAVKEY,cur==='rail'?'full':'rail');}catch(e){}navApply();render();},
 toTop:()=>scrollTopAll(),
 fam:v=>{const P=famPages(v);if(!P.length)return;const last=(S.famLast||{})[v];ACT.go(P.some(([k])=>k===last)?last:P[0][0]);},
 palOpen:()=>{U.pal={q:'',sel:0};render();setTimeout(()=>{const e=document.getElementById('palQ');e&&e.focus();},0);},
 palClose:()=>{U.pal=null;render();},
 palRun:v=>palRun(v),
 palBal:()=>{S.page='laudo';U.bal=S.proc.serveFrom==='pote'?balancePote(S):balance(S);render();},
 wait:v=>{S.proc.waitMin=clamp(Math.round(+S.proc.waitMin+ +v),0,60);U.bal=null;render();},

};

/* ---------- tamanho da tela → navegação (como o iPadOS: barra lateral, trilho de ícones ou abas inferiores) ----------
   compacto (≤ 760 px: iPhone, iPad em Split View estreito): abas inferiores e cabeçalho que rola junto com a página
   médio (761–1365 px: iPad, MacBook 13" com janela menor): trilho de ícones + abas das páginas irmãs
   amplo (≥ 1366 px: MacBook, iPad 13" deitado): barra lateral completa
   A barra lateral pode ser recolhida/expandida (botão ou ⌘\\); a escolha fica salva neste aparelho. */
const NAVKEY='fredolin_nav';
function navMode(){const w=typeof innerWidth==='number'?innerWidth:1440;if(w<=760)return'tab';let p=null;try{p=localStorage.getItem(NAVKEY);}catch(e){}if(p==='rail'||p==='full')return p;return w<1366?'rail':'full';}
function navApply(){try{const b=document.body;if(!b||!b.dataset)return;const m=navMode();if(b.dataset.nav!==m)b.dataset.nav=m;}catch(e){}}
function scrollTopAll(){try{const m=$('#main');if(m)m.scrollTop=0;const a=document.querySelector('.app');if(a&&'scrollTop' in a)a.scrollTop=0;}catch(e){}}
/* barra compacta que aparece no topo quando o cabeçalho sai da tela (iPhone) */
function miniHTML(m,sc){if(m.empty)return'';const v=S.proc.serveFrom==='pote'?'na colher '+fT(Math.round(S.vit*10)/10):fT(Math.round(S.vit*10)/10);
 return`<button class="minib" data-a="toTop" aria-label="Voltar ao topo"><b>${esc(S.name||'Receita')}</b><span class="mono">${v} °C</span><span class="mini-sc ${sc.total>=90?'c-ok':sc.total>=75?'c-warn':'c-crit'}">${sc.total}</span></button>`;}
let _miniObs=null;
function miniWire(){if(_miniObs||typeof IntersectionObserver==='undefined')return;const h=document.getElementById('hdr'),mi=document.getElementById('mini'),app=document.querySelector('.app');if(!h||!mi||!app)return;
 _miniObs=new IntersectionObserver(es=>{es.forEach(e=>{mi.classList[e.isIntersecting?'remove':'add']('show');});},{root:app,threshold:0});_miniObs.observe(h);}
if(typeof window!=='undefined'&&window.addEventListener&&window.document){window.addEventListener('resize',()=>{const b=document.body;const was=b&&b.dataset&&b.dataset.nav;navApply();if(b&&b.dataset&&b.dataset.nav!==was&&typeof render==='function')render();});}

 const T=[
  ['Sólidos',m.sol,'%',P.sol,P.sol[0]-10,P.sol[1]+10,'alvo '+fT(P.sol[0])+'–'+f0(P.sol[1])],

  ['Doçura POD',m.pod,'%',P.pod,P.pod[0]-8,P.pod[1]+8,'alvo '+f1(P.pod[0])+'–'+f1(P.pod[1])],
  ['Congelada a '+f1(S.vit)+'°',m.fzVit,'%',P.fz,50,90,'alvo '+fT(P.fz[0])+'–'+P.fz[1]],
  ['Lactose/água',m.lacW,'%',[0,9],0,14,'seguro até 9']
 ];
 const top=F.filter(f=>f.sev==='crit'||f.sev==='warn').slice(0,3);
 return`<div class="pg">
 <div><h1>Bancada</h1><p class="lead">${P.n} · ${f0(m.tot)} g de mistura · ${S.proc.serveFrom==='pote'?'na colher após '+f0(+S.proc.waitMin)+' min fora do freezer: '+f1(S.vit)+' °C':'vitrine a '+f1(S.vit)+' °C'}${m.empty?'':' · serviço ideal '+f1(m.serveT)+' °C <span class="muted">('+uncLine(m)+')</span>'}${m.empty?'':' · quenelle '+f1(quenelleModel(m).T)+' °C'}${P.adj?' · faixas ajustadas para cacau/oleaginosas':''}${P.pref?' · <span class="c-gold">gosto da casa</span>':''}</p></div>
 <div class="tiles">${T.map(([n,v,u,r,a,b,t])=>`<div class="tile"><span class="lbl">${n}</span><span class="v ${m.empty?'':stCls(v,r)}">${m.empty?'—':f1(v)}<small>${u}</small></span>${m.empty?'':rbar(v,r,a,b)}<span class="t">${t}</span></div>`).join('')}</div>
 <div class="bgrid"><div class="bcol"><div class="card"><h2>Adicionar ingrediente <span class="muted" style="text-transform:none;letter-spacing:0">${ING.length} no banco</span></h2>
  <div class="row"><div class="search"><input type="text" id="q" data-i="q" value="${esc(U.q)}" placeholder="Buscar: leite, dextrose, pistache, maracujá, goma jataí…" autocomplete="off" aria-label="Buscar ingrediente">
   ${res.length?`<div class="res" role="listbox">${res.map((i,k)=>`<button data-a="pick" data-v="${i.id}" id="r${k}"><span>${esc(i.n)}</span><span class="tag">${esc(i.cat)}</span></button>`).join('')}</div>`:''}</div>

/* Laudo único (v17.7): resumo com problemas primeiro e riscos de defeito; congelamento, química/vida útil e parâmetros como seções */
const LAUDO_SEC=[['resumo','Resumo'],['congelamento','Congelamento'],['textura','Textura e quenelle'],['quimica','Química e estabilidade da textura'],['parametros','Parâmetros']];
function pgLaudo(m,F,sc){
 if(m.empty)return`<div class="pg"><h1>Laudo técnico</h1><p class="lead">Monte uma receita na Bancada para gerar o laudo.</p></div>`;
 const P=m.P,groups=['crit','warn','info','ok'];const t=subOf('laudo','resumo');
 const prm=[
  ['Água congelada na vitrine',m.fzVit,'%',P.fz,1],['Sólidos totais',m.sol,'%',P.sol,1],['Gordura',m.fat,'%',P.fat,1],['Proteína',m.prot,'%',P.prot,1],
  ['MSNF',m.msnf,'%',P.msnf[1]>0?P.msnf:null,1],['Lactose / água',m.lacW,'%',[0,9],1],['Açúcares e polióis (sem lactose)',m.swt,'%',P.swt,1],
  ['Doçura POD',m.pod,'%',P.pod,1],['Estabilizantes',m.hydro,'%',P.stab,2],['Emulsificantes',m.emul,'%',null,2],['Gema',m.yolkPct,'%',null,1],
  ['Fruta',m.fruit,'%',P.frt,0],['Álcool (etanol)',m.alc,'%',null,1],['Overrun previsto',m.ov,'%',P.ov,0]];

 let body='',lead='';
 if(t==='congelamento'){const E=embedPg(pgCongel(m));lead=E.lead;body=E.body;}
 else if(t==='textura'){lead='Dureza na colher pelo volume de gelo e ponto de quenelle para empratar.';body=quenelleCard(m)+textureCard(m);}
 else if(t==='quimica'){const E=embedPg(pgQuimica(m));lead=E.lead;body=E.body+brixMixCards(m);}
 else if(t==='parametros'){lead='Cada parâmetro da receita contra a faixa de '+esc(P.n.toLowerCase())+'.';body=`<div class="card"><h2>Parâmetros</h2><div class="tw"><table class="tbl"><thead><tr><th>Parâmetro</th><th class="r">Valor</th><th class="r">Alvo</th><th style="width:30%">Posição</th></tr></thead><tbody>
  ${prm.map(([n,v,u,r,d])=>{const lo=r?Math.min(r[0],v)-(r[1]-r[0]||1)*.6:0,hi=r?Math.max(r[1],v)+(r[1]-r[0]||1)*.6:1;return`<tr><td>${n}</td><td class="r mono ${stCls(v,r)}">${d===0?f0(v):d===2?f2(v):f1(v)}${u}</td><td class="r mono muted">${r?(d===2?f2(r[0])+'–'+f2(r[1]):f0(r[0])+'–'+f0(r[1]))+u:'—'}</td><td>${r?rbar(v,r,lo,hi):''}</td></tr>`;}).join('')}
 </tbody></table></div></div>`;}
 else{lead='Cada parâmetro é comparado com a faixa de '+esc(P.n.toLowerCase())+' e com o processo informado. As soluções trazem gramagens calculadas para o lote atual de '+f0(m.tot)+' g.';
  const R=defectRisks(m),ok=F.filter(f=>f.sev==='ok');
  body=`<div class="card"><div class="row" style="gap:20px;align-items:center">${ring(sc.total)}<div style="flex:1;min-width:240px;display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px 16px">
  ${sc.parts.map(([n,w,v])=>`<div><div class="row" style="justify-content:space-between"><span class="t2" style="font-size:12.5px">${n}</span><span class="mono" style="font-size:11px">${f0(v*100)}</span></div>${rbar(v*100,[85,100],0,100)}</div>`).join('')}</div></div>
  <div class="row" style="margin-top:12px">${groups.map(g=>{const n=F.filter(f=>f.sev===g).length;const PL={crit:['crítico','críticos'],warn:['alerta','alertas'],info:['observação','observações'],ok:['acerto','acertos']}[g];return n?`<span class="chip ${g}">${n} ${PL[n>1?1:0]}</span>`:'';}).join('')}<span class="sp"></span><span class="chip" title="Faixa provável com a variação natural dos ingredientes">serviço ideal ${f1(m.serveT)} °C · ${uncLine(m)}</span></div></div>
  ${groups.slice(0,3).map(g=>{const L=F.filter(f=>f.sev===g);return L.length?`<div class="card"><h2>${{crit:'Erros críticos',warn:'Atenção',info:'Observações'}[g]}</h2>${L.map(findHTML).join('')}</div>`:'';}).join('')}
  ${F.some(f=>f.sev==='crit'||f.sev==='warn')&&can.edit()?balanceCard(m):''}
  <div class="card"><div class="row"><h2 style="margin:0">Riscos de defeito</h2><span class="sp"></span><button class="btn sm" data-a="go" data-v="defeitos">Diagnóstico por sintomas</button></div>

   :'<p class="t2" style="margin:0">Nenhum dos '+DEFECTS.length+' defeitos do banco tem causa provável na receita e no processo atuais.</p>'}</div>
  ${ok.length?`<details class="card dcard" id="laudoOk"${dOpen('laudoOk',false)}><summary><h2 style="margin:0">Acertos</h2><span class="chip ok">${ok.length}</span></summary>${ok.map(findHTML).join('')}</details>`:''}`;}

function maqCard(m){const M=maqPlan(m,S.proc);if(!M)return'';const p=S.proc;
 return`<div class="card"><div class="row"><h2 style="margin:0">Maestro Gelatiere nesta receita</h2><span class="sp"></span>${can.edit()&&Math.abs(+p.drawT-M.t35)>.15?`<button class="btn sm pri" data-a="maqUse">Usar saída ${f1(M.t35)} °C</button>`:''}</div>
  <p class="t2" style="margin:6px 0 10px">Saída a <b>${fT(+p.drawT)} °C</b> no centro: <b>${f0(M.fzNow)}%</b> da água já em gelo. Nas mantecadoras profissionais sai a −10/−11 °C com ~75% (Corvitto); na Maestro o alvo realista é <b>${f1(M.t35)} °C</b> (35%), e cada grau a mais vale ~12–15 pontos de gelo. O resto do gelo se forma no freezer: por isso o endurecimento rápido pesa tanto.</p>
  <div class="tw"><table class="tbl"><thead><tr><th>Carga</th><th class="r">Até ${fT(+p.drawT)} °C</th><th class="r">Até ${f1(M.t35)} °C</th></tr></thead><tbody>
  ${M.loads.map(l=>`<tr${l.g===M.best?' style="background:var(--hov)"':''}><td>${f0(l.g)} g${l.g===M.best?' · <span class="c-ok">melhor textura</span>':''}</td><td class="r mono" style="white-space:nowrap">${f0(l.tDraw)} min</td><td class="r mono" style="white-space:nowrap">${f0(l.t35)} min</td></tr>`).join('')}</tbody></table></div>
  <div class="g3" style="margin-top:10px;gap:10px">
   <div class="kv"><span>Capacidade estimada</span><span>${f0(M.Q)} W</span></div><div class="kv"><span>Calda entra a</span><span>${fT(M.Tin)} °C</span></div><div class="kv"><span>Ponto de congelamento</span><span>${f1(M.fp)} °C</span></div></div>

/* ---------- PONTO DE QUENELLE (v17.9) ---------- */
function quenelleCard(m,compact){const q=quenelleModel(m);if(!q)return'';
 const T0=Math.floor(Math.min(q.Tbr,m.serveT,+S.vit)-2),T1=Math.ceil(Math.max(q.Tsl,m.serveT)+2);const W=380,H=compact?84:96,L=10,R=10,y0=32,bh=22;
 const x=t=>L+(t-T0)/(T1-T0)*(W-L-R);let g='';
 g+=`<rect x="${x(T0)}" y="${y0}" width="${x(q.Tbr)-x(T0)}" height="${bh}" rx="4" fill="rgba(125,211,252,.22)"/><rect x="${x(q.Tbr)}" y="${y0}" width="${x(q.Tsl)-x(q.Tbr)}" height="${bh}" fill="rgba(110,231,183,.55)"/><rect x="${x(q.Tsl)}" y="${y0}" width="${x(T1)-x(q.Tsl)}" height="${bh}" rx="4" fill="rgba(251,191,36,.25)"/>`;
 g+=`<text x="${(x(T0)+x(q.Tbr))/2}" y="${y0+15}" text-anchor="middle" font-size="11.5" fill="var(--t1)">racha</text><text x="${(x(q.Tsl)+x(T1))/2}" y="${y0+15}" text-anchor="middle" font-size="11.5" fill="var(--t1)">desaba</text>`;
 for(let t=Math.ceil(T0)+1;t<T1;t++)g+=`<text x="${x(t)}" y="${y0+bh+17}" text-anchor="middle" font-size="11" fill="var(--t3)">${t}°</text>`;
 const mk=(t,lab,col,up)=>`<line x1="${x(t)}" x2="${x(t)}" y1="${y0-6}" y2="${y0+bh+4}" stroke="${col}" stroke-width="2"/><text x="${x(t)}" y="${up?y0-20:y0-9}" text-anchor="middle" font-size="12" font-weight="600" fill="${col}">${lab}</text>`;
 g+=mk(q.T,'quenelle '+f1(q.T)+'°','var(--ok)')+(Math.abs(m.serveT-q.T)>.6?mk(m.serveT,'colher '+f1(m.serveT)+'°','var(--ice)',Math.abs(m.serveT-q.T)<2.2):'');
 const pote=poteModel(m,m.pr);const tq=pote&&pote.timeTo?pote.timeTo(q.T):null;
 const pct=v=>f0(v*100)+'%';
 return`<div class="card"><div class="row"><h2 style="margin:0">Ponto de quenelle</h2><span class="sp"></span><span class="chip ok">${f1(q.T)} °C</span></div>
  <p class="t2" style="margin:6px 0 4px">Quenelle lisa entre <b>${f1(q.Tbr)}</b> e <b>${f1(q.Tsl)} °C</b> (janela de ${f1(q.width)} °C). Mais frio racha; mais quente desaba no prato.</p>
  <svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block" role="img" aria-label="Janela de quenelle de ${f1(q.Tbr)} a ${f1(q.Tsl)} graus">${g}</svg>
  ${compact?'':`<div class="g3" style="margin-top:10px;gap:10px">
   <div class="kv"><span>Gelo em volume no ponto</span><span>${pct(q.phiQ)}</span></div><div class="kv"><span>Coesão (não racha)</span><span class="${q.C>=.7?'c-ok':q.C>=.5?'c-warn':'c-crit'}">${pct(q.C)}</span></div><div class="kv"><span>Sustentação no prato</span><span class="${q.H>=.6?'c-ok':q.H>=.35?'c-warn':'c-crit'}">${pct(q.H)}</span></div>
   <div class="kv"><span>Superfície</span><span style="font-family:var(--fb)">${esc(q.sheen)}</span></div><div class="kv"><span>Textura</span><span style="font-family:var(--fb)">${esc(q.smooth)}</span></div><div class="kv"><span>Do freezer ao ponto</span><span>${tq!=null?f0(tq)+' min':'—'}</span></div></div>
   ${q.notes.length?`<ul class="t2" style="margin:10px 0 0;padding-left:18px">${q.notes.map(n=>`<li>${esc(n)}</li>`).join('')}</ul>`:''}
   <p class="note" style="margin:10px 0 0">Calculado pela fração de gelo em volume (gelo, matriz e ar), pela coesão (rede de gordura, viscosidade, estabilizante) e pela resistência ao derretimento. "Do freezer ao ponto": pote de ${f0(+m.pr.poteMl)} ml saindo a ${fT(+m.pr.storeT)} °C em ambiente a ${fT(+m.pr.ambT)} °C, na camada de onde sai a colherada. Colher mergulhada em água quente e seca. ${CAL.counts&&CAL.counts.q?'Ajustado por '+CAL.counts.q+' teste(s) de quenelle dos seus lotes.':'Registre testes de quenelle nos Lotes (temperatura e resultado) para ajustar o ponto à sua produção.'}</p>`}</div>`;}

function textureCard(m){const pts=[['Saída da mantecadora',m.pr.drawT],['Ponto de quenelle',quenelleModel(m).T],['Serviço ideal',m.serveT],['Vitrine configurada',+S.vit],['Freezer',m.pr.storeT]];

/* ---------- CONGELAMENTO ---------- */
function chart(m){
 /* eixo até −25 °C, ou mais frio se o freezer/serviço estiver abaixo disso */
 const TM=Math.min(-25,Math.floor((Math.min(m.pr.storeT,+S.vit)-2)/5)*5),W=640,H=300,L=44,R=14,Tp=16,B=36,tx=t=>L+(-t)/(-TM)*(W-L-R),ty=p=>Tp+(100-p)/100*(H-Tp-B);
 const pts=[],raw=[];for(let t=0;t>=TM;t-=.25){pts.push([tx(t),ty(m.fz(t))]);if(m.hfAbs>0)raw.push([tx(t),ty(frozenPct(t,m.SEraw,m.S))]);}
 const path=a=>'M'+a.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join('L');
 const P=m.P;let g='';
 for(let p=0;p<=100;p+=20)g+=`<line x1="${L}" x2="${W-R}" y1="${ty(p)}" y2="${ty(p)}" stroke="var(--line)" stroke-width="1"/><text x="${L-8}" y="${ty(p)+4}" text-anchor="end" fill="var(--t3)" font-size="10">${p}%</text>`;
 for(let t=0;t>=TM;t-=5)g+=`<text x="${tx(t)}" y="${H-B+18}" text-anchor="middle" fill="var(--t3)" font-size="10">${t}°</text>`;
 g+=`<text x="${(W+L)/2}" y="${H-4}" text-anchor="middle" fill="var(--t3)" font-size="10">temperatura (°C)</text>`;
 g+=`<rect x="${L}" y="${ty(P.fz[1])}" width="${W-L-R}" height="${ty(P.fz[0])-ty(P.fz[1])}" fill="rgba(110,231,183,.1)"/>`;
 /* rótulos à esquerda da linha quando perto da borda direita; vitrine e estoque iguais viram um rótulo só */
 const mk=(t,lab,col,dy)=>{const x=tx(t),right=x>W-150;return`<line x1="${x}" x2="${x}" y1="${Tp}" y2="${H-B}" stroke="${col}" stroke-dasharray="3 3"/><text x="${right?x-4:x+4}" y="${Tp+10+dy}" text-anchor="${right?'end':'start'}" fill="${col}" font-size="10">${lab} ${f1(t)}°</text>`;};
 const same=Math.abs(+S.vit-m.pr.storeT)<.6;
 g+=mk(m.pr.drawT,'saída','var(--gold)',0)+(m.pr.serveFrom==='pote'?mk(+S.vit,'colher após '+f0(+m.pr.waitMin)+' min','var(--ice)',14)+mk(m.pr.storeT,'freezer','var(--info)',28):same?mk(+S.vit,'vitrine = estoque','var(--ice)',14):mk(+S.vit,'vitrine','var(--ice)',14)+mk(m.pr.storeT,'estoque','var(--info)',28));
 if(raw.length)g+=`<path d="${path(raw)}" fill="none" stroke="var(--t3)" stroke-width="1.5" stroke-dasharray="4 4"/>`;
 g+=`<path d="${path(pts)}" fill="none" stroke="var(--ice)" stroke-width="2.5"/>`;
 {const x=tx(+S.vit),r=x>W-60;g+=`<circle cx="${x}" cy="${ty(m.fzVit)}" r="5" fill="var(--ice)"/><text x="${r?x-8:x+8}" y="${ty(m.fzVit)+18}" text-anchor="${r?'end':'start'}" fill="var(--t1)" font-size="11">${f0(m.fzVit)}%</text>`;}
 if(m.serveT<0&&m.serveT>TM)g+=`<circle cx="${tx(m.serveT)}" cy="${ty(m.fzMid)}" r="4" fill="none" stroke="var(--ok)" stroke-width="2"/>`;
 return`<div class="tw"><svg viewBox="0 0 ${W} ${H}" style="width:100%;min-width:480px;height:auto" role="img" aria-label="Curva de água congelada por temperatura">${g}</svg></div>
 <div class="row note" style="gap:16px;margin-top:6px"><span><span class="c-ice">━</span> curva efetiva (com fator de dureza)</span>${raw.length?'<span>┅ curva sem fator de dureza</span>':''}<span><span class="c-ok">■</span> faixa de serviço ${fT(P.fz[0])}–${fT(P.fz[1])}%</span><span><span class="c-ok">○</span> ponto ideal</span></div>`;}

   <div class="kv"><span>Referência rápida Corvitto (≈23 × |T|)</span><span class="muted">${f0(m.corvittoRef)} /kg</span></div></div>
 </div>
 <div class="card flat"><h2>Como o motor calcula</h2><p class="note" style="margin:0">Cada açúcar, poliol, sal e álcool é convertido em equivalente de sacarose pelo seu peso molecular (sacarose 100, dextrose 190, frutose 190, lactose 100, eritritol 280, etanol 740, sal 1090). A concentração na água da mistura dá o ponto de congelamento pela tabela de Goff &amp; Hartel; os sais do leite entram pelo termo de Leighton (2,37 × MSNF / água). Conforme o gelo se forma, a água restante concentra e o motor resolve, grau a grau, a fração que ainda pode congelar. Cacau e oleaginosas entram pelo fator de dureza de Corvitto, recalibrado para que o Helado de nata (410 PAC) e o Helado de chocolate do Recetario sirvam ambos a −18 °C, como no livro.</p></div>

function labSens(m){

  const line=(fn,col)=>`<path d="${R.map((x,i)=>(i?'L':'M')+xs(i).toFixed(1)+','+y1(fn(x)).toFixed(1)).join('')}" fill="none" stroke="${col}" stroke-width="2.2"/>`;
  g+=line(x=>x.fz,'var(--ice)')+line(x=>x.sc,'var(--ok)');
  chartH=`<div class="tw"><svg viewBox="0 0 ${W} ${H}" style="width:100%;min-width:460px;height:auto" role="img" aria-label="Efeito da variação do ingrediente">${g}</svg></div><div class="row note" style="gap:14px"><span><span class="c-ice">━</span> % de água congelada</span><span><span class="c-ok">━</span> índice de qualidade</span><span><span class="c-ok">■</span> faixa de congelamento</span></div>`;}
 const best=R&&R.length?R.reduce((a,b)=>b.sc>a.sc||(b.sc===a.sc&&Math.abs(b.k)<Math.abs(a.k))?b:a):null;
 return`<div class="card"><h2>Simulação "e se"</h2><p class="note" style="margin-top:0">Varia um ingrediente da bancada em passos e recalcula tudo, mantendo o resto fixo.</p>

 ${R&&R.length?`<div class="card">${chartH}<div class="tw" style="margin-top:10px"><table class="tbl"><thead><tr><th class="r">Variação</th><th class="r">Gramas</th><th class="r">Congelada</th><th class="r">Serviço</th><th class="r">POD</th><th class="r">Sólidos</th><th class="r">Gordura</th><th class="r">Índice</th></tr></thead><tbody>
  ${R.map(x=>`<tr${x===best?' style="background:var(--ok-a)"':''}><td class="r mono">${x.k>0?'+':''}${f0(x.k)}%</td><td class="r mono">${f1(x.g)}</td><td class="r mono ${stCls(x.fz,PROF[S.tipo].fz)}">${f0(x.fz)}%</td><td class="r mono">${f1(x.serve)}°</td><td class="r mono">${f1(x.pod)}</td><td class="r mono">${f1(x.sol)}</td><td class="r mono">${f1(x.fat)}</td><td class="r mono">${x.sc}</td></tr>`).join('')}</tbody></table></div>
  ${best?`<div class="row" style="margin-top:10px"><span class="t2">Melhor índice: ${best.sc} com ${f1(best.g)} g (${best.k>0?'+':''}${f0(best.k)}%).</span><span class="sp"></span><button class="btn okb" data-a="sensApply" data-v="${best.g}">Aplicar ${f1(best.g)} g</button></div>`:''}</div>`:''}`;}

function haccp(L){const me=L.meas||{};const out=[];const has=k=>me[k]!==''&&me[k]!=null&&isFinite(+me[k]);const fm=k=>has(k)?fT(+me[k]):'—';const pT=+me.pastT;
 const holdOk=L.proc&&L.proc.pastHoldU==='min'?+me.pastHold>=30:true;
 out.push(['Pasteurização',!has('pastT')?'warn':pT>=80||(pT>=65&&holdOk&&L.proc&&L.proc.pastHoldU==='min')?'ok':pT>=72?'warn':'crit',fm('pastT')+' °C']);
 out.push(['Resfriamento',!has('coolMin')?'warn':+me.coolMin<=120?'ok':'crit',fm('coolMin')+' min até 4 °C']);
 out.push(['Maturação',!has('matT')||!has('matH')?'warn':+me.matT<=4.5&&+me.matH<=72?'ok':+me.matT<=6?'warn':'crit',fm('matH')+' h a '+fm('matT')+' °C']);
 const eggFresh=(L.recipe||[]).some(r=>ING_BY[r.id]&&ING_BY[r.id].egg==='fresh');if(eggFresh)out.push(['Ovo cru',has('pastT')&&pT>=82?'ok':'crit','exige ≥ 82 °C']);
 out.push(['Rastreabilidade',(L.recipe||[]).every(r=>(L.trace||{})[r.id])?'ok':'warn',Object.keys(L.trace||{}).filter(k=>L.trace[k]).length+'/'+(L.recipe||[]).length+' lotes']);
 return out;}

function pgVitrine(){const V=S.vitrine;const rows=vitrineAnalysis(V.items,V.temp);const best=rows.length?bestVitrineTemp(rows):null;const srcs=recipeSources();
 const W=640,H=Math.max(80,rows.length*30+40),L=170,R=20,T=10,tx=t=>L+(clamp(t,-24,-4)+24)/20*(W-L-R);let g=`<rect x="${tx(V.temp-1.5)}" y="${T}" width="${tx(V.temp+1.5)-tx(V.temp-1.5)}" height="${H-T-24}" fill="rgba(110,231,183,.1)"/><line x1="${tx(V.temp)}" x2="${tx(V.temp)}" y1="${T}" y2="${H-24}" stroke="var(--ok)"/>`;
 for(let t=-24;t<=-4;t+=4)g+=`<text x="${tx(t)}" y="${H-8}" text-anchor="middle" fill="var(--t3)" font-size="10">${t}°</text>`;
 rows.forEach((r,i)=>{const y=T+16+i*30;const col=Math.abs(r.dev)<=1.5?'var(--ok)':Math.abs(r.dev)<=3?'var(--warn)':'var(--crit)';g+=`<text x="${L-8}" y="${y+4}" text-anchor="end" fill="var(--t2)" font-size="11">${esc(r.it.name.slice(0,24))}</text><line x1="${tx(V.temp)}" x2="${tx(r.m.serveT)}" y1="${y}" y2="${y}" stroke="${col}" stroke-width="2"/><circle cx="${tx(r.m.serveT)}" cy="${y}" r="6" fill="${col}"/>`;});
 return`<div class="pg"><div><h1>Vitrine</h1><p class="lead">Todos os sabores dividem a mesma temperatura. Monte a vitrine do dia: o motor mostra qual sabor vai ficar duro ou mole e rebalanceia cada um para servir no ponto.</p></div>
 <div class="card"><div class="row"><div class="field" style="width:auto"><span class="lbl">Temperatura da vitrine</span><div class="vit"><button data-a="vitT" data-v="-.5" aria-label="Mais frio">−</button><output>${f1(V.temp)} °C</output><button data-a="vitT" data-v=".5" aria-label="Menos frio">+</button></div></div>
