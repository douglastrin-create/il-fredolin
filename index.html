/* ==== 60b-backup.js ==== */
/* ===================== IL FREDOLIN · BACKUP E RESTAURAÇÃO (v18) =====================
   Antes: o backup levava só a vitrine principal (sem o set Professionale nem as lápides) e a importação gravava
   cada item como "agora", de modo que um backup antigo virava a versão mais nova e sobrescrevia na nuvem o que a
   equipe tinha editado depois. Agora a restauração é planejada antes (função pura, testada) e nunca troca um
   registro deste aparelho que seja igual ou mais novo que o do arquivo. Itens apagados só voltam se o usuário pedir. */
const BACKUP_COLS=['lib','exec','lots','ings','nx','inv','vit'];
const BACKUP_N={lib:'receitas',exec:'em execução',lots:'lotes',ings:'ingredientes',nx:'neutros',inv:'estoque',vit:'vitrine e sets'};
function backupPayload(cols,tomb,meta){const o=Object.assign({app:'Il Fredolin',schema:2},meta||{});
 BACKUP_COLS.forEach(c=>{o[c==='vit'?'vits':c]=cols[c]||[];});o.tomb=tomb||{};return o;}
/* plano de importação: para cada coleção, o que entra (novo), o que atualiza (o daqui é mais antigo),
   o que fica como está (o daqui é igual ou mais novo) e o que foi apagado aqui depois */
function planImport(d,cols,tomb){if(!d||typeof d!=='object')throw new Error('arquivo inválido');
 const src={lib:d.lib,exec:d.exec,lots:d.lots,ings:d.ings,nx:d.nx,inv:d.inv,vit:Array.isArray(d.vits)?d.vits:d.vitrine?[{id:'main',temp:d.vitrine.temp,items:d.vitrine.items||[]}]:[]};
 const plan={cols:{},total:{add:0,upd:0,keep:0,del:0},version:d.v||'',date:d.date||''};
 BACKUP_COLS.forEach(c=>{const loc=new Map((cols[c]||[]).map(r=>[String(r.id),r]));const tb=(tomb||{})[c]||{};const P={add:[],upd:[],keep:0,del:[]};
  safeList(src[c]).forEach(r=>{if(r.deleted)return;const id=String(r.id),l=loc.get(id),ts=+r.updatedAt||0;
   if(l){if((+l.updatedAt||0)<ts)P.upd.push(r);else P.keep++;}
   else if(tb[id]!=null&&tb[id]>=ts)P.del.push(r);else P.add.push(r);});
  plan.cols[c]=P;plan.total.add+=P.add.length;plan.total.upd+=P.upd.length;plan.total.keep+=P.keep;plan.total.del+=P.del.length;});
 return plan;}
/* ==== 61-sets.js ==== */
/* ===================== SETS: ARTIGIANALE × PROFESSIONALE =====================
   O set é o conjunto de equipamentos onde a receita vai ser feita. A chave no cabeçalho troca o set inteiro:
   mantecadora, saída, endurecimento, armazenamento, forma de servir, maturação (geladeira ou maturador)
   e temperatura de serviço. A receita continua a mesma; o motor recalcula tudo na hora para o set escolhido.
   • Artigianale: o set de casa (Maqp1 Maestro Gelatiere + Panasonic NR-BB53), guardado neste aparelho.
   • Professionale: o laboratório da equipe. Fica guardado na nuvem da equipe (coleção "vit", registro set_pro),
     então todos os aparelhos usam os mesmos equipamentos; Maestro e Chef atualizam quando chegar equipamento novo.
   Campos do set (equipamento) × campos da receita (fruta antes/depois, perda no cozimento, porção, preço). */
const SET_KEYS=['machine','load','preChill','drawT','drawMin','blastT','hardMin','hardAuto','turboMin','storeT','storeFluct','serveFrom','poteMl','ambT','waitMin','equip','matT','matH','coolMin','pastT','pastHold','pastHoldU'];
const SETS={
 art:{n:'Artigianale',sub:'Maestro + Panasonic',proc:Object.assign({},EQUIP.casa_mg_pan.proc,{pastT:85,pastHold:30,pastHoldU:'s'}),vit:-14.5,mat:{fridge:'med',pos:'meio',reads:'',entryT:10,probe:'',fruitIn:0},
  gear:{past:'Panela + termômetro (85 °C)',matur:'Panasonic NR-BB53 (refrigerador)',mant:'Maqp1 Maestro Gelatiere',abat:'Freezer Panasonic com Turbo',vitr:'— (serviço do pote)',frz:'Panasonic NR-BB53 (freezer, Médio)'}},
 pro:{n:'Professionale',sub:'laboratório da equipe',proc:{machine:'horiz',pastT:85,pastHold:30,pastHoldU:'s',coolMin:60,matT:4,matH:8,drawT:-9,drawMin:10,blastT:-35,hardMin:40,hardAuto:0,turboMin:0,storeT:-20,storeFluct:1,serveFrom:'vitrine',poteMl:500,ambT:23,waitMin:10,equip:''},vit:-13,
  mat:{fridge:'maturador',pos:'meio',reads:'',entryT:4,probe:'',fruitIn:0},
  gear:{past:'Pasteurizadora (a definir)',matur:'Maturador com agitação (a definir)',mant:'Mantecadora horizontal (a definir)',abat:'Abatedor −35 °C (a definir)',vitr:'Vitrine −13 °C (a definir)',frz:'Freezer de estoque −20 °C (a definir)'}}};
const GEAR_N=[['past','Pasteurização'],['matur','Maturação'],['mant','Mantecadora'],['abat','Abatimento'],['vitr','Vitrine'],['frz','Armazenamento']];
const plainSet=o=>JSON.parse(JSON.stringify(o));
function setDefaults(k){const d=SETS[k];return{proc:plainSet(d.proc),vit:d.vit,mat:plainSet(d.mat),gear:plainSet(d.gear),at:0};}
const pickSet=p=>{const o={};SET_KEYS.forEach(k=>{if(p&&p[k]!==undefined)o[k]=p[k];});return o;};
/* estado inicial: quem já usava o conjunto de casa começa no Artigianale */
function setsInit(){const old=S.sets&&typeof S.sets==='object'?S.sets:{};const nw={};for(const k of['art','pro']){const d=setDefaults(k);const c=old[k];
  nw[k]=c&&typeof c==='object'?{proc:Object.assign(d.proc,pickSet(c.proc)),vit:isFinite(+c.vit)?+c.vit:d.vit,mat:Object.assign(d.mat,c.mat||{}),gear:Object.assign(d.gear,c.gear||{}),at:+c.at||0}:d;}
 if(S.set!=='art'&&S.set!=='pro')S.set=S.proc&&S.proc.equip==='casa_mg_pan'?'art':'pro';S.sets=nw;
 /* o set ativo nasce do que já estava no processo */
 const cur=S.sets[S.set];if(!cur.at){cur.proc=Object.assign(cur.proc,pickSet(S.proc));cur.vit=+S.vit;if(S.mat)cur.mat=Object.assign(cur.mat,S.mat);cur.at=1;}}
/* aplica o set ativo no estado (processo + temperatura de serviço + maturação) */
function setApply(){const c=S.sets[S.set];Object.assign(S.proc,plainSet(c.proc));if(S.proc.serveFrom!=='pote')S.vit=c.vit;S.mat=plainSet(c.mat);}
/* espelha o que o usuário ajusta no processo para o set ativo */
function setMirror(){const c=S.sets&&S.sets[S.set];if(!c)return;c.proc=pickSet(S.proc);c.vit=+S.vit;if(S.mat)c.mat=plainSet(S.mat);}
function setSwitch(k){if(!SETS[k]||k===S.set)return;setMirror();S.set=k;setApply();U.bal=null;U.atEx=null;if(typeof LIVE!=='undefined'){LIVE.key=null;LIVE.res=null;}}
/* nuvem da equipe: o set Professionale é um registro compartilhado */
let _setPush={last:null,t:null};
function setsAfterRender(){if(!S.sets)return;setMirror();
 if(S.set!=='pro'||!(ROLE==='maestro'||ROLE==='chef'))return;const c=S.sets.pro;const js=JSON.stringify({proc:c.proc,vit:c.vit,mat:c.mat,gear:c.gear});
 if(_setPush.last===null){_setPush.last=js;return;}if(js===_setPush.last)return;_setPush.last=js;clearTimeout(_setPush.t);
 _setPush.t=setTimeout(()=>{try{STORE.put('vit',{id:'set_pro',kind:'set',cfg:JSON.parse(js)});}catch(e){}},1500);}
function setsFromCloud(){const r=(VITS||[]).find(v=>v.id==='set_pro'&&v.cfg);if(!r||!S.sets)return;const c=S.sets.pro;if((r.updatedAt||0)<=(c.at||0))return;
 const cf=r.cfg;c.proc=Object.assign(setDefaults('pro').proc,pickSet(cf.proc));if(isFinite(+cf.vit))c.vit=+cf.vit;c.mat=Object.assign(setDefaults('pro').mat,cf.mat||{});c.gear=Object.assign(setDefaults('pro').gear,cf.gear||{});c.at=r.updatedAt;
 _setPush.last=JSON.stringify({proc:c.proc,vit:c.vit,mat:c.mat,gear:c.gear});if(S.set==='pro')setApply();}
/* carregar receita (biblioteca, mestres, execução, lotes) não troca o equipamento: o set ativo prevalece */
const SET_LOADERS=['load','preset','master','execRun','histLoad','lotBench','varToBench','genToBench','sensApply','cmpLoad','libVar'];

const CFG=(()=>{const c=window.FREDOLIN_CONFIG||{},l=LS.get('fredolin_app_cfg')||{};return{url:String(c.url||l.url||'').trim().replace(/\/+$/,''),key:String(c.key||l.key||'').trim()};})();

const sbPermanent=e=>!!e&&!e.offline&&[400,403,404,409,413,422].includes(e.status);

 [/invalid api key|no api key/i,'Chave do Supabase inválida: confira o arquivo config.js.'],[/permission denied|row-level security|42501/i,'Seu perfil não tem permissão para isso.'],[/duplicate key/i,'Esse e-mail já está na equipe.']];
const trMsg=m=>{for(const[re,t]of SB_MSG)if(re.test(m))return t;return String(m);};
const SB={sess:LS.get(SESSKEY),
 configured(){return!!(CFG.url&&CFG.key);},
 async req(method,path,body,opt={}){const auth=opt.auth!==false;if(auth)await this.ensureFresh();
  const h=Object.assign({apikey:CFG.key,'Content-Type':'application/json'},opt.headers||{});if(auth&&this.sess)h.Authorization='Bearer '+this.sess.access_token;
  let r;try{r=await fetch(CFG.url+path,{method,headers:h,body:body==null?undefined:JSON.stringify(body)});}catch(e){const x=new Error(trMsg('failed to fetch'));x.offline=true;throw x;}
  if(r.status===401&&auth&&!opt.retried&&this.sess&&this.sess.refresh_token){await this.refresh();return this.req(method,path,body,{...opt,retried:true});}

/* ---------- custos separados: só o Maestro grava e recebe ---------- */
let FIN=LS.get(FINKEY)||{};
const FIN_FIELD={inv:[r=>r.costKg,(r,v)=>{if(v==null)delete r.costKg;else r.costKg=v;}],ings:[r=>r.x&&r.x.cost,(r,v)=>{r.x=r.x||{};if(v==null)delete r.x.cost;else r.x.cost=v;}],lib:[r=>r.st&&r.st.costs,(r,v)=>{if(!r.st)return;if(v==null)delete r.st.costs;else r.st.costs=v;}]};
/* v18 · o multiplicador de preço (markup) também é dado financeiro: sai da receita/execução/lote e viaja em fin
   (id "mk:<coleção>:<id>"), que só o Maestro lê. O banco (migração 001) também retira, se um app antigo mandar. */
const FIN_MK={lib:['st','proc'],exec:['proc'],lots:['proc']};

 if(f){const v=f[0](data);f[1](data,null);if(ROLE==='maestro'&&v!=null&&v!==''&&!(typeof v==='object'&&!Object.keys(v).length))rows.push({col:'fin',id:c+':'+rec.id,data:{v},updated_at:ts});}

function withFin(c,rec){const f=FIN_FIELD[c];if(f){const x=FIN[c+':'+rec.id];f[1](rec,x!=null?x:null);}
 if(FIN_MK[c]){const v=FIN['mk:'+c+':'+rec.id];const o=mkObj(c,rec);if(o&&v!=null)o.markup=v;}return rec;}

const SUPA_BACKEND={running:null,again:false,cursor:LS.get(CURKEY)||'1970-01-01T00:00:00.000Z',outbox:LS.get(OUTKEY)||[],rejected:LS.get(REJKEY)||[],lastOk:0,
 /* v18 · versão de cada registro como o servidor a numerou (migração 001). verMode: null = ainda não sabemos se o
    banco já tem a coluna ver; false = banco antigo (regra do relógio); true = conflitos por versão. */

 reset(keepQueue){this.cursor='1970-01-01T00:00:00.000Z';FIN={};LS.set(CURKEY,this.cursor);LS.set(FINKEY,{});if(!keepQueue){this.outbox=[];this.rejected=[];this.vers={};LS.set(OUTKEY,[]);LS.set(REJKEY,[]);LS.set(VERKEY,{});}},
 push(c,rec){let rj=false;for(const row of toRows(c,rec)){if(row.col==='fin'){FIN[row.id]=row.data.v;LS.set(FINKEY,FIN);}
  /* versão de partida: a da primeira edição ainda não enviada (duas edições seguidas partem da mesma versão do servidor) */
  const prev=this.outbox.find(o=>o.col===row.col&&o.id===row.id),k=row.col+':'+row.id;row.base_ver=prev?prev.base_ver:(this.vers[k]!=null?this.vers[k]:null);
  this.outbox=this.outbox.filter(o=>o!==prev);this.outbox.push(row);
  /* uma edição nova do mesmo registro substitui a versão que estava na quarentena */
  const n=this.rejected.length;this.rejected=this.rejected.filter(q=>!(q.row.col===row.col&&q.row.id===row.id));if(this.rejected.length!==n)rj=true;}
  LS.set(OUTKEY,this.outbox);if(rj)LS.set(REJKEY,this.rejected);this.kick();},
 kick(){clearTimeout(this.kt);this.kt=setTimeout(()=>this.sync(),250);},
 /* pendências = fila + quarentena: sair da conta com qualquer uma delas exige confirmação */

 quarantine(row,e){this.rejected=this.rejected.filter(q=>!(q.row.col===row.col&&q.row.id===row.id));

 async start(){if(!SB.sess||!ME.ws)return false;const lib=loadLibrary();
  if(!this.wired){this.wired=true;setInterval(()=>{if(!document.hidden)this.sync();},20000);
   window.addEventListener('online',()=>this.sync());document.addEventListener('visibilitychange',()=>{if(!document.hidden)this.sync();});}

  catch(e){STORE.setStatus(e.offline?'offline':'error',e.offline?'Sem conexão: trabalhando neste aparelho'+(this.outbox.length?' · '+this.outbox.length+' alteração(ões) aguardando envio':'')+'.':'Falha ao sincronizar: '+e.message);}
  },
 async send(rows){const vm=this.verMode===true;
  const r=await SB.req('POST','/rest/v1/records?on_conflict=workspace_id,col,id',rows.map(o=>{const x={workspace_id:ME.ws,col:o.col,id:o.id,data:o.data,deleted:!!o.deleted,updated_at:o.updated_at};
   /* todas as linhas com as mesmas chaves (exigência do envio em lote) */
   if(vm){x.base_ver=o.force?null:(o.base_ver!=null?o.base_ver:null);x.force=!!o.force;}return x;}),{headers:{Prefer:'resolution=merge-duplicates,return=minimal'}});
  /* gravou: a versão do servidor passou a ser a seguinte à de partida (a releitura confirma) */
  if(vm){rows.forEach(o=>{const k=o.col+':'+o.id;if(o.base_ver!=null&&!o.force)this.vers[k]=o.base_ver+1;else delete this.vers[k];});LS.set(VERKEY,this.vers);}

 /* envia a fila em lotes. Até a v17.12 um lote recusado era reenviado item a item e TODO item que falhasse

    mostrando zero pendências. Agora: falha passageira → para e mantém a fila (o envio é idempotente: upsert por chave);

   if(this.verMode!==false){try{rows=await q('col,id,data,deleted,updated_at,updated_by,srv_at,ver',off);this.verMode=true;}

 apply(r,changed){

  /* a edição pendente partiu da versão antiga: não atualiza a versão conhecida, para o servidor acusar o conflito */
  if(r.ver!=null&&!pend)this.vers[r.col+':'+r.id]=+r.ver;

  const arr=C.get();let k=arr.findIndex(x=>String(x.id)===r.id);const cur=k>=0?arr[k]:null;
  /* depois de um conflito (409) a versão do servidor vale aqui também; a edição deste aparelho está na quarentena */
  const lost=this.rejected.some(q=>q.status===409&&q.row.col===r.col&&q.row.id===r.id);
  if(cur&&(cur.updatedAt||0)>ts&&!lost)return;
  if(r.deleted){if(k>=0){arr.splice(k,1);changed.add(r.col);}return;}
  if(cur&&(cur.updatedAt||0)===ts&&cur._by===r.updated_by)return;
  /* receita editada aqui sem ver a versão do outro aparelho: a nossa vira uma cópia de conflito */
  if(r.col==='lib'&&libConflict(cur,r.data||{},ts)){const cp=conflictCopy(cur);STORE.put('lib',cp);k=arr.findIndex(x=>String(x.id)===r.id);toast('Receita "'+cur.name+'" foi editada em outro aparelho: sua versão ficou como cópia.');}
  const rec=safeRec(withFin(r.col,Object.assign({},r.data,{id:r.id,updatedAt:ts,_by:r.updated_by})));if(!rec)return;
  if(k>=0)arr[k]=rec;else arr.unshift(rec);changed.add(r.col);}
};

 const sec=`<details class="card dcard" id="execSec"${dOpen('execSec',!act||ROLE==='sous')}><summary><h2 style="margin:0">Receitas aprovadas</h2><span class="chip">${EXEC.length}</span></summary>

/* processo indicado pelo autor: o que é da receita (quando entram álcool e fruta) é aplicado; calor e maturação pertencem ao set
   de equipamentos e só aparecem como referência no método do autor */
const MASTER_PROC_KEYS=['alcStage','fruitStage'];
function masterProc(p){S.proc.alcStage='depois';S.proc.fruitStage='depois';if(!p||!p.proc)return'';const ch=[];MASTER_PROC_KEYS.forEach(k=>{const v=p.proc[k];if(v!=='antes'&&v!=='depois')return;if(S.proc[k]!==v){S.proc[k]=v;ch.push(k);}});
 return ch.filter(k=>S.proc[k]==='antes').map(k=>k==='alcStage'?(S.proc.alcStage==='antes'?'álcool antes do calor':'álcool na mistura fria'):(S.proc.fruitStage==='antes'?'fruta antes do calor':'fruta na mistura fria')).join(', ');}

 U.q='';U.sel=null;U.bal=null;render();toast(ING_BY[id].n+' adicionado');}

 planCopy:()=>{const cap=+S.planCap||(MACH[S.proc.machine]||{}).batch||5000;const res=planNeeds(S.plan,p=>srcByKey(p.key),cap);const by=invRecompute(INV);const t=['IL FREDOLIN — LISTA DE COMPRAS',...Object.entries(res.need).map(([id,g])=>{const s=Math.max(0,g-((by[id]||{q:0}).q));return s>0?`[ ] ${(s/1000).toFixed(2)} kg  ${ING_BY[id]?ING_BY[id].n:id}`:null;}).filter(Boolean)].join('\n');
  try{navigator.clipboard.writeText(t).then(()=>toast('Lista copiada'),()=>{U.planCopy=t;render();});}catch(e){U.planCopy=t;render();}},
 invAdd:()=>{const N=U.invNew||{};if(!(+N.kg>0)||!N.ingId)return;const e={id:'E'+Date.now(),ingId:N.ingId,qty:+N.kg*1000,costKg:+N.costKg||0,lot:N.lot||'',exp:N.exp||'',date:today()};STORE.put('inv',e);U.invNew={ingId:N.ingId,kg:'',costKg:'',lot:'',exp:''};render();toast('Entrada registrada');},
 invDel:v=>{STORE.del('inv',v);render();},
 impGo:()=>{if(!can.cost())return denied();applyImport();},impNo:()=>{U.imp=null;render();},impDel:()=>{if(U.imp){U.imp.withDel=!U.imp.withDel;render();}},
 expJson:async()=>{const cols={};BACKUP_COLS.forEach(c=>cols[c]=COLS[c].get());const data=JSON.stringify(Object.assign(backupPayload(cols,STORE.tomb,{v:VERSION,date:today(),exportedAt:new Date().toISOString()}),{vitrine:S.vitrine}),null,1);await saveFile('il_fredolin_backup_'+today()+'.json',data);},
 expCsv:async()=>{const h=['lote','data','receita','overrun_prev','overrun_med','brix_prev','brix_med','derretimento_prev','derretimento_med','textura','pasteurizacao','resfriamento_min','maturacao_h'];const rows=LOTS.map(L=>{const me=L.meas||{};return[L.code,L.date,L.name,f1(L.pred.ov),measuredOverrun(me)!=null?f1(measuredOverrun(me)):'',f1(L.pred.brix),me.brix||'',f0(L.pred.melt10),me.melt10||'',me.tex!=null?me.tex:'',me.pastT||'',me.coolMin||'',me.matH||''].map(x=>'"'+String(x).replace(/"/g,'""')+'"').join(';');});await saveFile('il_fredolin_lotes_'+today()+'.csv','﻿'+[h.join(';'),...rows].join('\n'));},
 frz:v=>{S.proc.storeT=clamp(Math.round((+S.proc.storeT+ +v)*2)/2,-35,-8);if(S.proc.serveFrom==='freezer')S.vit=S.proc.storeT;U.bal=null;render();},
 vit:v=>{S.vit=clamp(Math.round((+S.vit+ +v)*2)/2,-35,-6);if(S.proc.serveFrom==='freezer')S.proc.storeT=S.vit;U.bal=null;render();},
 pick:v=>{U.sel=v;U.q=ING_BY[v].n;renderNow();const g=$('#addG');g&&g.focus();g&&g.select();},
 testRun:()=>{U.test=runTests({ui:true});render();},
 ...EXEC_ACT,
 ...TEAM_ACT,
 ...V13_ACT,
 ...AT_ACT,
 ...MAT_ACT,
 ...FLOW_ACT,
 ...SET_ACT,
 ...SHELL_ACT
};

/* ---------- ENTRADAS (data-i, a cada tecla) ---------- */
/* número digitado → valor seguro: vazio/ inválido vira o padrão; fora da faixa vai para o limite */
const num=(v,lo,hi,dflt)=>v===''||v==null||!isFinite(+v)?dflt:clamp(+v,lo,hi);
const GEN_LIM={batch:[200,20000],fat:[0,30],msnf:[0,15],pod:[0,40],sol:[10,60],stabGkg:[0,30]};
setsWrap(ACT);
const INP={
 costCap:v=>{const n=parseFloat(String(v).replace(',','.'));S.costCap=isFinite(n)&&n>0?n:'';render();},
 name:v=>{S.name=v;render();},
 q:v=>{U.q=v;U.sel=null;render();},
 addG:v=>{U.addG=v;},scaleG:v=>{U.scaleG=v;},prodG:v=>{U.prodG=v;render();},
 g:(v,t)=>{const r=S.recipe.find(x=>x.id===t.dataset.id);if(r){r.g=num(v,0,1e5,0);U.bal=null;render();}},
 brix:(v,t)=>{if(v===''||!isFinite(+v))delete S.brix[t.dataset.id];else S.brix[t.dataset.id]=String(clamp(+v,1,85));render();},
 cost:(v,t)=>{if(v===''||!isFinite(+v))delete S.costs[t.dataset.id];else S.costs[t.dataset.id]=String(Math.max(0,+v));render();},
 proc:(v,t)=>{if(v===''||!isFinite(+v))return;const k=t.dataset.k,lim=PROC_LIM[k];S.proc[k]=lim?clamp(+v,lim[0],lim[1]):+v;if(k==='storeT'&&S.proc.serveFrom==='freezer')S.vit=S.proc.storeT;U.bal=null;render();},
 gen:(v,t)=>{if(v===''||!isFinite(+v))return;const k=t.dataset.k,lim=GEN_LIM[k];S.lab.gen[k]=lim?clamp(+v,lim[0],lim[1]):+v;U.gen=null;render();},
 genfg:(v,t)=>{S.lab.gen.fixed[+t.dataset.k].g=num(v,0,+S.lab.gen.batch||1000,0);U.gen=null;render();},
 varName:(v,t)=>{S.lab.variants[+t.dataset.k].name=v;render();},
 varG:(v,t)=>{const V=S.lab.variants[+t.dataset.k];const id=t.dataset.id;const g=num(v,0,1e5,0);const r=V.recipe.find(x=>x.id===id);if(r)r.g=g;else V.recipe.push({id,g});V.recipe=V.recipe.filter(x=>x.g>0||x.id===id);render();},
 sens:(v,t)=>{if(v===''||!isFinite(+v))return;const s=S.lab.sens,k=t.dataset.k;s[k]=k==='lo'?clamp(+v,-95,-1):clamp(+v,1,300);U.sens=null;render();},
 nxName:v=>{S.nxEdit.name=v;render();},
 nxDose:v=>{if(v===''||!isFinite(+v))return;S.nxEdit.dose=clamp(+v,0,50);U.nxTest=null;render();},
 nxG:(v,t)=>{S.nxEdit.parts[t.dataset.k]=num(v,0,1e4,0);U.nxTest=null;render();},
 libQ:v=>{U.libQ=v;U.libN=0;render();},
 cq:v=>{U.cq=v;render();},days:v=>{U.days=num(v,0,14,0);render();},
 lot:(v,t)=>{const L=LOTS.find(l=>l.id===U.lotOpen);if(!L)return;setPath(L,t.dataset.k,v===''?'':(t.type==='number'?+v:v));saveLotSoon(L);render();},
 lotTxt:v=>{const L=LOTS.find(l=>l.id===U.lotOpen);if(L){L.notes=v;saveLotSoon(L);}},
 ingQ:v=>{U.ingQ=v;render();},
 ing:(v,t)=>{const E=U.ingEdit;if(!E)return;const[p,k]=t.dataset.k.split('.');(p==='c'?E.c:E.x)[k]=v===''?'':(t.type==='number'?(p==='c'?num(v,0,100,0):num(v,...(({ph:[2,7.5],sat:[0,1],de:[1,100],brix:[0,90],na:[0,40000],cost:[0,1e6]})[k]||[-1e6,1e6]),0)):v);render();},
 ingName:v=>{if(U.ingEdit){U.ingEdit.n=v;render();}},
 planCap:v=>{S.planCap=v===''?'':num(v,100,1e5,'');render();},planKg:(v,t)=>{S.plan[+t.dataset.k].kg=num(v,0,1e4,0);render();},
 invNew:(v,t)=>{U.invNew=U.invNew||{ingId:'leite',kg:'',costKg:'',lot:'',exp:''};U.invNew[t.dataset.k]=v;},
 ...TEAM_INP,
 ...V13_INP,
 ...AT_INP,
 ...MAT_INP,
 ...FLOW_INP,
 ...SET_INP,
 ...SHELL_INP
};

/* ---------- MUDANÇAS (data-c, selects/checkboxes/arquivo) ---------- */
const CHG={
 compBal:t=>{S.compBal=!!t.checked;},
 defChk:t=>{U.defChk=U.defChk||{};U.defChk[t.dataset.v]=t.checked;},
 tipo:t=>{S.tipo=t.value;U.bal=null;},
 proc:t=>{const k=t.dataset.k;S.proc[k]=t.value;if(k==='pastHoldU'&&t.value==='min'&&S.proc.pastHold>60)S.proc.pastHold=30;},
 gen:t=>{const k=t.dataset.k;S.lab.gen[k]=t.value;if(k==='tipo')Object.assign(S.lab.gen,GEN_DEF[t.value]);U.gen=null;},
 genfx:t=>{S.lab.gen.fixed[+t.dataset.k].id=t.value;U.gen=null;},
 varNew:t=>{if(!t.value)return false;S.lab.variants.forEach(V=>{if(!V.recipe.some(r=>r.id===t.value))V.recipe.push({id:t.value,g:0});});},
 sens:t=>{S.lab.sens.id=t.value;U.sens=null;},
 nxDairy:t=>{S.nxEdit.dairy=t.value==='1';},
 nxAdd:t=>{if(!t.value)return false;S.nxEdit.parts[t.value]=10;U.nxTest=null;},
 calOn:t=>{CAL.on=t.checked;CAL.ver++;LS.set(K10.cal,{on:CAL.on});},
 lot:t=>{const L=LOTS.find(l=>l.id===U.lotOpen);if(L){setPath(L,t.dataset.k,t.value===''?'':+t.value);
  /* gelo nas checagens D+1/3/7: o primeiro dia com gelo vira o "dia em que percebeu gelo" da calibração */
  const mk=/^meas\.ice(\d)$/.exec(t.dataset.k);if(mk){const me=L.meas=L.meas||{};const first=[1,3,7].find(d=>+me['ice'+d]>0);if(first&&(me.icyDay==null||me.icyDay===''||me._icyAuto)){me.icyDay=first;me._icyAuto=1;}else if(!first&&me._icyAuto){me.icyDay='';delete me._icyAuto;}}
  saveLotSoon(L);}},
 ingCat:t=>{U.ingCat=t.value;},
 ingAl:t=>{if(!U.ingEdit)return false;const a=U.ingEdit.x.al=U.ingEdit.x.al||[];const k=t.dataset.k;if(t.checked&&!a.includes(k))a.push(k);if(!t.checked)U.ingEdit.x.al=a.filter(x=>x!==k);},
 ingFlag:t=>{if(!U.ingEdit)return false;U.ingEdit.x[t.dataset.k]=t.checked?1:0;},
 vitAdd:t=>{if(!t.value)return false;const s=srcByKey(t.value);if(s){S.vitrine.items.push({name:s.name.replace(/^Receita da bancada · /,''),tipo:s.tipo,recipe:JSON.parse(JSON.stringify(s.recipe))});saveVit();}},
 planSrc:t=>{S.plan[+t.dataset.k].key=t.value;},
 invNew:t=>{U.invNew=U.invNew||{kg:'',costKg:'',lot:'',exp:''};U.invNew.ingId=t.value;},
 ...TEAM_CHG,
 ...V13_CHG,
 ...MAT_CHG
};
/* importar = ler, planejar e mostrar o plano; nada é gravado antes de "Restaurar" */
function importBackup(file){const fr=new FileReader();fr.onload=()=>{try{const d=JSON.parse(fr.result);const cols={};BACKUP_COLS.forEach(c=>cols[c]=COLS[c].get());
  U.imp={name:file.name,plan:planImport(d,cols,STORE.tomb),withDel:false};render();}catch(err){U.imp=null;toast('Arquivo inválido: não é um backup do Il Fredolin.');}};fr.readAsText(file);}
function applyImport(){const I=U.imp;if(!I)return;let n=0;
 BACKUP_COLS.forEach(c=>{const P=I.plan.cols[c];[...P.add,...P.upd,...(I.withDel?P.del:[])].forEach(r=>{const x=Object.assign({},r);delete x.base;STORE.put(c,x);n++;});});
 const v=VITS.find(x=>x.id==='main');if(v){S.vitrine={temp:v.temp,items:v.items||[]};LS.set(K10.vit,S.vitrine);}
 U.imp=null;render();toast(n+' item(ns) restaurado(s)');}
function importCard(){const I=U.imp;if(!I)return'';const P=I.plan,t=P.total;
 const rows=BACKUP_COLS.filter(c=>{const x=P.cols[c];return x.add.length||x.upd.length||x.keep||x.del.length;}).map(c=>{const x=P.cols[c];
  return`<div class="kv"><span>${BACKUP_N[c]}</span><span>${x.add.length} novos · ${x.upd.length} atualizados · ${x.keep} mantidos${x.del.length?' · '+x.del.length+' apagados aqui':''}</span></div>`;}).join('');
 return`<div class="card"><h2>Restaurar ${esc(I.name)}</h2><p class="note">Backup ${esc(P.version)} de ${esc(P.date)}. Registros iguais ou mais novos neste aparelho são <b>mantidos</b>: o backup só completa o que falta ou está mais antigo.</p>${rows||'<p class="muted">Nada no arquivo.</p>'}
 ${t.del?`<label class="row" style="gap:8px;margin-top:8px"><input type="checkbox" data-a="impDel" ${I.withDel?'checked':''}> Trazer de volta também ${t.del} item(ns) apagado(s) depois deste backup</label>`:''}
 <div class="row" style="margin-top:10px"><button class="btn pri" data-a="impGo" ${t.add+t.upd+(I.withDel?t.del:0)?'':'disabled'}>Restaurar ${t.add+t.upd+(I.withDel?t.del:0)} item(ns)</button><button class="btn" data-a="impNo">Cancelar</button></div></div>`;}

/* ---------- EVENTOS: um ouvinte por tipo ---------- */
/* toda ação passa pela checagem do perfil (o servidor também recusa o que o perfil não pode) */
const denied=()=>toast('Seu perfil não tem acesso a esta função.');
/* ações que não mexem na receita não entram no desfazer */
const NO_UNDO=new Set(['impNo','impDel','rejDrop','rejDropNo','rejExport','appReload','go','sub','defMode','defSym','defClr','defOpen','defCat','fam','palOpen','palClose','palRun','undo','copy','chk','unchk','libTab','libAuthor','libMore','libTipo','libVitF','simOpen','simClose','cmpToggle','cmpClear','histOpen','lotOpen','crTab','crSub','atGoal','setSw','navTog','toTop','flowOpen','flowView','flowNotify','flowNext','flowBack','flowDisc','flowColor','flowStart','flowLot','procGo','procPlay','atSel','atPick','atCard','atExplore','nxGoal','sazM','del','delNo','meltTimer','panelSet','panelStart','panelNext','panelCancel','panelReveal','panelReset','testRun','syncNow','age','pick']);
function runAct(k,v,t){if(NO_UNDO.has(k))return ACT[k](v,t);const before=undoSnap();undoMark();const r=ACT[k](v,t);
 if(r&&typeof r.then==='function')return r;if(undoSnap()===before)undoSettle();else if(UNDO_TOAST.has(k))toastUndo();return r;}
document.addEventListener('toggle',e=>{const d=e.target;if(d&&d.tagName==='DETAILS'&&d.id){U.dopen=U.dopen||{};U.dopen[d.id]=d.open;}},true);
document.addEventListener('click',e=>{const t=e.target.closest('[data-a]');if(!t)return;e.preventDefault();const k=t.dataset.a;if(!ACT[k])return;if(!can.act(k))return denied();runAct(k,t.dataset.v,t);});
/* régua do termômetro: tocar ou arrastar muda a vitrine */
document.addEventListener('pointerdown',e=>{const r=e.target.closest&&e.target.closest('[data-rail]');if(!r||ROLE==='sous')return;e.preventDefault();railStart(r,e);});
document.addEventListener('pointermove',railMove);document.addEventListener('pointerup',railEnd);document.addEventListener('pointercancel',railEnd);
const UNDO_INP=new Set(['name','g','brix','proc','comp','compG']);
document.addEventListener('input',e=>{const t=e.target;if(!t.dataset||!t.dataset.i||!INP[t.dataset.i])return;if(!can.inp(t.dataset.i,t))return denied();if(UNDO_INP.has(t.dataset.i))undoMark(t.dataset.i+':'+(t.dataset.id||t.dataset.k||''));INP[t.dataset.i](t.value,t);});
document.addEventListener('change',e=>{const t=e.target;if(t.id==='impFile'&&t.files&&t.files[0]){if(!can.cost())return denied();importBackup(t.files[0]);return;}
 const c=t.dataset&&t.dataset.c;if(!c||!CHG[c])return;if(!can.chg(c))return denied();if(['tipo','proc','comp','compIng'].includes(c))undoMark();if(CHG[c](t)!==false)render();});
document.addEventListener('keydown',e=>{
 if(e.target&&e.target.dataset&&e.target.dataset.rail&&ROLE!=='sous'&&railKey(e))return;
 const mod=e.metaKey||e.ctrlKey,k=(e.key||'').toLowerCase(),inField=/^(INPUT|TEXTAREA|SELECT)$/.test((e.target&&e.target.tagName)||'')&&e.target.id!=='palQ';
 if(mod&&e.key==='\\'){e.preventDefault();SHELL_ACT.navTog();return;}
 if(mod&&!e.shiftKey&&!e.altKey&&/^[1-5]$/.test(e.key)&&ROLE!=='sous'){const f=FAMILIES.filter(x=>famPages(x[0]).length)[+e.key-1];if(f){e.preventDefault();ACT.fam(f[0]);return;}}
 if(mod&&k==='k'&&!(APP_MODE==='app'&&AUTH.state!=='ready')){e.preventDefault();U.pal?ACT.palClose():ACT.palOpen();return;}
 if(U.pal){const n=palItems(U.pal.q||'').length;
  if(e.key==='Escape'){e.preventDefault();ACT.palClose();return;}
  if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();U.pal.sel=((U.pal.sel||0)+(e.key==='ArrowDown'?1:-1)+n)%Math.max(1,n);render();setTimeout(()=>{const el=document.getElementById('pal-'+U.pal.sel);el&&el.scrollIntoView&&el.scrollIntoView({block:'nearest'});},0);return;}
  if(e.key==='Enter'){e.preventDefault();palRun(U.pal.sel||0);return;}
  return;}
 if(mod&&k==='s'&&can.act('save')&&ROLE!=='sous'){e.preventDefault();ACT.save();return;}
 if(mod&&k==='z'&&!e.shiftKey&&!inField&&can.act('undo')){e.preventDefault();ACT.undo();return;}if(e.key==='Enter'&&e.target.dataset&&e.target.dataset.i==='auth'){e.preventDefault();ACT.authGo();return;}if(e.key==='Enter'&&e.target.id==='q'){e.preventDefault();addSel();}if(e.key==='Enter'&&e.target.id==='addG'){e.preventDefault();addSel();}if(e.key==='Enter'&&e.target.id==='scaleG'){e.preventDefault();ACT.scale();}});

/* ---------- BOOT ---------- */
if(APP_MODE==='app')AUTH.boot();else{renderNow();STORE.init();}

</script>
