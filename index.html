function newLotFromBench(){const m=analyze(S);if(m.empty)return null;const id='L'+Date.now();
 return{id,code:lotCode(),date:today(),name:S.name,tipo:S.tipo,vit:S.vit,recipe:JSON.parse(JSON.stringify(S.recipe)),proc:JSON.parse(JSON.stringify(S.proc)),brix:JSON.parse(JSON.stringify(S.brix)),
  pred:{ov:m.ov,fzVit:m.fzVit,serveT:m.serveT,melt10:m.melt10,crystal:m.crystal,brix:m.brixMix,shelf:m.shelfVit,ph:m.ph,visc:m.visc},
  /* o plano fica guardado à parte; as medições começam vazias: um registro de APPCC só vale com o valor medido */
  plan:{pastT:S.proc.pastT,pastHold:S.proc.pastHold,coolMin:S.proc.coolMin,matH:S.proc.matH,matT:S.proc.matT,drawT:S.proc.drawT,drawMin:S.proc.drawMin},
  meas:{texTemp:S.vit},sens:{},trace:{},notes:'',status:'aberto',by:ME.email||'',exec:S.execId&&EXEC.some(e=>e.id===S.execId)?{id:S.execId,v:(EXEC.find(e=>e.id===S.execId)||{}).v}:null};}
/* pontos críticos de controle do lote; campo não medido nunca conta como "ok" */
function haccp(L){const me=L.meas||{};const out=[];const has=k=>me[k]!==''&&me[k]!=null&&isFinite(+me[k]);const fm=k=>has(k)?fT(+me[k]):'—';const pT=+me.pastT;
 const holdOk=L.proc&&L.proc.pastHoldU==='min'?+me.pastHold>=30:true;
 out.push(['Pasteurização',!has('pastT')?'warn':pT>=80||(pT>=65&&holdOk&&L.proc&&L.proc.pastHoldU==='min')?'ok':pT>=72?'warn':'crit',fm('pastT')+' °C']);
 out.push(['Resfriamento',!has('coolMin')?'warn':+me.coolMin<=120?'ok':'crit',fm('coolMin')+' min até 4 °C']);
 out.push(['Maturação',!has('matT')||!has('matH')?'warn':+me.matT<=4.5&&+me.matH<=72?'ok':+me.matT<=6?'warn':'crit',fm('matH')+' h a '+fm('matT')+' °C']);
 const eggFresh=(L.recipe||[]).some(r=>ING_BY[r.id]&&ING_BY[r.id].egg==='fresh');if(eggFresh)out.push(['Ovo cru',has('pastT')&&pT>=82?'ok':'crit','exige ≥ 82 °C']);
 out.push(['Rastreabilidade',(L.recipe||[]).every(r=>(L.trace||{})[r.id])?'ok':'warn',Object.keys(L.trace||{}).filter(k=>L.trace[k]).length+'/'+(L.recipe||[]).length+' lotes']);
 return out;}

 ${open?lotEditor(open):''}
 <div class="card flat"><p class="note" style="margin:0"><b style="color:var(--t2)">Como medir sem laboratório.</b> Overrun: encha um copo de volume fixo com a mistura e pese; depois o mesmo copo com o gelato recém-extraído, nivelado (overrun = (mistura − gelato) ÷ gelato). Derretimento: 100 g de gelato numa grade a 20 °C; pese o que escorreu em 10 min. Textura: avalie na espátula, de −2 (muito mole) a +2 (muito duro), anotando a temperatura da vitrine. Gelo: anote o dia em que percebeu cristais na língua.</p></div></div>`;}

function pgIngredientes(){const E=U.ingEdit;const q=norm(U.ingQ||'');const cat=U.ingCat||'Todas';
 const cats=['Todas',...new Set(ING.filter(i=>i.id!=='nx_tmp').map(i=>i.cat))];

 ${L.slice(0,160).map(i=>{const[pac,pod]=ingPacPod(i);return`<tr><td>${esc(i.n)}<div class="muted" style="font-size:11px">${esc(i.cat)}${(i.al||[]).length?' · '+i.al.join(', '):''}</div></td><td class="r mono">${f0(i.c.w||0)}</td><td class="r mono">${f1(i.c.fat||0)}</td><td class="r mono">${f0(pac)}</td><td class="r mono">${f0(pod)}</td>${$cost(`<td class="r mono">${f0(INVCOST[i.id]!=null?INVCOST[i.id]:i.cost||0)}</td>`)}<td class="r"><div class="row" style="justify-content:flex-end;gap:4px">${i.custom?`<button class="btn sm" data-a="ingEdit" data-v="${i.id}">Editar</button><button class="btn del" data-a="ingDel" data-v="${i.id}" aria-label="Excluir">✕</button>`:`<button class="btn sm" data-a="ingDup" data-v="${i.id}">Duplicar</button>`}</div></td></tr>`;}).join('')}</tbody></table></div><p class="note">PAC e POD por 100 g do ingrediente.</p></div></div>`;}
function ingEditor(E){const sum=CFIELDS.reduce((a,[k])=>a+(+E.c[k]||0),0);const tmp={c:E.c,de:+E.x.de||20};const[pac,pod]=ingPacPod(tmp);const hf=HFK.B*(+E.x.hfB||0)+HFK.S*(+E.x.hfS||0)+HFK.N*(+E.x.hfN||0);

 <div class="form" style="margin-top:12px"><label class="field" style="grid-column:span 2"><span class="lbl">Nome</span><input type="text" id="ie-n" data-i="ingName" value="${esc(E.n)}" maxlength="60"></label>
  <label class="field" style="grid-column:span 2"><span class="lbl">Nome no rótulo</span><input type="text" id="ie-lab" data-i="ing" data-k="x.lab" value="${esc(E.x.lab||'')}"></label>
  ${can.cost()?n('cost','Custo (R$/kg)','x.'):''}${n('brix','°Brix (frutas)','x.')}${n('ph','pH','x.')}${n('de','DE do xarope','x.')}${n('na','Sódio (mg/100 g)','x.')}${n('sat','Fração saturada (0–1)','x.')}</div>

 <div class="row" style="margin-top:12px;gap:14px;flex-wrap:wrap">${EU14K.map(a=>`<label class="row" style="gap:5px;font-size:12.5px"><input type="checkbox" data-c="ingAl" data-k="${a}" id="ie-al-${a}"${(E.x.al||[]).includes(a)?' checked':''}> ${a}</label>`).join('')}

/* ===================== VITRINE ===================== */
function pgVitrine(){const V=S.vitrine;const rows=vitrineAnalysis(V.items,V.temp);const best=rows.length?bestVitrineTemp(rows):null;const srcs=recipeSources();
 const W=640,H=Math.max(80,rows.length*30+40),L=170,R=20,T=10,tx=t=>L+(clamp(t,-24,-4)+24)/20*(W-L-R);let g=`<rect x="${tx(V.temp-1.5)}" y="${T}" width="${tx(V.temp+1.5)-tx(V.temp-1.5)}" height="${H-T-24}" fill="rgba(110,231,183,.1)"/><line x1="${tx(V.temp)}" x2="${tx(V.temp)}" y1="${T}" y2="${H-24}" stroke="var(--ok)"/>`;
 for(let t=-24;t<=-4;t+=4)g+=`<text x="${tx(t)}" y="${H-8}" text-anchor="middle" fill="var(--t3)" font-size="10">${t}°</text>`;
 rows.forEach((r,i)=>{const y=T+16+i*30;const col=Math.abs(r.dev)<=1.5?'var(--ok)':Math.abs(r.dev)<=3?'var(--warn)':'var(--crit)';g+=`<text x="${L-8}" y="${y+4}" text-anchor="end" fill="var(--t2)" font-size="11">${esc(r.it.name.slice(0,24))}</text><line x1="${tx(V.temp)}" x2="${tx(r.m.serveT)}" y1="${y}" y2="${y}" stroke="${col}" stroke-width="2"/><circle cx="${tx(r.m.serveT)}" cy="${y}" r="6" fill="${col}"/>`;});
 return`<div class="pg"><div><h1>Vitrine</h1><p class="lead">Todos os sabores dividem a mesma temperatura. Monte a vitrine do dia: o motor mostra qual sabor vai ficar duro ou mole e rebalanceia cada um para servir no ponto.</p></div>
 <div class="card"><div class="row"><div class="field" style="width:auto"><span class="lbl">Temperatura da vitrine</span><div class="vit"><button data-a="vitT" data-v="-.5" aria-label="Mais frio">−</button><output>${f1(V.temp)} °C</output><button data-a="vitT" data-v=".5" aria-label="Menos frio">+</button></div></div>
  ${best!=null&&Math.abs(best-V.temp)>=.5?`<button class="btn sm" data-a="vitBest">Usar ${f1(best)} °C (mediana dos sabores)</button>`:''}<span class="sp"></span>
  <select id="vitAdd" data-c="vitAdd" style="max-width:320px" aria-label="Adicionar sabor"><option value="">+ adicionar sabor…</option>${srcs.map(s=>`<option value="${esc(s.key)}">${esc(s.name)}</option>`).join('')}</select></div></div>
 ${rows.length?`<div class="card"><h2>Temperatura ideal de cada sabor</h2><div class="tw"><svg viewBox="0 0 ${W} ${H}" style="width:100%;min-width:520px;height:auto" role="img" aria-label="Temperatura ideal de serviço por sabor">${g}</svg></div><p class="note">Ponto: temperatura em que o sabor fica com a textura ideal. Faixa verde: ±1,5 °C da vitrine.</p></div>
 <div class="card"><h2>Sabores (${rows.length})</h2><div class="tw"><table class="tbl"><thead><tr><th>Sabor</th><th class="r">Serviço ideal</th><th class="r">Congelada a ${f1(V.temp)}°</th><th class="r">Índice</th><th></th></tr></thead><tbody>
  ${rows.map((r,i)=>{const s=Math.abs(r.dev)<=1.5?'ok':Math.abs(r.dev)<=3?'warn':'crit';const hb=U.vitBal&&U.vitBal.i===i?U.vitBal.r:null;return`<tr><td>${esc(r.it.name)}<div class="muted" style="font-size:11px">${esc(PROF[r.it.tipo].n)}</div></td><td class="r mono">${f1(r.m.serveT)} °C</td><td class="r"><span class="chip ${s}">${f0(r.m.fzVit)}% · ${r.dev>1.5?'fica duro':r.dev<-1.5?'fica mole':'no ponto'}</span></td><td class="r mono">${r.sc}</td><td class="r"><div class="row" style="justify-content:flex-end;gap:4px">${s!=='ok'?`<button class="btn sm pri" data-a="vitHarm" data-v="${i}">Harmonizar</button>`:''}<button class="btn sm" data-a="vitOpen" data-v="${i}">Abrir</button><button class="btn del" data-a="vitRm" data-v="${i}" aria-label="Remover">✕</button></div></td></tr>
   ${hb?`<tr><td colspan="5">${hb.ok?`<div class="fix" style="padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surf)">${hb.prop.map((x,k)=>esc(ING_BY[x.id].n)+' '+f0(hb.cur[k])+' → <b class="c-ice">'+f0(x.g)+' g</b>').join(' · ')} → ${f0(hb.m1.fzVit)}% congelada, POD ${f1(hb.m1.pod)}% <button class="btn sm okb" data-a="vitApply" style="margin-left:8px">Aplicar</button></div>`:`<span class="c-warn">${esc(hb.msg)}</span>`}</td></tr>`:''}`;}).join('')}</tbody></table></div></div>`:'<div class="card"><p class="muted" style="margin:0">Adicione os sabores do dia pelo menu acima.</p></div>'}</div>`;}

/* ===================== QUÍMICA E SENSORIAL ===================== */
function pgQuimica(m){if(m.empty)return`<div class="pg"><h1>Química e sensorial</h1><p class="lead">Monte uma receita primeiro.</p></div>`;
 const t0=Math.min(-20,Math.floor(m.vit/2)*2);const temps=[];for(let t=t0;t<=-6;t+=1)temps.push(t);const W=600,H=200,L=40,R=12,T=12,B=28;const pods=temps.map(t=>m.pod*podTempFactor(t));const lo=Math.min(...pods,m.P.pod[0])-2,hi=Math.max(...pods,m.P.pod[1])+2;
 const sx=t=>L+(t-t0)/(-6-t0)*(W-L-R),sy=v=>T+(1-(v-lo)/(hi-lo))*(H-T-B);let g=`<rect x="${L}" y="${sy(m.P.pod[1])}" width="${W-L-R}" height="${sy(m.P.pod[0])-sy(m.P.pod[1])}" fill="rgba(110,231,183,.1)"/>`;
 temps.forEach(t=>{if(t%2===0)g+=`<text x="${sx(t)}" y="${H-10}" text-anchor="middle" fill="var(--t3)" font-size="10">${t}°</text>`;});
 g+=`<path d="${temps.map((t,i)=>(i?'L':'M')+sx(t)+','+sy(pods[i])).join('')}" fill="none" stroke="var(--gold)" stroke-width="2.4"/><line x1="${sx(m.vit)}" x2="${sx(m.vit)}" y1="${T}" y2="${H-B}" stroke="var(--ice)" stroke-dasharray="3 3"/><circle cx="${sx(m.vit)}" cy="${sy(m.podPerc)}" r="5" fill="var(--ice)"/>`;
 [lo,hi].forEach(v=>g+=`<text x="${L-6}" y="${sy(v)+4}" text-anchor="end" fill="var(--t3)" font-size="10">${f0(v)}</text>`);
 const tg=m.tg;
 return`<div class="pg"><div><h1>Química e sensorial</h1><p class="lead">Propriedades que o balanceamento clássico não mostra: viscosidade da mistura, pH, transição vítrea da fase concentrada, cinética de recristalização e percepção de doçura e aroma.</p></div>
 <div class="g3">
  <div class="card"><h2>Viscosidade a 4 °C</h2><div class="big ${m.visc<25||m.visc>800?'c-warn':'c-ok'}">${f0(m.visc)}<small class="muted" style="font-size:14px"> mPa·s</small></div><p class="note">Fase sérica pela concentração de solutos, proteínas, Krieger-Dougherty para gordura e insolúveis e contribuição de cada hidrocoloide. Faixa de trabalho 50–400 mPa·s; abaixo de 25 a mistura não segura ar, acima de 800 a mantecadora sofre.</p></div>
  <div class="card"><h2>pH e acidez</h2><div class="big ${m.msnf>.5&&m.ph<5.2?'c-warn':''}">${f1(m.ph)}</div><p class="t2" style="margin:6px 0 0">Acidez titulável ${f2(m.ta)}% (ácido cítrico equivalente)</p><p class="note">Fonte ácida dominante diluída na água da mistura, tamponada pelas proteínas do leite. Com leite, abaixo de 5,2 a caseína coagula no calor; abaixo de 4,6 agrega mesmo a frio.</p></div>
  <div class="card"><h2>Transição vítrea Tg′</h2><div class="big c-ice">${f1(tg)}<small class="muted" style="font-size:14px"> °C</small></div><p class="t2" style="margin:6px 0 0">Vitrine a ${f0(m.dTgVit)} °C acima · estoque a ${f0(m.dTgStore)} °C acima</p><p class="note">Abaixo de Tg′ a fase concentrada vira vidro e os cristais param de crescer. A velocidade de recristalização segue a equação WLF da distância até Tg′.</p></div>
 </div>
 <div class="card"><div class="row"><h2 style="margin:0">Freezer de armazenamento</h2><span class="sp"></span><button class="btn sm" data-a="go" data-v="processo">Ajustar no Processo</button></div>
  <div class="g3" style="margin-top:10px;gap:12px">
   <div><span class="lbl">Temperatura medida</span><div class="big ${m.pr.storeT>-15?'c-crit':m.pr.storeT>-18?'c-warn':'c-ice'}">${f1(m.pr.storeT)}<small class="muted" style="font-size:14px"> °C ± ${f1(+m.pr.storeFluct||0)}</small></div></div>
   <div><span class="lbl">Água congelada no freezer</span><div class="big">${f0(m.fzStore)}<small class="muted" style="font-size:14px">%</small></div><p class="note" style="margin:4px 0 0">Ao retirar: ${m.storeHard}${m.pr.serveFrom==='freezer'?' · serviço direto do freezer':''}</p></div>
   <div><span class="lbl">${m.pr.serveFrom==='freezer'?'Vida útil no freezer':'Aclimatação até a vitrine'}</span><div class="big">${m.pr.serveFrom==='freezer'?(m.shelfStore>180?'180+':f0(m.shelfStore))+'<small class="muted" style="font-size:14px"> dias</small>':f0(m.temperMin)+'<small class="muted" style="font-size:14px"> min</small>'}</div><p class="note" style="margin:4px 0 0">${m.pr.serveFrom==='freezer'?'Com oscilação de ±'+f1(+m.pr.storeFluct||0)+' °C (fator ×'+f2(m.kin.fFluct)+').':'Cuba de 5 L, de '+f1(m.pr.storeT)+' a '+f1(m.vit)+' °C. Faça em etapas para evitar choque térmico.'}</p></div>
  </div>
  <p class="note">O freezer não muda a temperatura de serviço, que é a da vitrine; ele decide quanto o gelato endurece no estoque, quanto tempo precisa aclimatar e, sobretudo, a velocidade com que os cristais crescem. Oscilação (porta, degelo) pesa mais que a temperatura média. Se você serve direto do freezer, escolha "Direto do freezer" no Processo: o balanceamento passa a mirar a temperatura dele.</p></div>
 <div class="g2">
  <div class="card"><h2>Vida útil prevista</h2><div class="kv"><span>Na vitrine (${f1(m.vit)} °C)</span><span class="${m.shelfVit>=5?'c-ok':m.shelfVit>=2?'c-warn':'c-crit'}">${m.shelfVit>60?'60+':f1(m.shelfVit)} dias</span></div><div class="kv"><span>No freezer (${fT(m.pr.storeT)} °C)</span><span>${m.shelfStore>180?'180+':f0(m.shelfStore)} dias</span></div><div class="kv"><span>Cristal inicial</span><span>${m.crystal} µm</span></div>
   <div class="kv"><span>Fatores de K</span><span>estab. ${f2(m.kin.fStab)} · choque ${f2(m.kin.fShock)} · WLF ${f2(m.kin.fKinVit)}${m.kin.km!==1?' · calib. '+f2(m.kin.km):''}</span></div><p class="note">Dias até o cristal médio passar de 50 µm (Ostwald, d³ = d₀³ + K·t).</p></div>
  <div class="card"><h2>Percepção</h2><div class="kv"><span>Doçura percebida a ${f1(m.vit)} °C</span><span class="c-gold">${f1(m.podPerc)}%</span></div><div class="kv"><span>Liberação de aroma</span><span class="${m.aroma>=75?'c-ok':m.aroma>=55?'c-warn':'c-crit'}">${f0(m.aroma)}/100</span></div><div class="kv"><span>Derretido em 10 min a 20 °C</span><span>${f0(m.melt10)}%</span></div>
   <p class="note">O frio reduz a doçura percebida (cerca de 2,5% por grau abaixo de −12 °C). Gordura, gomas, ar e proteína em excesso prendem os voláteis: aromas delicados (flores, ervas, frutas brancas) pedem índice acima de 75.</p></div></div>
 <div class="card"><h2>Doçura percebida × temperatura de serviço</h2><div class="tw"><svg viewBox="0 0 ${W} ${H}" style="width:100%;min-width:460px;height:auto" role="img" aria-label="Doçura percebida por temperatura">${g}</svg></div><p class="note">Faixa verde: doçura-alvo de ${esc(m.P.n.toLowerCase())}. Ponto azul: vitrine atual.</p></div></div>`;}

function pgPlanejamento(){const mach=MACH[S.proc.machine]||MACH.horiz;const cap=+S.planCap||mach.batch||5000;const srcs=recipeSources();

  <div><button class="btn sm" data-a="planAdd">+ Sabor</button></div></div></div>
 ${res.runs.length?`<div class="card"><h2>Ciclos</h2>${res.runs.map(r=>`<div class="kv"><span>${esc(r.name)}</span><span>${f1(r.g/1000)} kg · ${r.cycles} ${r.cycles===1?'ciclo':'ciclos'} de ${f0(r.perCycle)} g</span></div>`).join('')}<div class="kv"><span><b>Total</b></span><span><b>${(n=>n+(n===1?' ciclo':' ciclos'))(res.runs.reduce((a,r)=>a+r.cycles,0))}</b></span></div></div>

/* ===================== IL FREDOLIN · RECEITAS EM EXECUÇÃO E APROVAÇÃO =====================

   (congelada: ingredientes, processo e vitrine) → o Sous Chef produz exatamente aquela versão.

const fmtDate=d=>{try{return new Date(d).toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit',year:'numeric'});}catch(e){return'';}};
const execOfBench=()=>EXEC.find(e=>e.id===S.execId)||(S.libId?EXEC.find(e=>e.src===S.libId):null);

function approveCard(m,F,sc){if(!can.approve()||m.empty)return'';
 const ex=execOfBench(),crit=F.filter(f=>f.sev==='crit').length;
 const same=ex&&JSON.stringify(ex.recipe)===JSON.stringify(S.recipe)&&ex.tipo===S.tipo&&JSON.stringify(ex.proc)===JSON.stringify(S.proc);
 return`<div class="card approve"><div class="row"><div style="flex:1;min-width:220px"><h2 style="margin:0 0 4px">Execução</h2>
  <p class="t2" style="margin:0;font-size:13px">${ex?`Em execução como <b>${esc(ex.name)}</b> v${ex.v} · aprovada por ${esc(ex.by||'—')} em ${fmtDate(ex.at)}.${same?' Esta é a versão em produção.':' A bancada tem alterações em relação à versão em produção.'}`:'Esta receita ainda não está em execução. Ao aprovar, o Sous Chef passa a vê-la e produzi-la exatamente como está.'}</p>
  ${crit&&!same?`<p class="c-crit" style="margin:6px 0 0;font-size:12.5px">O laudo aponta ${crit} erro(s) crítico(s). Revise antes de aprovar.</p>`:''}</div>
  ${same?'':`<button class="btn ${crit?'del':'okb'}" data-a="approve">${ex?'Aprovar v'+(ex.v+1):'Aprovar para execução'}${crit?' mesmo assim':''}</button>`}</div></div>`;}

/* ===================== CREATOR — MODELO DE MICROESTRUTURA ===================== */
/* Converte o resultado do motor em grandezas de microestrutura (campo de 400 µm):
   fração de gelo, de ar, diâmetro médio dos cristais, envelhecimento por Ostwald (LSW: d³ = d0³ + K·t),
   gordura parcialmente coalescida, proteína nas interfaces, lactose cristalizada e rede de hidrocoloides. */
const FIELD_UM=400,AIR_D=40,SENS_D=50;
function microModel(st,m,F,sc,days){
 const P=m.P,pr=m.pr,o={};
 const fz=m.fzVit/100,phiAir=m.ov/(100+m.ov);
 const iceVol=(m.wat/100)*fz/.917,mixVol=1/m.rhoMix;o.phiIce=clamp(iceVol/mixVol*(1-phiAir),0,.75);o.phiAir=phiAir;
 /* coarsening */
 const lo=P.stab[0],hiS=P.stab[1];const k=m.kin;
 o.K=k.Kvit;o.d0=m.crystal;o.d=Math.cbrt(Math.pow(o.d0,3)+o.K*days);o.shelf=m.shelfVit;o.shelfStore=m.shelfStore;
 o.fStab=k.fStab;o.fShock=k.fShock;o.fSerum=k.fKinVit;o.km=k.km;
 /* ar */
 const protOk=m.prot>=Math.max(.5,P.prot[0]-.5)||st.tipo==='sorbetto';const bubbleStable=protOk&&m.hydro>=P.stab[0]*.6;
 o.airD=AIR_D*(1+(bubbleStable?0:.05*days))*(m.ov>P.ov[1]+5?1.15:1);o.bubbleStable=bubbleStable;
 /* gordura e proteína (aglomerados ampliados para visibilidade) */
 o.nFat=Math.round(clamp(m.fat*7,0,90));o.destab=m.hasEmul?.38:.16;o.butter=m.fat>11.5||(m.keyPct.mono||0)>.35||(m.fat>10.5&&pr.drawMin>13);
 o.nProt=Math.round(clamp(m.prot*9,0,50));
 o.nLac=m.lacW>9?Math.round((m.lacW-9)*5*(1+days/6)):(m.lacW>8.3&&days>6?Math.round((days-6)*.6):0);
 /* rede de estabilizante */
 o.net=m.hydro<.02?0:clamp(m.hydro/((lo+hiS)/2),0,2.2);o.netExcess=m.hydro>hiS*1.25||(m.keyPct.xan||0)>.18;
 /* estados */
 o.soft=m.fzVit<P.fz[0]-1;o.hard=m.fzVit>P.fz[1]+1;o.big=o.d>45;
 o.serumConc=m.SE/(1-fz||1);
 const crit=F.filter(f=>f.sev==='crit').length,warn=F.filter(f=>f.sev==='warn').length;
 o.imbalance=clamp(Math.abs(m.fzVit-m.fzMid)/12+crit*.35+warn*.08+(o.big?.3:0)+(o.nLac>0?.2:0)+(o.butter?.2:0),0,1.5);
 const structural=['Térmico','Sólidos','Estrutura','Lactose','Estabilização','Processo','Segurança'];
 o.perfect=sc>=92&&!F.some(f=>(f.sev==='crit'||f.sev==='warn')&&structural.includes(f.area))&&!o.big&&o.nLac===0;
 o.score=sc;
 /* indicadores do painel */
 const st3=(ok,warnC)=>ok?'ok':warnC?'warn':'crit';
 o.pills=[
  ['Congelamento',f0(m.fzVit)+'% a '+f1(m.vit)+'°',st3(Math.abs(m.fzVit-m.fzMid)<=3,Math.abs(m.fzVit-m.fzMid)<=8)],
  ['Cristais de gelo','≈'+f0(o.d)+' µm',st3(o.d<=42,o.d<=SENS_D)],
  ['Doçura','POD '+f1(m.pod)+'%',st3(m.pod>=P.pod[0]&&m.pod<=P.pod[1],m.pod>=P.pod[0]-3&&m.pod<=P.pod[1]+3)],
  ['Sólidos',f1(m.sol)+'%',st3(m.sol>=P.sol[0]&&m.sol<=P.sol[1],m.sol>=P.sol[0]-3&&m.sol<=P.sol[1]+3)],
  ['Emulsão',st.tipo==='sorbetto'?'sem gordura':f1(m.fat)+'% gordura',st.tipo==='sorbetto'?'ok':st3(m.fat>=P.fat[0]&&m.fat<=P.fat[1]&&!o.butter&&(m.fat<=8||m.hasEmul),!o.butter)],
  ['Ar incorporado',f0(m.ov)+'%',st3(m.ov>=P.ov[0]&&m.ov<=P.ov[1]&&bubbleStable,bubbleStable)],
  ['Rede estabilizante',m.hydro>.02?f2(m.hydro)+'%':'ausente',st3(m.hydro>=P.stab[0]&&!o.netExcess,m.hydro>0||st.tipo==='gastro')],
  ['Lactose',m.lac>0?f1(m.lacW)+'% da água':'sem lactose',st3(m.lacW<=9&&o.nLac===0,m.lacW<=10.5)]
 ];
 return o;
}

/* ===================== CREATOR — MODELO DA REDE DO NEUTRO ===================== */
const NSTYLE={lbg:{col:'#7dd3fc',seg:11,L:11,w:2},guar:{col:'#6ee7b7',seg:11,L:11,w:2,branch:1},tara:{col:'#5eead4',seg:9,L:11,w:2,branch:.5},xan:{col:'#f6c90e',seg:8,L:12,w:2.6,stiff:1},carr:{col:'#a78bfa',seg:5,L:10,w:1.6,helix:2},cmc:{col:'#f472b6',seg:8,L:11,w:2},pect:{col:'#fb923c',seg:6,L:10,w:2},citf:{col:'#a3e635',seg:6,L:9,w:1.4,fiber:1},gel:{col:'#fda4af',seg:7,L:10,w:1.4,helix:3},acacia:{col:'#e2e8f0',glob:1},inu:{col:'#cbd5e1',glob:1},lec:{col:'#fbbf24',surf:1},mono:{col:'#fbbf24',surf:1}};
function neutroModel(E,pastT){
 const b=analyzeBlend(E,E.dairy);const comps=[];
 for(const k in b.eff){const nc=NCOMP[k];if(!nc||!nc.dose)continue;const mid=(nc.dose[0]+nc.dose[1])/2;const load=b.eff[k]/mid;
  const n=NSTYLE[k]&&(NSTYLE[k].glob||NSTYLE[k].surf)?Math.round(clamp(load*5,0,14)):Math.round(clamp(load*3.2,0,9));
  if(n>0)comps.push({k,n,hydrated:pastT>=nc.hyd||nc.hyd<=20,load});}
 const has=k=>(b.eff[k]||0)>0;
 const galacto=has('lbg')||has('guar')||has('tara');
 const floc=E.dairy&&galacto&&!has('carr')&&!(has('citf')&&b.eff.citf>.1)&&!has('cmc');
 const hydFrac=comps.length?comps.filter(c=>c.hydrated).reduce((a,c)=>a+c.load,0)/comps.reduce((a,c)=>a+c.load,0):0;
 const bound=clamp(((b.P.visc+b.P.anti)/2/100)*hydFrac*1.05,0,.95);
 const excess=b.hydro>.7||(b.eff.xan||0)>.18;const weak=b.hydro<.15;
 const iceD=Math.round(18+(1-bound)*60);
 const unhyd=comps.filter(c=>!c.hydrated).map(c=>NCOMP[c.k].n);
 const warn=b.notes.filter(n=>n.sev==='warn').length;
 const inRange=NFUN.filter(([k])=>k!=='emul'&&k!=='siner').every(([k])=>b.P[k]>=50&&b.P[k]<=88);
 const perfect=!warn&&!floc&&!excess&&!weak&&!unhyd.length&&inRange;
 const st3=(ok,w)=>ok?'ok':w?'warn':'crit';
 const pills=[
  ['Água imobilizada',f0(bound*100)+'%',st3(bound>=.5&&bound<=.85,bound>=.35)],
  ['Cristais previstos','≈'+iceD+' µm',st3(iceD<=42,iceD<=SENS_D)],
  ['Hidrocoloides',f2(b.hydro)+'% da mistura',st3(!excess&&!weak,b.hydro>.1)],
  ['Hidratação',unhyd.length?'incompleta a '+pastT+' °C':'completa a '+pastT+' °C',st3(!unhyd.length,false)],
  ['Caseínas',E.dairy?(floc?'floculando':'dispersas'):'sem leite',E.dairy?st3(!floc,true):'ok'],
  ['Emulsificação','índice '+b.P.emul,st3(b.P.emul>=20||!E.dairy,true)]
 ];
 return{b,comps,floc,bound,excess,weak,iceD,unhyd,perfect,pills,hydFrac};
}

/* ===================== MOTOR DE PARTÍCULAS ===================== */

  this.ice.forEach(q=>{const dum=q.r*2*FIELD_UM/W;c.beginPath();for(let i=0;i<=8;i++){const k=i%8,a=q.rot+k/8*6.283,rr=q.r*q.pts[k];const x=q.x+Math.cos(a)*rr,y=q.y+Math.sin(a)*rr;i?c.lineTo(x,y):c.moveTo(x,y);}c.closePath();c.fillStyle='rgba(125,211,252,.12)';c.fill();c.strokeStyle=dum>SENS_D?COL.crit:dum>42?COL.warn:COL.ice;c.lineWidth=1.3;c.stroke();});
  /* água */
  this.wat.forEach(w=>{c.fillStyle=w.bound?'rgba(125,211,252,.85)':'rgba(125,211,252,.28)';c.fillRect(w.x-1.2,w.y-1.2,2.4,2.4);});
  /* micelas */
  this.mic.forEach(q=>{c.globalAlpha=q.a;c.fillStyle='rgba(240,236,228,.75)';c.beginPath();c.arc(q.x,q.y,4.2,0,7);c.fill();c.strokeStyle='rgba(255,255,255,.35)';c.stroke();});c.globalAlpha=1;
  /* cadeias */
  this.ch.forEach(ch=>{const st=NSTYLE[ch.k],n=ch.n;c.globalAlpha=ch.a*(ch.hyd?1:.55);c.strokeStyle=st.col;c.lineWidth=st.w;c.lineCap='round';
   const path=(off)=>{c.beginPath();n.forEach((q,i)=>{const ox=off?Math.sin(i*1.6+this.t*2+off)*2.6:0;i?c.lineTo(q.x+ox,q.y-ox):c.moveTo(q.x+ox,q.y-ox);});c.stroke();};
   if(st.helix){for(let h=0;h<st.helix;h++)path(h*2.1+.5);}else if(st.fiber){path(0);c.save();c.translate(0,3);path(0);c.restore();}else path(0);
   if(st.branch&&ch.hyd){c.lineWidth=1.2;for(let i=1;i<n.length-1;i+=st.branch>.7?2:3){const q=n[i],nx=n[i+1];const dx=nx.y-q.y,dy=q.x-nx.x,d=Math.hypot(dx,dy)||1;c.beginPath();c.moveTo(q.x,q.y);c.lineTo(q.x+dx/d*6,q.y+dy/d*6);c.stroke();}}
   if(!ch.hyd){c.fillStyle=st.col;c.beginPath();c.arc(n[0].x,n[0].y,2.5,0,7);c.fill();}
   if(ch.k==='carr'&&this.mic.length){const a=n[0],b=n[n.length-1];const near=q=>this.mic.reduce((m,o)=>Math.hypot(o.x-q.x,o.y-q.y)<Math.hypot(m.x-q.x,m.y-q.y)?o:m,this.mic[0]);[a,b].forEach(e=>{const mm=near(e);if(Math.hypot(mm.x-e.x,mm.y-e.y)<70){c.lineWidth=.8;c.setLineDash([2,3]);c.beginPath();c.moveTo(e.x,e.y);c.lineTo(mm.x,mm.y);c.stroke();c.setLineDash([]);e.x+=(mm.x-e.x)*.02;e.y+=(mm.y-e.y)*.02;}});}});
  c.globalAlpha=1;
  /* glóbulos (inulina, acácia) e tensoativos (gotas de gordura com caudas) */
  this.glob.forEach(q=>{const st=NSTYLE[q.k];c.globalAlpha=q.a;if(st.surf){c.fillStyle='rgba(246,201,14,.25)';c.beginPath();c.arc(q.x,q.y,7,0,7);c.fill();c.strokeStyle=st.col;c.lineWidth=1;for(let i=0;i<8;i++){const a=i/8*6.283+q.ph*.3;c.beginPath();c.moveTo(q.x+Math.cos(a)*7,q.y+Math.sin(a)*7);c.lineTo(q.x+Math.cos(a)*11,q.y+Math.sin(a)*11);c.stroke();}}
   else if(q.k==='acacia'){c.fillStyle='rgba(226,232,240,.55)';c.beginPath();c.arc(q.x,q.y,4.5,0,7);c.fill();c.strokeStyle='rgba(246,201,14,.6)';c.beginPath();c.arc(q.x,q.y,7,0,7);c.stroke();}
   else{c.fillStyle='rgba(203,213,225,.45)';for(let i=0;i<3;i++){c.beginPath();c.arc(q.x+Math.cos(i*2.1)*3,q.y+Math.sin(i*2.1)*3,2.6,0,7);c.fill();}}});
  c.globalAlpha=1;this.drawRings(c,this._dt||.016);
  const labs=[];if(p.floc&&this.mic[0])labs.push([this.mic[0].x,this.mic[0].y,'caseínas floculando · soro',COL.warn]);
  const un=this.ch.find(x=>!x.hyd&&!x.dying);if(un)labs.push([un.n[0].x,un.n[0].y,NCOMP[un.k].n+' sem hidratar',COL.warn]);
  if(p.excess&&this.ch[0])labs.push([this.ch[0].n[3]?this.ch[0].n[3].x:W/2,this.ch[0].n[3]?this.ch[0].n[3].y:H/2,'rede saturada · gomoso',COL.crit]);
  if(p.weak)labs.push([W*.5,H*.5,'rede fraca · água livre',COL.crit]);
  if(this.ice[0]&&p.iceD>45)labs.push([this.ice[0].x,this.ice[0].y,'cristal ≈'+p.iceD+' µm',COL.crit]);
  labs.slice(0,3).forEach(l=>this.label(c,...l));
  c.font='500 10.5px "DM Mono",ui-monospace,monospace';c.fillStyle='rgba(154,168,189,.9)';c.textAlign='right';c.fillText('fase não congelada · água ligada '+f0(p.bound*100)+'%',W-12,H-12);c.textAlign='left';
  this.frame(c,p.perfect,p.perfect?0:(p.excess||p.weak||p.floc?.8:.3));}
}

function pills(list){return`<div class="pills">${list.map(([n,v,s])=>`<div class="pill2 ${s}"><span class="dot"></span><span class="n">${n}</span><span class="v">${v}</span></div>`).join('')}</div>`;}
function seal(ok,title,sub){return ok?`<div class="seal"><svg width="34" height="34" viewBox="0 0 34 34" aria-hidden="true"><circle cx="17" cy="17" r="15" fill="none" stroke="var(--ok)" stroke-width="2"/><path d="M10 17.5l4.5 4.5L24 12" fill="none" stroke="var(--ok)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg><div><b>${title}</b><span>${sub}</span></div></div>`:'';}
function phaseMap(m,p){const P=m.P,W=300,H=190,L=34,R=10,T=10,B=26;const x0=50,x1=90,y0=P.sol[0]-8,y1=P.sol[1]+8;const sx=v=>L+(clamp(v,x0,x1)-x0)/(x1-x0)*(W-L-R),sy=v=>T+(1-(clamp(v,y0,y1)-y0)/(y1-y0))*(H-T-B);
 U.trail=U.trail||[];const last=U.trail[U.trail.length-1];if(!last||Math.abs(last[0]-m.fzVit)>.05||Math.abs(last[1]-m.sol)>.05){U.trail.push([m.fzVit,m.sol]);if(U.trail.length>10)U.trail.shift();}
 let g=`<rect x="${sx(P.fz[0])}" y="${sy(P.sol[1])}" width="${sx(P.fz[1])-sx(P.fz[0])}" height="${sy(P.sol[0])-sy(P.sol[1])}" fill="rgba(110,231,183,.14)" stroke="rgba(110,231,183,.5)" stroke-dasharray="3 3"/>`;
 for(let v=50;v<=90;v+=10)g+=`<text x="${sx(v)}" y="${H-8}" text-anchor="middle" fill="var(--t3)" font-size="9.5">${v}%</text>`;
 [y0,(y0+y1)/2,y1].forEach(v=>g+=`<text x="${L-5}" y="${sy(v)+3}" text-anchor="end" fill="var(--t3)" font-size="9.5">${f0(v)}</text>`);
 g+=`<polyline points="${U.trail.map(t=>sx(t[0])+','+sy(t[1])).join(' ')}" fill="none" stroke="var(--t3)" stroke-width="1" stroke-dasharray="2 2"/>`;
 U.trail.slice(0,-1).forEach((t,i)=>g+=`<circle cx="${sx(t[0])}" cy="${sy(t[1])}" r="2" fill="var(--t3)" opacity="${.3+i*.06}"/>`);
 const col=p.perfect?'var(--ok)':p.imbalance>.6?'var(--crit)':'var(--warn)';g+=`<circle cx="${sx(m.fzVit)}" cy="${sy(m.sol)}" r="6" fill="${col}"><animate attributeName="r" values="5;8;5" dur="1.6s" repeatCount="indefinite"/></circle>`;
 return`<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto" role="img" aria-label="Mapa de equilíbrio: água congelada × sólidos">${g}<text x="${W-R}" y="${T+10}" text-anchor="end" fill="var(--t3)" font-size="9.5">sólidos ↑ · congelada →</text></svg>`;}

 <div class="card flat"><p class="note" style="margin:0"><b style="color:var(--t2)">Como ler a simulação.</b> Cada goma aparece como cadeia com a forma real da molécula: jataí e guar longas e flexíveis (guar ramificada), xantana rígida, carragena em dupla hélice ligando caseínas, gelatina em tripla hélice, fibra de citros em feixes, inulina e acácia como glóbulos, lecitina e mono-diglicerídeos como tensoativos em gotas de gordura. A quantidade de cadeias segue a dose real na calda; abaixo da temperatura de hidratação elas ficam enoveladas. Os pontos azuis fortes são a água imobilizada pela rede; os fracos, água livre que vira gelo. Os cristais nos cantos crescem até o tamanho previsto.</p></div>`;}

/* ==== 60-store.js ==== */
/* ===================== IL FREDOLIN · ARMAZENAMENTO (aparelho + nuvem) =====================
   Cada coleção vive neste aparelho (localStorage) e, com a conta conectada, na nuvem.
   A nuvem é plugável: no artefato usa o banco privado do Claude; no aplicativo usa o Supabase da equipe.
   Conflitos: vence o registro com updatedAt mais recente. Exclusões viram "lápides" ({id, deleted, updatedAt})
   para que um item apagado num aparelho não ressuscite quando outro aparelho, ainda com a cópia antiga, sincronizar. */

const CFG=(()=>{const c=window.FREDOLIN_CONFIG||{},l=LS.get('fredolin_app_cfg')||{};return{url:String(c.url||l.url||'').trim().replace(/\/+$/,''),key:String(c.key||l.key||'').trim()};})();

 async req(method,path,body,opt={}){const auth=opt.auth!==false;if(auth)await this.ensureFresh();

  if(!r.ok){const raw=(d&&(d.msg||d.message||d.error_description||d.error_code||d.error))||('HTTP '+r.status);const x=new Error(trMsg(raw+' '+(d&&d.code||'')));x.status=r.status;x.raw=raw;throw x;}

/* ---------- custos separados: só o Maestro grava e recebe ---------- */
let FIN=LS.get(FINKEY)||{};
const FIN_FIELD={inv:[r=>r.costKg,(r,v)=>{if(v==null)delete r.costKg;else r.costKg=v;}],ings:[r=>r.x&&r.x.cost,(r,v)=>{r.x=r.x||{};if(v==null)delete r.x.cost;else r.x.cost=v;}],lib:[r=>r.st&&r.st.costs,(r,v)=>{if(!r.st)return;if(v==null)delete r.st.costs;else r.st.costs=v;}]};
function toRows(c,rec){const ts=rec.updatedAt||Date.now();if(rec.deleted)return[{col:c,id:String(rec.id),data:{},deleted:true,updated_at:ts}];
 const data=plain(rec);delete data.updatedAt;delete data._by;const rows=[];const f=FIN_FIELD[c];
 if(f){const v=f[0](data);f[1](data,null);if(ROLE==='maestro'&&v!=null&&v!==''&&!(typeof v==='object'&&!Object.keys(v).length))rows.push({col:'fin',id:c+':'+rec.id,data:{v},updated_at:ts});}

const SUPA_BACKEND={running:null,again:false,cursor:LS.get(CURKEY)||'1970-01-01T00:00:00.000Z',outbox:LS.get(OUTKEY)||[],lastOk:0,

 async start(){if(!SB.sess||!ME.ws)return false;const lib=loadLibrary();

  try{await this.flush();await this.pull();this.lastOk=Date.now();
   STORE.setStatus('cloud','Sincronizado com a equipe às '+new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})+'.');}
  catch(e){STORE.setStatus(e.offline?'offline':'error',e.offline?'Sem conexão: trabalhando neste aparelho'+(this.outbox.length?' · '+this.outbox.length+' alteração(ões) aguardando envio':'')+'.':'Falha ao sincronizar: '+e.message);}
  },
 async send(rows){return SB.req('POST','/rest/v1/records?on_conflict=workspace_id,col,id',rows.map(o=>({workspace_id:ME.ws,col:o.col,id:o.id,data:o.data,deleted:!!o.deleted,updated_at:o.updated_at})),{headers:{Prefer:'resolution=merge-duplicates,return=minimal'}});},

  for(;;){const rows=await SB.get('records?select=col,id,data,deleted,updated_at,updated_by,srv_at&workspace_id=eq.'+ME.ws+'&srv_at=gt.'+encodeURIComponent(since)+'&order=srv_at.asc,col.asc,id.asc&limit=1000&offset='+off);

 nxSave:()=>{const E=S.nxEdit;if(!Object.keys(E.parts).length)return;if(!E.id||!NXLIB.some(n=>n.id===E.id))E.id='nx_u'+Date.now();const rec={id:E.id,name:E.name||'Meu neutro',dose:+E.dose,parts:{...E.parts},src:'Meu neutro'};STORE.put('nx',rec);render();toast('Neutro salvo');},
 nxDel:()=>{STORE.del('nx',S.nxEdit.id);S.nxEdit.id=null;render();toast('Neutro excluído');},
 masterVar:v=>{const p=MASTERS[+v];addVariantGo(p.name,recFromPairs(p.recipe));},
 libVar:v=>{const l=LIB.find(x=>x.id==v);if(l)addVariantGo(l.name,l.st.recipe);},
 crTab:v=>{S.creatorTab=v;render();},crSub:v=>{S.crSub=v;render();},
 crAdd:v=>{const ex=S.recipe.find(r=>r.id===v);const g=ING_BY[v].cat==='Estabilizantes'||ING_BY[v].cat==='Meus neutros'?4:ING_BY[v].cat==='Bebidas e aromas'?5:50;if(ex)ex.g=Math.round((+ex.g+g)*10)/10;else S.recipe.push({id:v,g});U.cq='';U.bal=null;render();},
 crStep:v=>{const[id,d]=v.split('|');const r=S.recipe.find(x=>x.id===id);if(r){r.g=Math.max(0,Math.round((+r.g+ +d)*10)/10);U.bal=null;render();}},
 nxStep:v=>{const[k,d]=v.split('|');S.nxEdit.parts[k]=Math.max(0,(+S.nxEdit.parts[k]||0)+ +d);U.nxTest=null;render();},
 age:()=>{if(U.aging){clearInterval(agingT);U.aging=false;render();return;}U.aging=true;if((+U.days||0)>=14)U.days=0;agingT=setInterval(()=>{U.days=(+U.days||0)+1;if(U.days>=14){clearInterval(agingT);U.aging=false;}render();},550);render();},
 lotNew:()=>{const L=newLotFromBench();if(!L)return;saveLot(L);U.lotOpen=L.id;S.page='lotes';render();toast('Lote '+L.code+' registrado');},
 lotOpen:v=>{U.lotOpen=U.lotOpen===v?null:v;render();},
 lotSave:()=>{const L=LOTS.find(l=>l.id===U.lotOpen);if(L){saveLot(L);render();toast('Lote salvo · calibração atualizada');}},
 lotDel:()=>{STORE.del('lots',U.lotOpen);U.lotOpen=null;render();toast('Lote excluído');},
 lotBench:()=>{const L=LOTS.find(l=>l.id===U.lotOpen);if(!L)return;S.name=L.name;S.tipo=L.tipo;S.vit=L.vit;S.recipe=JSON.parse(JSON.stringify(L.recipe));S.page='bancada';render();},
 lotConsume:()=>{const L=LOTS.find(l=>l.id===U.lotOpen);if(!L)return;const miss=[];L.trace=L.trace||{};
  L.recipe.forEach(r=>{const used=INV.filter(e=>e.ingId===r.id&&+e.qty>0).sort((a,b)=>String(a.exp||'9999').localeCompare(String(b.exp||'9999')));const rest=consumeFIFO(INV,r.id,+r.g);if(used[0]&&!L.trace[r.id])L.trace[r.id]=used[0].lot||'';if(rest>.5)miss.push(ING_BY[r.id]?ING_BY[r.id].n:r.id);});
  INV.filter(e=>e._dirty).forEach(e=>{delete e._dirty;STORE.put('inv',e);});saveLot(L);render();toast(miss.length?'Baixado; faltou estoque de '+miss.length+' item(ns)':'Estoque baixado (FEFO)');},
 ingNew:()=>{U.ingEdit={id:null,n:'',c:{w:0},x:{cost:0,al:[]}};render();},
 ingDup:v=>{const i=ING_BY[v];U.ingEdit={id:null,n:i.n+' (meu)',c:JSON.parse(JSON.stringify(i.c)),x:{cost:i.cost||0,lab:i.lab||'',brix:i.brix,ph:i.ph,de:i.de,na:i.na,sat:i.sat,hfB:i.hfB,hfS:i.hfS,hfN:i.hfN,al:[...(i.al||[])],dairy:i.dairy,added:i.added,acid:i.acid,msnf:i.msnf,br:i.br}};render();$('#main').scrollTop=0;},
 ingEdit:v=>{const c=CUST.find(x=>x.id===v);if(c){U.ingEdit=JSON.parse(JSON.stringify(c));render();$('#main').scrollTop=0;}},
 ingCancel:()=>{U.ingEdit=null;render();},
 ingSave:()=>{const E=U.ingEdit;if(!E||!E.n.trim())return;if(!E.id)E.id='ui_'+Date.now();const clean={};for(const k in E.c)if(+E.c[k]>0)clean[k]=+E.c[k];E.c=clean;const x={};for(const k in E.x){const v=E.x[k];if(v===''||v==null)continue;x[k]=typeof v==='string'&&k!=='lab'&&k!=='br'&&!isNaN(+v)?+v:v;}E.x=x;
  STORE.put('ings',E);registerCustom(E);U.ingEdit=null;render();toast('Ingrediente salvo');},
 ingDel:v=>{STORE.del('ings',v);render();},
 vitT:v=>{S.vitrine.temp=clamp(Math.round((S.vitrine.temp+ +v)*2)/2,-24,-6);U.vitBal=null;saveVit();render();},
 vitBest:()=>{S.vitrine.temp=bestVitrineTemp(vitrineAnalysis(S.vitrine.items,S.vitrine.temp));saveVit();render();},
 vitRm:v=>{S.vitrine.items.splice(+v,1);U.vitBal=null;saveVit();render();},
 vitOpen:v=>{const it=S.vitrine.items[+v];loadRecipe(it.name,it.tipo,S.vitrine.temp,it.recipe);render();},
 vitHarm:v=>{const it=S.vitrine.items[+v];U.vitBal={i:+v,r:balance({tipo:it.tipo,vit:S.vitrine.temp,recipe:it.recipe,proc:S.proc,brix:{},costs:{}})};render();},
 vitApply:()=>{const b=U.vitBal;if(!b||!b.r.ok)return;S.vitrine.items[b.i].recipe=b.r.newRecipe;U.vitBal=null;saveVit();render();toast('Sabor harmonizado');},
 planAdd:()=>{S.plan.push({key:'cur',kg:2});render();},planRm:v=>{S.plan.splice(+v,1);render();},
 planCopy:()=>{const cap=+S.planCap||(MACH[S.proc.machine]||{}).batch||5000;const res=planNeeds(S.plan,p=>srcByKey(p.key),cap);const by=invRecompute(INV);const t=['IL FREDOLIN — LISTA DE COMPRAS',...Object.entries(res.need).map(([id,g])=>{const s=Math.max(0,g-((by[id]||{q:0}).q));return s>0?`[ ] ${(s/1000).toFixed(2)} kg  ${ING_BY[id]?ING_BY[id].n:id}`:null;}).filter(Boolean)].join('\n');
  try{navigator.clipboard.writeText(t).then(()=>toast('Lista copiada'),()=>{U.planCopy=t;render();});}catch(e){U.planCopy=t;render();}},
 invAdd:()=>{const N=U.invNew||{};if(!(+N.kg>0)||!N.ingId)return;const e={id:'E'+Date.now(),ingId:N.ingId,qty:+N.kg*1000,costKg:+N.costKg||0,lot:N.lot||'',exp:N.exp||'',date:today()};STORE.put('inv',e);U.invNew={ingId:N.ingId,kg:'',costKg:'',lot:'',exp:''};render();toast('Entrada registrada');},
 invDel:v=>{STORE.del('inv',v);render();},
 expJson:async()=>{const data=JSON.stringify({app:'Il Fredolin',v:12,date:today(),lib:LIB,exec:EXEC,lots:LOTS,ings:CUST,nx:NXLIB,inv:INV,vitrine:S.vitrine},null,1);await saveFile('il_fredolin_backup_'+today()+'.json',data);},
 expCsv:async()=>{const h=['lote','data','receita','overrun_prev','overrun_med','brix_prev','brix_med','derretimento_prev','derretimento_med','textura','pasteurizacao','resfriamento_min','maturacao_h'];const rows=LOTS.map(L=>{const me=L.meas||{};return[L.code,L.date,L.name,f1(L.pred.ov),measuredOverrun(me)!=null?f1(measuredOverrun(me)):'',f1(L.pred.brix),me.brix||'',f0(L.pred.melt10),me.melt10||'',me.tex!=null?me.tex:'',me.pastT||'',me.coolMin||'',me.matH||''].map(x=>'"'+String(x).replace(/"/g,'""')+'"').join(';');});await saveFile('il_fredolin_lotes_'+today()+'.csv','﻿'+[h.join(';'),...rows].join('\n'));},
 frz:v=>{S.proc.storeT=clamp(Math.round((+S.proc.storeT+ +v)*2)/2,-35,-8);if(S.proc.serveFrom==='freezer')S.vit=S.proc.storeT;U.bal=null;render();},
 vit:v=>{S.vit=clamp(Math.round((+S.vit+ +v)*2)/2,-35,-6);if(S.proc.serveFrom==='freezer')S.proc.storeT=S.vit;U.bal=null;render();},
 pick:v=>{U.sel=v;U.q=ING_BY[v].n;renderNow();const g=$('#addG');g&&g.focus();g&&g.select();},
 testRun:()=>{U.test=runTests({ui:true});render();},
 ...EXEC_ACT,
 ...TEAM_ACT
};

/* ---------- ENTRADAS (data-i, a cada tecla) ---------- */
/* número digitado → valor seguro: vazio/ inválido vira o padrão; fora da faixa vai para o limite */
const num=(v,lo,hi,dflt)=>v===''||v==null||!isFinite(+v)?dflt:clamp(+v,lo,hi);
const GEN_LIM={batch:[200,20000],fat:[0,30],msnf:[0,15],pod:[0,40],sol:[10,60],stabGkg:[0,30]};
const INP={
 name:v=>{S.name=v;render();},
 q:v=>{U.q=v;U.sel=null;render();},
 addG:v=>{U.addG=v;},scaleG:v=>{U.scaleG=v;},prodG:v=>{U.prodG=v;render();},
 g:(v,t)=>{const r=S.recipe.find(x=>x.id===t.dataset.id);if(r){r.g=num(v,0,1e5,0);U.bal=null;render();}},
 brix:(v,t)=>{if(v===''||!isFinite(+v))delete S.brix[t.dataset.id];else S.brix[t.dataset.id]=String(clamp(+v,1,85));render();},
 cost:(v,t)=>{if(v===''||!isFinite(+v))delete S.costs[t.dataset.id];else S.costs[t.dataset.id]=String(Math.max(0,+v));render();},
 proc:(v,t)=>{if(v===''||!isFinite(+v))return;const k=t.dataset.k,lim=PROC_LIM[k];S.proc[k]=lim?clamp(+v,lim[0],lim[1]):+v;if(k==='storeT'&&S.proc.serveFrom==='freezer')S.vit=S.proc.storeT;U.bal=null;render();},
 gen:(v,t)=>{if(v===''||!isFinite(+v))return;const k=t.dataset.k,lim=GEN_LIM[k];S.lab.gen[k]=lim?clamp(+v,lim[0],lim[1]):+v;U.gen=null;render();},
 genfg:(v,t)=>{S.lab.gen.fixed[+t.dataset.k].g=num(v,0,+S.lab.gen.batch||1000,0);U.gen=null;render();},
 varName:(v,t)=>{S.lab.variants[+t.dataset.k].name=v;render();},
 varG:(v,t)=>{const V=S.lab.variants[+t.dataset.k];const id=t.dataset.id;const g=num(v,0,1e5,0);const r=V.recipe.find(x=>x.id===id);if(r)r.g=g;else V.recipe.push({id,g});V.recipe=V.recipe.filter(x=>x.g>0||x.id===id);render();},
 sens:(v,t)=>{if(v===''||!isFinite(+v))return;const s=S.lab.sens,k=t.dataset.k;s[k]=k==='lo'?clamp(+v,-95,-1):clamp(+v,1,300);U.sens=null;render();},
 nxName:v=>{S.nxEdit.name=v;render();},
 nxDose:v=>{if(v===''||!isFinite(+v))return;S.nxEdit.dose=clamp(+v,0,50);U.nxTest=null;render();},
 nxG:(v,t)=>{S.nxEdit.parts[t.dataset.k]=num(v,0,1e4,0);U.nxTest=null;render();},
 libQ:v=>{U.libQ=v;U.libN=0;render();},
 cq:v=>{U.cq=v;render();},days:v=>{U.days=num(v,0,14,0);render();},
 lot:(v,t)=>{const L=LOTS.find(l=>l.id===U.lotOpen);if(!L)return;setPath(L,t.dataset.k,v===''?'':(t.type==='number'?+v:v));saveLotSoon(L);render();},
 lotTxt:v=>{const L=LOTS.find(l=>l.id===U.lotOpen);if(L){L.notes=v;saveLotSoon(L);}},
 ingQ:v=>{U.ingQ=v;render();},
 ing:(v,t)=>{const E=U.ingEdit;if(!E)return;const[p,k]=t.dataset.k.split('.');(p==='c'?E.c:E.x)[k]=v===''?'':(t.type==='number'?(p==='c'?num(v,0,100,0):num(v,-1e6,1e6,0)):v);render();},
 ingName:v=>{if(U.ingEdit){U.ingEdit.n=v;render();}},
 planCap:v=>{S.planCap=v===''?'':num(v,100,1e5,'');render();},planKg:(v,t)=>{S.plan[+t.dataset.k].kg=num(v,0,1e4,0);render();},
 invNew:(v,t)=>{U.invNew=U.invNew||{ingId:'leite',kg:'',costKg:'',lot:'',exp:''};U.invNew[t.dataset.k]=v;},
 ...TEAM_INP
};

/* ---------- MUDANÇAS (data-c, selects/checkboxes/arquivo) ---------- */
const CHG={
 tipo:t=>{S.tipo=t.value;U.bal=null;},
 proc:t=>{const k=t.dataset.k;S.proc[k]=t.value;if(k==='pastHoldU'&&t.value==='min'&&S.proc.pastHold>60)S.proc.pastHold=30;},
 gen:t=>{const k=t.dataset.k;S.lab.gen[k]=t.value;if(k==='tipo')Object.assign(S.lab.gen,GEN_DEF[t.value]);U.gen=null;},
 genfx:t=>{S.lab.gen.fixed[+t.dataset.k].id=t.value;U.gen=null;},
 varNew:t=>{if(!t.value)return false;S.lab.variants.forEach(V=>{if(!V.recipe.some(r=>r.id===t.value))V.recipe.push({id:t.value,g:0});});},
 sens:t=>{S.lab.sens.id=t.value;U.sens=null;},
 nxDairy:t=>{S.nxEdit.dairy=t.value==='1';},
 nxAdd:t=>{if(!t.value)return false;S.nxEdit.parts[t.value]=10;U.nxTest=null;},
 calOn:t=>{CAL.on=t.checked;CAL.ver++;LS.set(K10.cal,{on:CAL.on});},
 lot:t=>{const L=LOTS.find(l=>l.id===U.lotOpen);if(L){setPath(L,t.dataset.k,t.value===''?'':+t.value);saveLotSoon(L);}},
 ingCat:t=>{U.ingCat=t.value;},
 ingAl:t=>{if(!U.ingEdit)return false;const a=U.ingEdit.x.al=U.ingEdit.x.al||[];const k=t.dataset.k;if(t.checked&&!a.includes(k))a.push(k);if(!t.checked)U.ingEdit.x.al=a.filter(x=>x!==k);},
 ingFlag:t=>{if(!U.ingEdit)return false;U.ingEdit.x[t.dataset.k]=t.checked?1:0;},
 vitAdd:t=>{if(!t.value)return false;const s=srcByKey(t.value);if(s){S.vitrine.items.push({name:s.name.replace(/^Receita da bancada · /,''),tipo:s.tipo,recipe:JSON.parse(JSON.stringify(s.recipe))});saveVit();}},
 planSrc:t=>{S.plan[+t.dataset.k].key=t.value;},
 invNew:t=>{U.invNew=U.invNew||{kg:'',costKg:'',lot:'',exp:''};U.invNew.ingId=t.value;},
 ...TEAM_CHG
};
function importBackup(file){const fr=new FileReader();fr.onload=()=>{try{const d=JSON.parse(fr.result);[['lib',d.lib],['exec',d.exec],['lots',d.lots],['ings',d.ings],['nx',d.nx],['inv',d.inv]].forEach(([c2,arr])=>(arr||[]).forEach(r=>STORE.put(c2,r)));if(d.vitrine){S.vitrine=d.vitrine;saveVit();}render();toast('Backup importado');}catch(err){toast('Arquivo inválido');}};fr.readAsText(file);}

/* ---------- EVENTOS: um ouvinte por tipo ---------- */
/* toda ação passa pela checagem do perfil (o servidor também recusa o que o perfil não pode) */
const denied=()=>toast('Seu perfil não tem acesso a esta função.');
document.addEventListener('click',e=>{const t=e.target.closest('[data-a]');if(!t)return;e.preventDefault();const k=t.dataset.a;if(!ACT[k])return;if(!can.act(k))return denied();ACT[k](t.dataset.v,t);});
document.addEventListener('input',e=>{const t=e.target;if(!t.dataset||!t.dataset.i||!INP[t.dataset.i])return;if(!can.inp(t.dataset.i,t))return denied();INP[t.dataset.i](t.value,t);});
document.addEventListener('change',e=>{const t=e.target;if(t.id==='impFile'&&t.files&&t.files[0]){if(!can.cost())return denied();importBackup(t.files[0]);return;}
 const c=t.dataset&&t.dataset.c;if(!c||!CHG[c])return;if(!can.chg(c))return denied();if(CHG[c](t)!==false)render();});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.dataset&&e.target.dataset.i==='auth'){e.preventDefault();ACT.authGo();return;}if(e.key==='Enter'&&e.target.id==='q'){e.preventDefault();addSel();}if(e.key==='Enter'&&e.target.id==='addG'){e.preventDefault();addSel();}if(e.key==='Enter'&&e.target.id==='scaleG'){e.preventDefault();ACT.scale();}});

/* ---------- BOOT ---------- */
if(APP_MODE==='app')AUTH.boot();else{renderNow();STORE.init();}

</script>
