<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Il Fredolin</title>
<meta name="description" content="Laboratório de gelato artesanal da equipe Il Fredolin">
<meta name="theme-color" content="#080c14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Il Fredolin">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/favicon-64.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&family=Syne:wght@600;700;800&display=swap">
<style>
/* Laboratório escuro de gelateria: barra lateral de instrumentos à esquerda (no celular, abas no topo), bancada à direita. */
:root{
  --bg:#080c14; --surf:#0e1420; --raise:#141c2b; --hov:#1a2437; --line:#1e2a3f; --line2:#2b3c58;
  --ice:#7dd3fc; --ice2:#38a0d4; --ice-a:rgba(125,211,252,.12);
  --gold:#f6c90e; --ok:#6ee7b7; --warn:#fbbf24; --crit:#fb7185; --info:#a78bfa;
  --ok-a:rgba(110,231,183,.1); --warn-a:rgba(251,191,36,.1); --crit-a:rgba(251,113,133,.1); --info-a:rgba(167,139,250,.1);
  --t1:#e6ecf4; --t2:#9aa8bd; --t3:#5d6c85;
  --fd:'Syne',system-ui,sans-serif; --fb:'DM Sans',system-ui,-apple-system,sans-serif; --fm:'DM Mono',ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--t1);font:14px/1.5 var(--fb);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ice);outline-offset:2px}
.app{display:grid;grid-template-columns:232px minmax(0,1fr);grid-template-rows:auto minmax(0,1fr);height:100%}
header{grid-column:1/-1;display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;padding:10px 18px;background:var(--surf);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:9px;min-width:0}
.hex{width:24px;height:24px;flex:none;background:linear-gradient(135deg,var(--ice),var(--info));clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%)}
.brand b{font:800 17px/1 var(--fd);letter-spacing:-.01em}.brand b span{color:var(--ice)}
.brand small{display:block;font:500 9px/1.2 var(--fm);color:var(--t3);letter-spacing:.16em;text-transform:uppercase;margin-top:3px}
.hctl{display:flex;flex-wrap:wrap;align-items:center;gap:8px;flex:1;justify-content:flex-end;min-width:0}
.field{display:flex;flex-direction:column;gap:3px;min-width:0}
.lbl{font:500 9.5px/1.2 var(--fm);color:var(--t3);letter-spacing:.1em;text-transform:uppercase}
input[type=text],input[type=number],input[type=date],select,textarea{background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:7px 9px;min-width:0;width:100%}
input[type=number]{font-family:var(--fm);font-variant-numeric:tabular-nums}
input:focus,select:focus,textarea:focus{border-color:var(--ice2);outline:none}
#nm{width:190px;font-weight:600}
.vit{display:flex;align-items:center;gap:6px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:3px}
.vit button{width:28px;height:28px;border:0;border-radius:6px;background:var(--raise);cursor:pointer;color:var(--ice);font-size:16px}
.vit button:hover{background:var(--hov)}
.vit output{font:600 15px/1 var(--fm);color:var(--ice);min-width:66px;text-align:center}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:99px;font:500 11px/1.3 var(--fm);border:1px solid var(--line2);background:var(--raise);white-space:nowrap}
.chip.ok{color:var(--ok);border-color:rgba(110,231,183,.35);background:var(--ok-a)}
.chip.warn{color:var(--warn);border-color:rgba(251,191,36,.35);background:var(--warn-a)}
.chip.crit{color:var(--crit);border-color:rgba(251,113,133,.35);background:var(--crit-a)}
.chip.info{color:var(--info);border-color:rgba(167,139,250,.35);background:var(--info-a)}
nav{background:var(--surf);border-right:1px solid var(--line);overflow-y:auto;padding:10px 0}
nav .grp{font:500 9px/1 var(--fm);color:var(--t3);letter-spacing:.16em;text-transform:uppercase;padding:14px 18px 6px}
nav button{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;border:0;background:none;padding:8px 18px;color:var(--t2);cursor:pointer;text-align:left;border-left:2px solid transparent;font-size:13px}
nav button:hover{background:var(--raise);color:var(--t1)}
nav button[aria-current=page]{background:var(--raise);color:var(--ice);border-left-color:var(--ice)}
nav .cnt{display:flex;gap:4px}
nav .cnt i{font:500 10px/1 var(--fm);font-style:normal;padding:3px 6px;border-radius:99px}
nav .cnt .c{background:var(--crit-a);color:var(--crit)}nav .cnt .w{background:var(--warn-a);color:var(--warn)}
main{overflow-y:auto;padding:18px 22px 40px;min-width:0}
.pg{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
h1{font:700 22px/1.2 var(--fd);margin:0;letter-spacing:-.01em;text-wrap:balance}
h2{font:600 11px/1.2 var(--fm);color:var(--t2);letter-spacing:.12em;text-transform:uppercase;margin:0 0 12px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
h2::before{content:"";width:3px;height:12px;border-radius:2px;background:var(--ice)}
h3{font:600 14px/1.3 var(--fb);margin:0}
.lead{color:var(--t2);margin:4px 0 0;max-width:72ch}
.card{background:var(--raise);border:1px solid var(--line);border-radius:12px;padding:16px;min-width:0}
.card.flat{background:var(--surf)}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.tiles{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px}
.tile{background:var(--surf);border:1px solid var(--line);border-radius:10px;padding:11px 12px;display:flex;flex-direction:column;gap:5px;min-width:0}
.tile .v{font:700 22px/1 var(--fd);font-variant-numeric:tabular-nums}
.tile .v small{font:500 11px var(--fm);color:var(--t3);margin-left:2px}
.tile .t{font:500 10px/1.3 var(--fm);color:var(--t3)}
.rb{position:relative;height:6px;border-radius:3px;background:var(--bg);overflow:hidden}
.rb .band{position:absolute;top:0;bottom:0;background:rgba(110,231,183,.22)}
.rb .pin{position:absolute;top:-2px;width:3px;height:10px;border-radius:2px;margin-left:-1.5px}
.tbl{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.tbl th{font:500 9.5px/1.2 var(--fm);color:var(--t3);letter-spacing:.08em;text-transform:uppercase;text-align:left;padding:7px 8px;border-bottom:1px solid var(--line)}
.tbl td{padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl .r{text-align:right}.tbl .mono{font-family:var(--fm)}
.tw{overflow-x:auto;margin:0 -4px;padding:0 4px}
.tbl input[type=number]{width:92px;padding:5px 7px}
.muted{color:var(--t3)}.t2{color:var(--t2)}
.c-ok{color:var(--ok)}.c-warn{color:var(--warn)}.c-crit{color:var(--crit)}.c-info{color:var(--info)}.c-ice{color:var(--ice)}.c-gold{color:var(--gold)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:8px 13px;border-radius:8px;border:1px solid var(--line2);background:var(--surf);color:var(--t1);cursor:pointer;font-weight:500;font-size:13px;white-space:nowrap}
.btn:hover{background:var(--hov)}
.btn.pri{background:var(--ice-a);border-color:rgba(125,211,252,.4);color:var(--ice)}
.btn.okb{background:var(--ok-a);border-color:rgba(110,231,183,.4);color:var(--ok)}
.btn.del{background:var(--crit-a);border-color:rgba(251,113,133,.35);color:var(--crit);padding:5px 9px}
.btn.sm{padding:5px 9px;font-size:12px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.sp{flex:1}
.search{position:relative;flex:1;min-width:200px}
.res{position:absolute;z-index:20;left:0;right:0;top:calc(100% + 4px);background:var(--surf);border:1px solid var(--line2);border-radius:10px;max-height:300px;overflow-y:auto;box-shadow:0 12px 28px rgba(0,0,0,.5)}
.res button{display:flex;justify-content:space-between;gap:10px;width:100%;padding:9px 12px;border:0;background:none;color:var(--t1);cursor:pointer;text-align:left;border-bottom:1px solid var(--line)}
.res button:hover,.res button:focus{background:var(--hov)}
.tag{font:500 9.5px/1.4 var(--fm);color:var(--t3);background:var(--bg);border-radius:4px;padding:2px 6px;white-space:nowrap}
.find{display:grid;grid-template-columns:4px minmax(0,1fr);gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.find:last-child{border-bottom:0}
.find .bar{border-radius:2px}
.find .area{font:500 9.5px/1 var(--fm);letter-spacing:.1em;text-transform:uppercase;color:var(--t3)}
.find h3{margin:4px 0 3px}
.find p{margin:0;color:var(--t2);max-width:80ch}
.find .fix{margin-top:7px;padding:8px 10px;border-radius:8px;background:var(--surf);border:1px solid var(--line);color:var(--t1)}
.find .fix b{color:var(--ice);font:500 10px var(--fm);letter-spacing:.08em;text-transform:uppercase;margin-right:6px}
.bar.crit{background:var(--crit)}.bar.warn{background:var(--warn)}.bar.info{background:var(--info)}.bar.ok{background:var(--ok)}
.kv{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
.kv:last-child{border-bottom:0}.kv span:first-child{color:var(--t2)}.kv span:last-child{font-family:var(--fm);text-align:right}
.big{font:800 34px/1 var(--fd);font-variant-numeric:tabular-nums}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{border:1px solid var(--line2);background:var(--surf);color:var(--t2);border-radius:99px;padding:7px 12px;cursor:pointer;font-size:13px}
.chips button[aria-pressed=true]{background:var(--ice-a);border-color:rgba(125,211,252,.5);color:var(--ice)}
.form{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
.form .hint{font-size:11.5px;color:var(--t3);line-height:1.4}
.check{display:flex;align-items:center;gap:14px;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--surf);cursor:pointer;width:100%;text-align:left;color:var(--t1)}
.check .box{width:22px;height:22px;border:2px solid var(--line2);border-radius:5px;flex:none;display:grid;place-items:center}
.check[aria-pressed=true]{opacity:.5}.check[aria-pressed=true] .box{background:var(--ok);border-color:var(--ok);color:var(--bg)}
.check .w{margin-left:auto;font:600 18px/1 var(--fm);color:var(--ice);font-variant-numeric:tabular-nums}
.steps{counter-reset:s;display:flex;flex-direction:column;gap:8px;margin:0;padding:0;list-style:none}
.steps li{counter-increment:s;display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px}
.steps li::before{content:counter(s);width:24px;height:24px;border-radius:50%;background:var(--ice-a);color:var(--ice);display:grid;place-items:center;font:500 11px var(--fm)}
.lupa{display:inline-flex;flex-direction:column;border:2px solid #fff;background:#000;color:#fff;font:800 12px/1.15 var(--fb);text-transform:uppercase;min-width:150px}
.lupa .h{display:flex;align-items:center;gap:6px;padding:5px 8px;border-bottom:2px solid #fff;font-size:10px}
.lupa .i{padding:5px 8px;border-bottom:1px solid #fff}.lupa .i:last-child{border-bottom:0}
.nut{background:#fff;color:#111;border:2px solid #111;border-radius:2px;padding:10px;max-width:460px;font-family:Arial,Helvetica,sans-serif}
.nut table{width:100%;border-collapse:collapse;font-size:12px}
.nut th,.nut td{border-bottom:1px solid #111;padding:3px 4px;text-align:right}
.nut th:first-child,.nut td:first-child{text-align:left}
.nut .in{padding-left:14px}
.nut caption{font-weight:800;font-size:15px;text-align:left;padding-bottom:4px;border-bottom:4px solid #111}
.al{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.al div{border:1px solid var(--line);border-radius:8px;padding:8px 4px;text-align:center;font-size:11px;color:var(--t3);background:var(--surf)}
.al div.on{border-color:rgba(251,113,133,.55);color:var(--crit);background:var(--crit-a);font-weight:600}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--surf);border:1px solid var(--ok);color:var(--ok);padding:9px 16px;border-radius:99px;font-size:13px;z-index:50}
.crgrid{display:grid;grid-template-columns:minmax(280px,360px) minmax(0,1fr);gap:14px;align-items:start}
.crleft{position:sticky;top:0}
.crcenter{display:flex;flex-direction:column;gap:14px;min-width:0}
.crlist{display:flex;flex-direction:column;gap:6px;max-height:520px;overflow-y:auto;margin:0 -4px;padding:0 4px}
.crrow{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:8px;align-items:center;padding:7px 8px;border:1px solid var(--line);border-radius:9px;background:var(--surf)}
.crrow .nm{font-weight:500;font-size:13px;min-width:0;line-height:1.3}.crrow .nm small{display:block;font-weight:400;font-size:11px;color:var(--t3)}
.crrow .sw{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:6px;vertical-align:1px}
.stp{display:flex;align-items:center;border:1px solid var(--line2);border-radius:8px;overflow:hidden}
.stp button{width:28px;height:30px;border:0;background:var(--raise);color:var(--ice);cursor:pointer;font-size:15px}
.stp button:hover{background:var(--hov)}
.stp input[type=number]{width:66px;border:0;border-radius:0;text-align:center;padding:5px 2px;background:var(--bg)}
.simhost{width:100%;line-height:0;background:#070b13}
.simcv{display:block;width:100%;height:340px}
.simbar{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:10px 14px;border-top:1px solid var(--line);background:var(--surf)}
.simbar input[type=range]{flex:1;min-width:120px;accent-color:var(--ice)}
.pills{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.pill2{display:grid;grid-template-columns:10px minmax(0,1fr);column-gap:8px;padding:8px 10px;border:1px solid var(--line);border-radius:9px;background:var(--surf)}
.pill2 .dot{grid-row:1/3;width:8px;height:8px;border-radius:50%;margin-top:5px}
.pill2 .n{font-size:12px;color:var(--t2)}.pill2 .v{font:500 12px var(--fm);color:var(--t1)}
.pill2.ok .dot{background:var(--ok);box-shadow:0 0 8px var(--ok)}.pill2.warn .dot{background:var(--warn)}.pill2.crit .dot{background:var(--crit);box-shadow:0 0 8px var(--crit)}
.pill2.crit{border-color:rgba(251,113,133,.35)}.pill2.warn{border-color:rgba(251,191,36,.3)}
.seal{display:flex;align-items:center;gap:12px;padding:10px 12px;margin-bottom:12px;border:1px solid rgba(110,231,183,.45);border-radius:10px;background:var(--ok-a)}
.seal b{display:block;color:var(--ok);font:700 14px var(--fd)}.seal span{font-size:12.5px;color:var(--t2)}
@media (max-width:980px){.crgrid{grid-template-columns:minmax(0,1fr)}.crleft{position:static}.crcenter{order:-1}}
svg text{font-family:var(--fm)}
.note{font-size:12px;color:var(--t3);max-width:80ch}
@media (max-width:1100px){.tiles{grid-template-columns:repeat(3,minmax(0,1fr))}.g3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr);grid-template-rows:auto auto minmax(0,1fr)}
  header{padding:10px 16px}
  header{flex-direction:column;align-items:stretch}
  .hctl{justify-content:flex-start;width:100%;flex:none}
  .hctl .field:not(.nmf){flex:1 1 auto}
  #nm{width:100%}
  .hctl .field.nmf{flex:1 1 100%}
  nav{display:flex;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line);padding:0 8px;gap:2px;scrollbar-width:none}
  nav::-webkit-scrollbar{display:none}
  nav .grp{display:none}
  nav button{width:auto;flex:none;border-left:0;border-bottom:2px solid transparent;padding:11px 10px;white-space:nowrap}
  nav button[aria-current=page]{border-bottom-color:var(--ice);background:none}
  main{padding:14px 16px 40px}
  .g2,.g3{grid-template-columns:minmax(0,1fr)}
  .tiles{grid-template-columns:repeat(2,minmax(0,1fr))}
  .al{grid-template-columns:repeat(4,minmax(0,1fr))}
}
@media (prefers-reduced-motion:no-preference){.pg{animation:fi .18s ease}@keyframes fi{from{opacity:.4;transform:translateY(3px)}to{opacity:1;transform:none}}}
/* ---------- aplicativo da equipe: entrada, aprovação, perfis ---------- */
output.ro{display:block;padding:7px 0;font-weight:600;color:var(--t1);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btn.wide{width:100%;padding:11px 14px;font-size:14px;margin-top:6px}
.btn.ghost{background:transparent;border-color:transparent;color:var(--t2)}
.card.approve{border-color:rgba(110,231,183,.3);background:linear-gradient(180deg,rgba(110,231,183,.05),transparent)}
.card.exec h3 .chip{vertical-align:2px;margin-left:4px}
body.auth .app{grid-template-columns:minmax(0,1fr)}body.auth #nav{display:none}
.authbox{max-width:400px;margin:6vh auto 40px;padding:28px 24px;background:var(--surf);border:1px solid var(--line);border-radius:16px;display:flex;flex-direction:column;gap:10px}
.authbox h1{margin:4px 0 0}.authbox .lead{margin:0}.authbox .field{width:100%}
.authhex{width:44px;height:44px;background:linear-gradient(135deg,var(--ice),var(--info));clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%)}
.autherr{color:var(--crit);background:var(--crit-a);padding:8px 10px;border-radius:8px;margin:0;font-size:13px}
.authmsg{color:var(--ok);background:var(--ok-a);padding:8px 10px;border-radius:8px;margin:0;font-size:13px}
.authtabs{margin:2px 0 4px}
.roles .card h3{margin:0 0 4px}
.member select{width:auto}
/* iPhone: campos com 16px não dão zoom ao tocar; respeita o entalhe quando aberto como app */
@media (max-width:860px){input,select,textarea{font-size:16px}}
@supports (padding:env(safe-area-inset-top)){.app{padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}}
</style>
</head>
<body>
<div class="app">
  <header id="hdr"></header>
  <nav id="nav" aria-label="Módulos"></nav>
  <main id="main"></main>
</div>
<div id="toast" class="toast" hidden></div>
<script src="config.js"></script>
<script>
/* ==== 01-util.js ==== */
/* ===================== IL FREDOLIN · UTILITÁRIOS ===================== */
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function rangeScore(v,r,tol){if(!r)return 1;const[lo,hi]=r;if(v>=lo&&v<=hi)return 1;const d=v<lo?lo-v:v-hi;return Math.max(0,1-d/tol);}
/* números em pt-BR; "-0" e "-0,0" (arredondamento de valores minúsculos negativos) viram zero */
const nz=(v,d)=>{const k=Math.pow(10,d),r=Math.round(+v*k)/k;return r===0?0:r;};
const f0=v=>nz(v,0).toLocaleString('pt-BR'),f1=v=>nz(v,1).toLocaleString('pt-BR',{minimumFractionDigits:1,maximumFractionDigits:1}),f2=v=>nz(v,2).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
/* rampas 0→1 usadas pelo diagnóstico de defeitos */
const hi=(v,a,b)=>v<=a?0:v>=b?1:(v-a)/(b-a),lo=(v,a,b)=>v>=a?0:v<=b?1:(a-v)/(a-b);
/* gramas sugeridas: nunca "0 g" */
const gq=x=>x<1?'menos de 1':f0(x);
/* temperatura em texto corrido: −14,5 / −13 (sem ',0') */
const fT=v=>f1(v).replace(/,0$/,'');

/* ==== 10-data.js ==== */
/* ===================== IL FREDOLIN · DADOS ===================== */
/* Composição por 100 g. Campos de massa (somam ~100):
   w água · fat gordura · prot proteína · lac lactose · ash minerais · suc sacarose · glu glicose/dextrose

 if(m.fzDraw<35){ci-=22;cn.push('pouca água congelada na saída');}else if(m.fzDraw<45){ci-=10;cn.push('saída da mantecadora um pouco quente');}
 if(pr.drawMin>15){ci-=8;cn.push('mantecação longa');}
 if(pr.blastT>-25){ci-=15;cn.push('abatedor pouco frio');}if(pr.hardMin>90){ci-=10;cn.push('abatimento lento');}
 if(m.hydro<P.stab[0]*.6&&!(m.sol>=P.sol[1]))	{ci-=10;cn.push('pouco estabilizante');}
 if(m.sol<P.sol[0]){ci-=Math.min(15,(P.sol[0]-m.sol)*3);cn.push('sólidos baixos');}
 const shock=Math.abs(pr.storeT-vit);if(shock>6){ci-=Math.min(12,(shock-6)*2);cn.push('choque térmico armazenamento↔vitrine');}
 m.ci=Math.round(clamp(ci,0,100));m.ciNotes=cn;m.crystal=Math.round(28+(100-m.ci)*.6);
 /* derretimento */
 let mr=50;mr+=m.hydro>=P.stab[0]?15:-10;mr+=m.hasEmul?8:0;mr+=clamp((m.ov-20)*.6,-8,10);mr+=clamp((m.sol-34)*1.5,-10,10);mr-=clamp((m.fzMid-m.fzVit)*1.5,-10,15);
 m.melt=clamp(mr,0,100);
 /* nutrição por 100 g */
 const n={};n.fat=pc(A.fat);n.sat=pc(A.sat);n.trans=pc(A.tr);n.prot=pc(A.prot);
 n.sug=pc(A.suc+A.glu+A.fru+A.lac+A.tre+A.iso+A.gsSug);n.alu=pc(A.alu);n.add=pc(A.addSug);
 n.pol=pc(A.ery+A.sor+A.xyl+A.mlt+A.gly);n.fib=pc(A.fib+A.inu+A.fos);
 n.carb=pc(A.suc+A.glu+A.fru+A.lac+A.gs+A.tre+A.alu+A.iso+A.ery+A.sor+A.xyl+A.mlt+A.gly+A.oth+A.acd);
 n.na=(A.na+A.salt*393)/T*100;
 n.kcal=(4*(A.prot+A.suc+A.glu+A.fru+A.lac+A.gs+A.tre+A.iso+A.oth)+.4*A.alu+9*A.fat+2.4*(A.sor+A.xyl+A.mlt+A.gly)+2*(A.fib+A.inu+A.fos)+7*A.alc+3*A.acd)/T*100;
 n.kj=n.kcal*4.184;n.lacMg=pc(A.lac)*1000;m.nut=n;
 chemistry(m,st);
 m.costKg=A.tot?A.cost/A.tot*1000:0;m.costL=m.costKg*m.gPerL/1000;m.costPortion=m.costKg*(pr.portion||90)/1000;
 return m;
}

/* análise com memória: a chave inclui a versão do banco de ingredientes, da calibração e do estoque */
const _MEMO=new Map();
function analyze(st){let key;try{key=JSON.stringify([st.tipo,st.vit,st.recipe,st.proc,st.brix,st.costs,CAL.on?CAL.ver:-1,ING_VER,INVVER]);}catch(e){return analyzeRaw(st);}
 const hit=_MEMO.get(key);if(hit)return hit;const m=analyzeRaw(st);_MEMO.set(key,m);if(_MEMO.size>400)_MEMO.delete(_MEMO.keys().next().value);return m;}

/* ---------- CALIBRAÇÃO PELA PRODUÇÃO ---------- */
function calOv(machine){return (CAL.on&&CAL.ov[machine])?CAL.ov[machine]:0;}
/* ajuste bayesiano simples: média dos resíduos encolhida em direção a zero (prior de 3 lotes) */
function fitCalibration(lots){
 const prev=CAL.on;CAL.on=false;const ovR={},fzR=[],mR=[],kR=[];const res=[];
 (lots||[]).forEach(L=>{if(!L.recipe||!L.recipe.length)return;const st={tipo:L.tipo,vit:L.meas&&L.meas.texTemp!=null&&L.meas.texTemp!==''?+L.meas.texTemp:L.vit,recipe:L.recipe,proc:L.proc||{},brix:L.brix||{},costs:{}};const m=analyzeRaw(st);const me=L.meas||{};const r={id:L.id,code:L.code};
  const ov=measuredOverrun(me);if(ov!=null){const mc=(L.proc&&L.proc.machine)||'horiz';(ovR[mc]=ovR[mc]||[]).push(ov-m.ovModel);r.ov=[m.ovModel,ov];}
  if(me.tex!=null&&me.tex!==''){const tt=st.vit;const pred=(frozenPct(tt,m.SE,m.S)-m.fzMid)/3.5;fzR.push(-.8*(+me.tex-pred));r.tex=[Math.round(pred*10)/10,+me.tex];}
  if(me.melt10!=null&&me.melt10!==''){const pm=meltModel(m);mR.push(+me.melt10-pm);r.melt=[pm,+me.melt10];}
  if(me.icyDay!=null&&me.icyDay!==''&&+me.icyDay>0){const K=kinetics(m,st).Kvit;const implied=(Math.pow(50,3)-Math.pow(m.crystal,3))/(+me.icyDay);if(implied>0)kR.push(Math.log(implied/K));r.icy=+me.icyDay;}
  if(me.brix!=null&&me.brix!=='')r.brix=[m.brixMix,+me.brix];
  res.push(r);});
 const shrink=(a,k=3)=>a.length?a.reduce((x,y)=>x+y,0)/(a.length+k):0;
 CAL.ov={};for(const mc in ovR)CAL.ov[mc]=Math.round(shrink(ovR[mc])*10)/10;
 CAL.tShift=Math.round(shrink(fzR)*100)/100;CAL.meltBias=Math.round(shrink(mR)*10)/10;CAL.kMult=Math.exp(shrink(kR,2));
 CAL.n=res.length;CAL.res=res;CAL.counts={ov:Object.values(ovR).reduce((a,b)=>a+b.length,0),tex:fzR.length,melt:mR.length,icy:kR.length};CAL.on=prev;CAL.ver++;return CAL;}
function measuredOverrun(me){if(me.ov!=null&&me.ov!=='')return +me.ov;if(+me.cupMix>0&&+me.cupGel>0)return(+me.cupMix-+me.cupGel)/(+me.cupGel)*100;return null;}

/* ---------- QUÍMICA: pH, Tg′, cinética, sensorial ---------- */
/* doçura percebida cai ~2,5% por grau abaixo de −12 °C (e sobe acima); limitada a 0,5–1,2 fora da faixa medida */
const podTempFactor=T=>clamp(1+.025*(T+12),.5,1.2);
function chemistry(m,st){const A=m.A,T=A.tot||1;
 /* Tg' da fase concentrada (média ponderada dos solutos; proteínas e gomas ≈ −10 °C) */
 let sw=0,sx=0;for(const k in TGP){const g=A[k]||0;sw+=g;sx+=g*TGP[k];}
 if(A.gs>0){m.A.lines.forEach(l=>{if(l.c.gs){const de=l.ing.de||20;const g=l.g*l.c.gs/100;sw+=g;sx+=g*(-6-.55*de);}});}
 const pg=A.prot+A.stab;sw+=pg*.4;sx+=pg*.4*-10;m.tg=sw?sx/sw:-32;
 m.dTgVit=m.vit-m.tg;m.dTgStore=m.pr.storeT-m.tg;
 /* pH: fonte ácida dominante diluída × tampão das proteínas do leite */
 let dom=null;m.A.lines.forEach(l=>{if(l.ing.ph!=null&&(l.c.acd||0)>0){const ag=l.g*l.c.acd/100;if(!dom||ag>dom.ag)dom={ag,l};}});
 const base=m.msnf>.5?6.65:m.A.cocoaG>0?6.4:6.8;let ph=base;
 if(dom){const wf=dom.l.g*(dom.l.c.w||0)/100;const phAcid=dom.l.ing.ph+.5*Math.log10(Math.max(1,(A.w||1)/Math.max(1,wf)));
  const meq=A.acd*12,beta=.45*A.msnf+.05*A.fruitG+.3*(A.prot-A.msnf*.38>0?A.prot-A.msnf*.38:0);
  const phBuf=beta>0?base-meq/beta:-99;ph=m.msnf>.5?Math.max(phAcid,Math.min(base,phBuf)):phAcid;ph=Math.min(base,ph);}
 m.ph=ph;m.ta=A.acd/T*100;
 /* sensorial */
 m.podPerc=m.pod*podTempFactor(m.vit);
 m.aroma=clamp(100-Math.max(0,m.fat-6)*4-Math.max(0,m.hydro-.3)*45-Math.max(0,m.ov-30)*.4-Math.max(0,m.prot-4.5)*3,0,100);
 m.melt10=clamp(meltModel(m)+(CAL.on?CAL.meltBias:0),3,95);
 const k=kinetics(m,st);m.kin=k;m.d0=m.crystal;
 /* freezer: dureza ao retirar e aclimatação (cuba de 5 L, ≈6 min por °C de diferença) */
 m.temperMin=m.pr.serveFrom==='freezer'?0:Math.max(0,(m.vit-m.pr.storeT))*6;
 m.storeHard=m.fzStore>84?'muito duro':m.fzStore>78?'firme':m.fzStore>=m.P.fz[0]?'espatulável':'mole';
 m.shelfVit=m.crystal>=50?0:(Math.pow(50,3)-Math.pow(m.crystal,3))/k.Kvit;m.shelfStore=m.crystal>=50?0:(Math.pow(50,3)-Math.pow(m.crystal,3))/k.Kstore;
}

/* ---------- LAUDO ---------- */
function findInRecipe(st,ids){for(const id of ids){const r=(st.recipe||[]).find(x=>x.id===id&&+x.g>0);if(r)return r;}return null;}

/* laudo e índice ficam guardados no próprio resultado da análise (que já é memorizado pelo conteúdo da receita) */
function diagnose(st,m){return m._F||(m._F=Object.freeze(diagnoseCore(st,m)));}
function diagnoseCore(st,m){
 const F=[],P=m.P,pr=m.pr,T=m.tot;
 const add=(sev,area,title,why,fix)=>F.push({sev,area,title,why,fix});
 if(m.empty)return F;
 /* ---- 1. Equilíbrio térmico ---- */
 const dz=m.fzVit-m.fzMid;
 if(m.wat<20){add('crit','Térmico','Receita com pouca água','Com '+f1(m.wat)+'% de água a mistura não forma estrutura de gelato.','Adicione a base líquida (leite, água ou polpa) antes de avaliar o restante.');}
 else if(Math.abs(dz)<=3){add('ok','Térmico','Equilíbrio de congelamento correto','A '+fT(m.vit)+' °C, '+f0(m.fzVit)+'% da água está congelada (alvo '+P.fz[0]+'–'+P.fz[1]+'%). Textura espatulável, que se serve com bola ou espátula sem quebrar.','');}
 else{
  const hard=dz>0;const dAbs=m.dPacAbs;
  /* PAC é g×coeficiente/100: trocar 1 g de sacarose (100) por dextrose anidra (≈189) soma 0,89; acrescentar 1 g de dextrose soma 1,89;
     trocar 1 g de sacarose por maltodextrina DE 19 (≈36) tira 0,64. */
  const gfmt=x=>x<1?'menos de 1':f0(Math.max(1,x));
  const swapDex=Math.abs(dAbs)/.89, addDex=Math.abs(dAbs)/1.89, swapMalto=Math.abs(dAbs)/.64;
  const suc=findInRecipe(st,['sacarose']),dex=findInRecipe(st,['dextrose','dextrosem']);
  let fix;
  if(hard){const sg=suc?+suc.g:0;let swapTxt;
   if(sg>=swapDex)swapTxt='troque '+gfmt(swapDex)+' g de sacarose por dextrose anidra (mantém os sólidos, reduz um pouco a doçura)';
   else if(sg>0){const rest=(Math.abs(dAbs)-sg*.89)/1.89;swapTxt='troque toda a sacarose ('+f0(sg)+' g) por dextrose anidra e acrescente mais '+gfmt(rest)+' g de dextrose';}
   else swapTxt='não há sacarose para trocar';
   fix='Faltam ≈ '+f0(Math.abs(m.dPacKg))+' de PAC por kg ('+f0(Math.abs(dAbs))+' no lote de '+f0(T)+' g). Opções: '+swapTxt+'; ou acrescente '+gfmt(addDex)+' g de dextrose (sobe sólidos e doçura). Para servir sem mexer na receita, use a vitrine a '+f1(m.serveT)+' °C.';}
  else{const dg=dex?+dex.g:0;let swapTxt;
   if(dg>=swapDex)swapTxt='troque '+gfmt(swapDex)+' g de dextrose por sacarose';
   else if(dg>0){const rest=(Math.abs(dAbs)-dg*.89)/.64;swapTxt=rest<=(suc?+suc.g:0)+dg?'troque toda a dextrose ('+f0(dg)+' g) por sacarose e mais '+gfmt(rest)+' g de sacarose por maltodextrina DE 19':'nem trocando toda a dextrose ('+f0(dg)+' g) e toda a sacarose por maltodextrina o excesso some: reduza os açúcares ou a parte que mais baixa o congelamento (álcool, sal, frutose)';}
   else swapTxt='não há dextrose para trocar';
   fix='Sobram ≈ '+f0(Math.abs(m.dPacKg))+' de PAC por kg ('+f0(Math.abs(dAbs))+' no lote de '+f0(T)+' g). Opções: '+swapTxt+'; ou troque '+gfmt(swapMalto)+' g de sacarose por maltodextrina DE 19 (mantém sólidos e corpo, reduz doçura). Ou sirva mais frio: '+f1(m.serveT)+' °C.';}
  /* ações estruturadas: cada opção é uma lista de [ingrediente, Δg] aplicável pelo botão "Aplicar" e verificada pela bateria de testes */
  const acts=[];const r1=x=>Math.round(x*10)/10;
  if(hard){const sg=suc?+suc.g:0,sid=suc?suc.id:'sacarose',did=dex?dex.id:'dextrose';
   if(sg>=swapDex)acts.push({t:'Trocar '+gfmt(swapDex)+' g de sacarose por dextrose',ops:[[sid,-r1(swapDex)],[did,r1(swapDex)]]});
   else if(sg>0){const rest=(Math.abs(dAbs)-sg*.89)/1.89;acts.push({t:'Trocar toda a sacarose por dextrose (+'+gfmt(rest)+' g)',ops:[[sid,-sg],[did,r1(sg+rest)]]});}
   acts.push({t:'Acrescentar '+gfmt(addDex)+' g de dextrose',ops:[[did,r1(addDex)]]});}
  else{const dg=dex?+dex.g:0,sid=suc?suc.id:'sacarose';
   if(dg>=swapDex)acts.push({t:'Trocar '+gfmt(swapDex)+' g de dextrose por sacarose',ops:[[dex.id,-r1(swapDex)],[sid,r1(swapDex)]]});
   else if(dg>0&&(Math.abs(dAbs)-dg*.89)/.64<=(suc?+suc.g:0)+dg){const rest=(Math.abs(dAbs)-dg*.89)/.64;acts.push({t:'Trocar a dextrose por sacarose e '+gfmt(rest)+' g de sacarose por maltodextrina',ops:[[dex.id,-dg],[sid,r1(dg-rest)],['malto',r1(rest)]]});}
   if(suc&&+suc.g>=swapMalto)acts.push({t:'Trocar '+gfmt(swapMalto)+' g de sacarose por maltodextrina',ops:[[suc.id,-r1(swapMalto)],['malto',r1(swapMalto)]]});}
  if(m.alc>2&&!hard)fix+=' O álcool ('+f1(m.alc)+'%) é o principal responsável — reduza a dose ou adicione no momento de servir.';
  add(Math.abs(dz)>8?'crit':'warn','Térmico',hard?'Gelato duro na vitrine':'Gelato mole na vitrine','A '+fT(m.vit)+' °C, '+f1(m.fzVit)+'% da água congela (alvo '+P.fz[0]+'–'+P.fz[1]+'%). '+(hard?'Fica duro, difícil de espatular, e o sabor aparece menos.':'Escorre na espátula, perde forma e derrete rápido na casquinha.'),fix);F[F.length-1].acts=acts;
 }
 if(m.hfKg>25){add(m.hfKg>110?'warn':'info','Térmico','Fator de dureza (HF) de '+f0(m.hfKg)+' por kg','Manteiga de cacau, sólidos de cacau e gordura de oleaginosas endurecem o gelato além do que o PAC indica. O motor já desconta esse efeito: PAC efetivo '+f0(m.pacEffKg)+' por kg.','Compense com açúcares de PAC alto (dextrose, invertido) — o cálculo térmico acima já inclui o HF.');}
 /* ---- 2. Doçura ---- */
 if(m.pod<P.pod[0]-.5)add(m.pod<P.pod[0]-3?'warn':'info','Doçura','Doçura baixa (POD '+f1(m.pod)+'%)','Abaixo do alvo de '+P.pod[0]+'–'+P.pod[1]+'%. O frio reduz a percepção de doce; o sabor fica apagado.','Troque parte da dextrose por sacarose ou adicione um pouco de sacarose; o balanceador calcula a combinação exata sem desequilibrar o congelamento.');
 else if(m.pod>P.pod[1]+.5)add(m.pod>P.pod[1]+3?'warn':'info','Doçura','Doçura alta (POD '+f1(m.pod)+'%)','Acima do alvo de '+P.pod[0]+'–'+P.pod[1]+'%. Doçura em excesso cansa o paladar e mascara o ingrediente principal.','Substitua parte da sacarose por dextrose (menos doce, mesmo efeito anticongelante) ou por maltodextrina DE 19 (quase sem doçura). Use o balanceador.');
 else add('ok','Doçura','Doçura no ponto (POD '+f1(m.pod)+'%)','Dentro de '+P.pod[0]+'–'+P.pod[1]+'% para '+P.n.toLowerCase()+'.','');
 if(m.dexShare>45)add('warn','Doçura','Dextrose domina os açúcares ('+f0(m.dexShare)+'%)','Muita dextrose deixa o gelato pegajoso, com doçura curta e textura que "afunda" na vitrine.','Mantenha a dextrose abaixo de ~35% dos açúcares; complete o PAC com açúcar invertido ou trealose.');
 if(m.fruShare>25)add('warn','Doçura','Frutose acima de 25% dos açúcares','A frutose tem doçura forte e PAC alto; em excesso o gelato fica mole e com doçura enjoativa.','Troque parte da frutose por sacarose.');
 /* ---- 3. Sólidos ---- */
 if(m.sol<P.sol[0])add(m.sol<P.sol[0]-4?'crit':'warn','Sólidos','Sólidos totais baixos ('+f1(m.sol)+'%)','Alvo '+P.sol[0]+'–'+P.sol[1]+'%. Água livre em excesso forma cristais grandes: textura gelada e granulosa.',st.tipo==='sorbetto'?'Aumente a fruta, troque parte da água por polpa ou adicione '+gq((P.sol[0]-m.sol)/100*T*1.1)+' g de maltodextrina/inulina.':'Adicione '+gq((P.sol[0]-m.sol)/100*T*1.08)+' g de leite em pó desnatado (se a lactose permitir) ou maltodextrina DE 19.');
 else if(m.sol>P.sol[1])add(m.sol>P.sol[1]+3?'crit':'warn','Sólidos','Sólidos totais altos ('+f1(m.sol)+'%)','Alvo '+P.sol[0]+'–'+P.sol[1]+'%. Fica pesado, pastoso, gruda no palato e pode cristalizar lactose.','Substitua '+gq((m.sol-P.sol[1])/100*T*1.1)+' g de sólidos (pó, açúcar ou pasta) por líquido da base.');
 else add('ok','Sólidos','Sólidos totais equilibrados ('+f1(m.sol)+'%)','Na faixa '+P.sol[0]+'–'+P.sol[1]+'%: corpo, cremosidade e cristais pequenos.','');
 /* ---- 4. Estrutura ---- */
 if(st.tipo!=='sorbetto'){
  if(m.fat<P.fat[0])add('warn','Estrutura','Gordura baixa ('+f1(m.fat)+'%)','Alvo '+P.fat[0]+'–'+P.fat[1]+'%. Menos gordura = menos cremosidade, menos corpo e derretimento aquoso.',st.tipo==='vegan'?'Use creme de coco ou pasta de oleaginosa.':'Troque '+gq((P.fat[0]+.5-m.fat)/100*T/.315)+' g de leite integral por creme 35%.');
  else if(m.fat>P.fat[1])add(m.fat>P.fat[1]+3?'crit':'warn','Estrutura','Gordura alta ('+f1(m.fat)+'%)','Alvo '+P.fat[0]+'–'+P.fat[1]+'%. Excesso de gordura mascara o sabor, satura o paladar e pode amanteigar na mantecação.','Troque '+gq((m.fat-P.fat[1]+.5)/100*T/.315)+' g de creme 35% por leite integral'+(m.hasEmul?'':', e use emulsificante (gema ou lecitina) para estabilizar a emulsão')+'.');
  else add('ok','Estrutura','Gordura adequada ('+f1(m.fat)+'%)','Dentro de '+P.fat[0]+'–'+P.fat[1]+'%.','');
  if(m.prot<P.prot[0]-.3)add('info','Estrutura','Proteína baixa ('+f1(m.prot)+'%)','As proteínas seguram ar e água; abaixo de '+P.prot[0]+'% o gelato fica com menos corpo e menor overrun.',st.tipo==='vegan'?'Adicione 1–2% de proteína de ervilha ou use bebida de soja.':'Adicione leite em pó desnatado ou WPC 80.');
  if(m.prot>P.prot[1]+1)add('warn','Estrutura','Proteína alta ('+f1(m.prot)+'%)','Excesso de proteína deixa textura borrachuda e sabor de leite cozido.','Reduza leite em pó / WPC.');
 }else{
  if(m.fat>1)add('info','Estrutura','Gordura em sorbetto ('+f1(m.fat)+'%)','Vem da fruta ou de oleaginosas; tudo bem se for intencional.','');
  if(m.msnf>.5)add('warn','Ingredientes','Lácteos em sorbetto','Há '+f1(m.msnf)+'% de sólidos lácteos: o produto deixa de ser sorbetto e passa a declarar leite.','Mude o tipo para Frutta ou remova os lácteos.');
 }
 /* ---- 5. Lactose / arenosidade ---- */
 if(m.lac>0){
  if(m.lacW>10.5)add('crit','Lactose','Risco alto de arenosidade (lactose '+f1(m.lacW)+'% da água)','Acima de ~10% a lactose supersatura na água não congelada e cristaliza com o tempo: grãos que não derretem na língua.','Reduza '+f0((m.lacW-9)/100*m.A.w/.525)+' g de leite em pó desnatado e substitua por maltodextrina DE 19 ou proteína do soro WPC.');
  else if(m.lacW>9)add('warn','Lactose','Lactose no limite ('+f1(m.lacW)+'% da água)','Entre 9 e 10,5% o risco aparece em armazenamento longo ou com variações de temperatura.','Produza para venda em até 3 dias ou reduza um pouco o leite em pó.');
  else add('ok','Lactose','Lactose segura ('+f1(m.lacW)+'% da água)','Abaixo de 9%: sem risco de arenosidade.','');
  if(st.tipo==='crema'||st.tipo==='frutta'||st.tipo==='gastro'){
   if(m.msnf<P.msnf[0])add('info','Lactose','MSNF baixo ('+f1(m.msnf)+'%)','Alvo '+P.msnf[0]+'–'+P.msnf[1]+'%. Os sólidos do leite dão corpo e sabor lácteo.',m.lacW<8?'Adicione '+gq((P.msnf[0]-m.msnf)/100*T/.94)+' g de leite em pó desnatado.':'A lactose já está alta; aumente MSNF com WPC 80.');
   else if(m.msnf>P.msnf[1])add('warn','Lactose','MSNF alto ('+f1(m.msnf)+'%)','Acima de '+P.msnf[1]+'% o sabor fica de leite em pó e o risco de arenosidade cresce.','Reduza o leite em pó.');
  }
 }
 if(st.tipo==='vegan'&&m.A.al.has('leite'))add('crit','Ingredientes','Ingrediente de origem láctea em receita vegana','A receita contém leite ou derivado.','Remova os lácteos ou mude o tipo.');
 if(st.tipo==='vegan'&&m.A.animal)add('crit','Ingredientes','Gelatina animal em receita vegana','O estabilizante contém gelatina.','Troque por um neutro vegetal (jataí, guar, tara, fibra de citros).');
 if(st.tipo==='vegan'&&m.A.al.has('ovo'))add('crit','Ingredientes','Ovo em receita vegana','','Remova ovos.');
 /* ---- 6. Estabilização ---- */
 const kp=m.keyPct;const hasStab=m.hydro>.02||kp.starch>.3;

 if(m.fat>11&&pr.drawMin>12)add('warn','Processo','Risco de amanteigar','Gordura alta com mantecação longa forma grumos de manteiga.','Reduza o tempo ou a gordura.');

 if(m.mach.batch&&T>m.mach.batch)add('warn','Processo','Lote acima da capacidade da máquina','A '+m.mach.n+' processa até '+m.mach.batch+' g por ciclo; o lote tem '+f0(T)+' g.','Divida em '+Math.ceil(T/m.mach.batch)+' ciclos ou escale o lote para '+m.mach.batch+' g.');

 if(m.dTgStore>16)add('warn','Processo','Armazenamento longe da transição vítrea','Tg′ da mistura '+f1(m.tg)+' °C; a '+fT(m.pr.storeT)+' °C a fase concentrada está '+f0(m.dTgStore)+' °C acima: recristalização mais rápida (cinética WLF).','Armazene mais frio (−22/−25 °C) ou aumente açúcares de Tg′ alto (sacarose, maltodextrina) em relação a frutose/polióis.');

}
function score(st,m,F){if(F===m._F)return m._sc||(m._sc=scoreCore(st,m,F));return scoreCore(st,m,F);}
function scoreCore(st,m,F){
 if(m.empty)return{total:0,parts:[]};const P=m.P;
 const parts=[
  ['Congelamento',22,rangeScore(m.fzVit,P.fz,10)],
  ['Doçura',12,rangeScore(m.pod,P.pod,5)],
  ['Sólidos',14,rangeScore(m.sol,P.sol,6)],
  ['Estrutura',10,st.tipo==='sorbetto'?rangeScore(m.fat,P.fat,3):(rangeScore(m.fat,P.fat,4)*.6+rangeScore(m.prot,P.prot,2.5)*.4)],
  ['Lactose',12,m.lac>0?clamp(1-(m.lacW-9)/3,0,1):1],
  ['Estabilização',10,(m.hydro>.02||m.keyPct.starch>.3)?rangeScore(m.hydro,P.stab,P.stab[1]):.3],
  ['Processo',12,m.ci/100*.6+clamp(1-Math.max(0,4-m.pr.matH)/4,0,1)*.4],
  ['Segurança',8,F.some(f=>f.sev==='crit'&&f.area==='Segurança')?0:1]
 ];
 let t=parts.reduce((s,p)=>s+p[1]*p[2],0);
 const crit=F.filter(f=>f.sev==='crit').length;if(crit)t=Math.min(t,62-crit*4);
 return{total:Math.round(clamp(t,0,100)),parts};
}

/* ===================== BALANCEADOR DE AÇÚCARES =====================
   Resolve sacarose (S), dextrose (D) e maltodextrina DE19 (M) para atingir ao mesmo tempo:
   congelamento-alvo na vitrine, POD-alvo e sólidos-alvo. Sistema linear 3×3 iterado. */
function solve3(a,b){const d=x=>x[0][0]*(x[1][1]*x[2][2]-x[1][2]*x[2][1])-x[0][1]*(x[1][0]*x[2][2]-x[1][2]*x[2][0])+x[0][2]*(x[1][0]*x[2][1]-x[1][1]*x[2][0]);
 const D=d(a);if(Math.abs(D)<1e-9)return null;return[0,1,2].map(i=>{const c=a.map((r,k)=>r.map((v,j)=>j===i?b[k]:v));return d(c)/D;});}
function solve2(a,b){const D=a[0][0]*a[1][1]-a[0][1]*a[1][0];if(Math.abs(D)<1e-9)return null;return[(b[0]*a[1][1]-a[0][1]*b[1])/D,(a[0][0]*b[1]-b[0]*a[1][0])/D];}
function balance(st){
 const P=PROF[st.tipo];if(!P||st.tipo==='gastro'||st.tipo==='semacucar')return{ok:false,msg:'O balanceador automático trabalha com açúcares convencionais (crema, frutta, sorbetto e vegano).'};
 const dexId=(st.recipe||[]).some(r=>r.id==='dextrosem')?'dextrosem':'dextrose';
 const ctrl=['sacarose',dexId,'malto'];
 const rest={...st,recipe:(st.recipe||[]).filter(r=>!ctrl.includes(r.id))};
 const m0=analyze(rest);if(m0.empty)return{ok:false,msg:'Adicione a base da receita primeiro.'};
 const dx=ING_BY[dexId].c,mx=ING_BY.malto.c;
 const pS=99.9,pD=dx.glu*1.9,pM=mx.gs*1.9*19/100;
 const oS=99.9,oD=dx.glu*.7,oM=mx.gs*.9*19/100;
 const sS=.999,sD=dx.glu/100,sM=mx.gs/100,wD=dx.w/100,wM=mx.w/100;
 const R=m0.A.tot,W0=m0.A.w,PAC0=m0.A.pac-m0.hfAbs,POD0=m0.A.pod,SOL0=R-W0-m0.A.alc;
 const mc=analyze(st),Pp=mc.P;const podT=(Pp.pod[0]+Pp.pod[1])/2/100,solT=clamp(mc.sol,Pp.sol[0]+.5,Pp.sol[1]-.5)/100,fzT=(Pp.fz[0]+Pp.fz[1])/2;
 let x=[0,0,0],mode='3';
 let S=m0.S;
 for(let it=0;it<6;it++){
  const se=seRequired(+st.vit,fzT,S)/100;
  // PAC: pS S + pD D + pM M - se*(wD D + wM M) = se*W0 - PAC0   (pac por 100 g de ingrediente → /100)
  const r1=[pS/100,pD/100-se*wD,pM/100-se*wM],b1=se*W0-PAC0;
  const r2=[oS/100-podT,oD/100-podT,oM/100-podT],b2=podT*R-POD0;
  const r3=[sS-solT,sD-solT,sM-solT],b3=solT*R-SOL0;
  let s=solve3([r1,r2,r3],[b1,b2,b3]);mode='3';
  if(!s||s.some(v=>v<-.5)){const t=solve2([r1.slice(0,2),r2.slice(0,2)],[b1,b2]);s=t?[t[0],t[1],0]:null;mode='2';}
  if(!s||s.some(v=>v<-.5)){const t=solve2([r1.slice(0,2),r3.slice(0,2)],[b1,b3]);s=t?[t[0],t[1],0]:null;mode='2s';}
  if(!s||s.some(v=>v<-.5))return{ok:false,msg:'Não há combinação de sacarose, dextrose e maltodextrina que atinja os três alvos com a base atual. Ajuste primeiro a base (água, gordura, sólidos) ou a temperatura da vitrine.'};
  x=s.map(v=>Math.max(0,v));
  const W=W0+wD*x[1]+wM*x[2],ms=(m0.A.msnf)/(R+x[0]+x[1]+x[2])*100,wp=W/(R+x[0]+x[1]+x[2])*100;S=wp>0?2.37*ms/wp:0;
 }
 const prop=[{id:'sacarose',g:x[0]},{id:dexId,g:x[1]},{id:'malto',g:x[2]}];
 const cur=ctrl.map(id=>{const r=(st.recipe||[]).find(q=>q.id===id);return r?+r.g:0;});
 const newRecipe=(st.recipe||[]).filter(r=>!ctrl.includes(r.id)).concat(prop.filter(p=>p.g>=.5).map(p=>({id:p.id,g:Math.round(p.g*10)/10})));
 const m1=analyze({...st,recipe:newRecipe});
 return{ok:true,mode,prop,cur,ctrl,newRecipe,m1};
}

/* ---------- NEUTROS, GERADOR E SENSIBILIDADE ---------- */
function blendShares(parts){const t=Object.values(parts).reduce((a,b)=>a+(+b||0),0)||1;const o={};for(const k in parts)if(+parts[k]>0)o[k]=+parts[k]/t*100;return o;}
function blendIngredient(nx){const sh=blendShares(nx.parts);const c={};let cost=0,animal=0;const parts={};
 for(const k in sh){const nc=NCOMP[k];if(!nc)continue;for(const f in nc.c)c[f]=(c[f]||0)+nc.c[f]*sh[k]/100;cost+=nc.cost*sh[k]/100;if(nc.animal)animal=1;if(nc.dose&&k!=='inu')parts[k]=sh[k]*(nc.c.stab||nc.c.emul||nc.c.fib||100)/100;}
 return I(nx.id,'Neutro · '+nx.name,'Meus neutros',c,{parts,key:'blend',de:19,animal,cost:Math.round(cost),lab:'estabilizantes ('+Object.keys(sh).map(k=>NCOMP[k]?NCOMP[k].n.toLowerCase():k).join(', ')+')',blend:nx});}
/* registra/atualiza um neutro como ingrediente; ING_VER invalida a memória de cálculo */
function registerNeutro(nx){const ing=blendIngredient(nx);const i=ING.findIndex(x=>x.id===ing.id);if(i>=0)ING[i]=ing;else ING.push(ing);ING_BY[ing.id]=ing;ING_VER++;return ing;}
NEUTRO_PRESETS.forEach(registerNeutro);

/* análise de um blend na dose (g por kg de mistura), opcionalmente dentro de uma receita */
function analyzeBlend(nx,dairy){
 const sh=blendShares(nx.parts),dose=(+nx.dose||0)/10; // % da mistura
 const eff={},prof={};NFUN.forEach(([k])=>prof[k]=0);let hyd=20,hydro=0,cost=0;const notes=[];
 for(const k in sh){const nc=NCOMP[k];if(!nc)continue;const e=sh[k]/100*dose;eff[k]=e;cost+=nc.cost*sh[k]/100;
  if(nc.c.stab)hydro+=e*nc.c.stab/100;if(sh[k]>=1)hyd=Math.max(hyd,nc.hyd);
  if(nc.dose){const mid=(nc.dose[0]+nc.dose[1])/2,load=e/mid;for(const f in nc.f)prof[f]+=load*nc.f[f];}}
 const P={};NFUN.forEach(([k])=>P[k]=Math.round(prof[k]>0?100*(1-Math.exp(-prof[k]/8)):0));
 const has=k=>(eff[k]||0)>0;const pr=k=>NCOMP[k]&&NCOMP[k].dose;
 for(const k in eff){const r=pr(k);if(!r)continue;const e=eff[k];
  if(e>r[1]*1.15)notes.push({sev:'warn',t:NCOMP[k].n+' acima da dose ('+f2(e)+'% da mistura; faixa '+r[0]+'–'+r[1]+'%)',fix:k==='xan'?'Xantana em excesso dá textura elástica e gomosa.':k==='inu'?'Inulina acima de 4% causa desconforto intestinal.':'Reduza a proporção no blend ou a dose.'});
  else if(e<r[0]*.5&&k!=='acacia'&&k!=='inu')notes.push({sev:'info',t:NCOMP[k].n+' em dose quase simbólica ('+f2(e)+'%)',fix:'Abaixo de '+r[0]+'% o efeito isolado é pequeno; faz sentido apenas como sinergia.'});}
 if(hydro<.15)notes.push({sev:'warn',t:'Hidrocoloides totais baixos ('+f2(hydro)+'% da mistura)',fix:'Gelato artesanal costuma usar 0,2–0,5%. Aumente a dose ou a proporção de gomas.'});
 else if(hydro>.7)notes.push({sev:'warn',t:'Hidrocoloides totais altos ('+f2(hydro)+'%)',fix:'Acima de ~0,6% a textura fica pesada e gomosa e o sabor abafado.'});
 else notes.push({sev:'ok',t:'Hidrocoloides totais na faixa ('+f2(hydro)+'% da mistura)',fix:''});
 if(dairy&&(has('lbg')||has('guar')||has('tara'))&&!has('carr'))notes.push({sev:has('citf')||has('cmc')?'info':'warn',t:'Galactomananas sem carragena em base láctea',fix:'Jataí, guar e tara competem com as caseínas e podem separar soro na mistura maturada. Adicione carragena a 0,01–0,02% da mistura (≈'+f1(dose>0?.015/dose*100:0)+'% do blend).'+(has('citf')||has('cmc')?' A fibra de citros/CMC já reduz esse risco.':'')});
 if(has('lbg')&&has('xan'))notes.push({sev:'info',t:'Sinergia jataí + xantana',fix:'Juntas formam gel elástico: ótimo para segurar o derretimento, mas mantenha a xantana baixa para não ficar "puxa-puxa".'});
 if(has('lbg')&&has('guar'))notes.push({sev:'ok',t:'Jataí + guar: dupla clássica',fix:'O guar dá viscosidade a frio e a jataí controla os cristais após 85 °C.'});
 if(has('tara')&&has('lbg'))notes.push({sev:'ok',t:'Tara complementa a jataí',fix:'Tara tem comportamento intermediário entre guar e jataí e hidrata parcialmente a frio.'});
 if(has('gel'))notes.push({sev:'info',t:'Contém gelatina animal',fix:'Não serve para receitas veganas; hidrate acima de 60 °C.'});
 if(has('inu')&&sh.inu>40)notes.push({sev:'info',t:'Blend com base de inulina ('+f0(sh.inu)+'%)',fix:'A inulina funciona como veículo funcional: dá corpo, conta como fibra e adiciona PAC/POD baixos. A dose do neutro precisa ser alta ('+f0(nx.dose)+' g/kg) para as gomas chegarem à faixa.'});
 if(has('acacia'))notes.push({sev:'ok',t:'Goma acácia como emulsificante natural',fix:'Baixa viscosidade; ajuda a manter gordura e aromas dispersos e retarda cristais de açúcar.'});
 if(hyd>=80)notes.push({sev:'info',t:'Exige pasteurização a '+hyd+' °C ou mais',fix:'Abaixo disso os componentes de hidratação a quente trabalham parcialmente.'});
 else notes.push({sev:'ok',t:'Hidrata a frio',fix:'Pode ser usado em bases a frio (frutas cruas), com mistura em alta rotação.'});
 if(!has('lec')&&!has('mono')&&!has('acacia')&&dairy)notes.push({sev:'info',t:'Sem emulsificante no blend',fix:'Em bases com 8%+ de gordura, emulsificantes deixam a textura mais seca e o derretimento mais lento (ou use gema na receita).'});
 return{sh,eff,P,hyd,hydro,dose,notes,costKg:cost,costPerKgMix:cost*nx.dose/1000};
}
/* troca o estabilizante da receita pelo blend na dose indicada */
function withBlend(st,ingId,doseGkg){const isStab=r=>{const i=ING_BY[r.id];return i&&(i.cat==='Estabilizantes'||i.cat==='Meus neutros')&&i.key!=='starch';};
 const base=(st.recipe||[]).filter(r=>!isStab(r));const tot=base.reduce((a,r)=>a+(+r.g||0),0);const g=Math.round(tot*doseGkg/(1000-doseGkg)*10)/10;
 return{...st,recipe:base.concat([{id:ingId,g}])};}

/* ===================== GERADOR POR ALVO (LAB) =====================
   Resolve a base para atingir massa, gordura, MSNF, doçura, congelamento e sólidos ao mesmo tempo. */
function gauss(A,b){const n=A.length;const M=A.map((r,i)=>[...r,b[i]]);
 for(let c=0;c<n;c++){let p=c;for(let r=c+1;r<n;r++)if(Math.abs(M[r][c])>Math.abs(M[p][c]))p=r;if(Math.abs(M[p][c])<1e-10)return null;[M[c],M[p]]=[M[p],M[c]];
  for(let r=0;r<n;r++){if(r===c)continue;const f=M[r][c]/M[c][c];for(let k=c;k<=n;k++)M[r][k]-=f*M[c][k];}}
 return M.map((r,i)=>r[n]/r[i]);}
function contrib(id,st){const i=ING_BY[id];const c=compOf(i,st&&st.brix||{});let pac=0,pod=0;for(const f in PACK)pac+=(c[f]||0)*PACK[f]/100;for(const f in PODK)pod+=(c[f]||0)*PODK[f]/100;if(c.gs){pac+=c.gs*1.9*(i.de||20)/100;pod+=c.gs*.9*(i.de||20)/100;}
 const msnf=i.msnf!=null?i.msnf:(i.dairy?(c.lac||0)+(c.prot||0)+(c.ash||0):0);
 return{w:(c.w||0)/100,fat:(c.fat||0)/100,msnf:msnf/100,pac:pac/100,pod:pod/100,sol:(100-(c.w||0)-(c.alc||0))/100,hf:(HFK.B*(i.hfB||0)+HFK.S*(i.hfS||0)+HFK.N*(i.hfN||0))/100};}
/* mínimos quadrados não negativos (Lawson–Hanson): min ‖Ax − b‖ com x ≥ 0 */
function nnls(A,b){const n=A[0].length;const x=new Array(n).fill(0);const P=new Set();
 const resid=()=>b.map((bi,i)=>bi-A[i].reduce((s,a,j)=>s+a*x[j],0));
 const grad=()=>{const r=resid();return Array.from({length:n},(_,j)=>A.reduce((s,row,i)=>s+row[j]*r[i],0));};
 const lsq=idx=>{const N=idx.map(j=>idx.map(k=>A.reduce((s,row)=>s+row[j]*row[k],0)+(j===k?1e-12:0)));const y=idx.map(j=>A.reduce((s,row,i)=>s+row[j]*b[i],0));return gauss(N,y);};
 for(let outer=0;outer<4*n;outer++){const w=grad();let t=-1,best=1e-9;for(let j=0;j<n;j++)if(!P.has(j)&&w[j]>best){best=w[j];t=j;}if(t<0)break;P.add(t);
  for(let inner=0;inner<4*n;inner++){const idx=[...P];const z=lsq(idx);if(!z){P.delete(t);break;}
   if(z.every(v=>v>1e-12)){idx.forEach((j,k)=>x[j]=z[k]);break;}
   let alpha=1;idx.forEach((j,k)=>{if(z[k]<=1e-12){const a=x[j]/(x[j]-z[k]);if(a<alpha)alpha=a;}});
   idx.forEach((j,k)=>{x[j]+=alpha*(z[k]-x[j]);});idx.forEach(j=>{if(x[j]<=1e-9){x[j]=0;P.delete(j);}});}}
 return x;}
/* GERADOR POR ALVO
   Resolve as gramas dos ingredientes de base por mínimos quadrados ponderados com gramas ≥ 0:
   massa e congelamento (PAC exigido pela vitrine) são praticamente rígidos; doçura, gordura, MSNF e sólidos
   são metas ponderadas. Nunca "desiste": devolve a receita viável mais próxima e diz quais metas cedeu e quanto. */
const GEN_VARS={crema:['leite','creme35','lpd','sacarose','dextrose'],frutta:['leite','creme35','lpd','sacarose','dextrose'],gastro:['leite','creme35','lpd','dextrose'],semacucar:['leite','creme35','lpd','eritritol','inulina'],sorbetto:['agua','sacarose','dextrose','malto'],vegan:['agua','cococreme','sacarose','dextrose','malto']};
const GEN_TOL={fat:.6,msnf:.6,pod:1,sol:1.2};
function generate(o){
 const P=PROF[o.tipo]||PROF.crema,B=+o.batch||1000,VARS=GEN_VARS[o.tipo]||GEN_VARS.crema,proc=o.proc||{};
 const fixed=[];(o.fixed||[]).forEach(f=>{if(!f.id||!ING_BY[f.id]||!(+f.g>0))return;const e=fixed.find(x=>x.id===f.id);if(e)e.g+=+f.g;else fixed.push({id:f.id,g:+f.g});});
 if(o.stabId&&ING_BY[o.stabId]&&+o.stabGkg>0)fixed.push({id:o.stabId,g:B*o.stabGkg/1000});
 const F0={w:0,fat:0,msnf:0,pac:0,pod:0,sol:0,hf:0,mass:0};fixed.forEach(f=>{const c=contrib(f.id);F0.mass+=f.g;for(const k in c)F0[k]+=c[k]*f.g;});
 if(F0.mass>=B*.98)return{ok:false,msg:'Os ingredientes fixos já somam o lote inteiro; aumente o lote ou reduza o sabor.'};
 const C=VARS.map(id=>contrib(id));const fzT=(P.fz[0]+P.fz[1])/2;const dairy=VARS.includes('lpd');
 /* pesos: rígidas ≫ metas; a prioridade das metas depende do tipo */
 const tgt={pod:+o.pod,fat:+o.fat,msnf:+o.msnf,sol:+o.sol};
 /* nas bases lácteas os sólidos resultam das outras metas: só entram na conta se saírem da faixa do perfil (2ª passada) */
 const solve=(W,solT)=>{let S=0,x=null,m;
  for(let it=0;it<12;it++){const se=seRequired(+o.vit,fzT,S)/100;
   const rows=[],rhs=[];const add=(k,coef,b,scale)=>{if(!(W[k]>0))return;const w=Math.sqrt(W[k])/scale;rows.push(coef.map(v=>v*w));rhs.push(b*w);};
   add('mass',C.map(()=>1),B-F0.mass,B*.01);
   add('pac',C.map(c=>c.pac-c.hf-se*c.w),se*F0.w-(F0.pac-F0.hf),B*.01);
   ['pod','fat','msnf','sol'].forEach(k=>{const t=k==='sol'?solT:tgt[k];if(!isFinite(t))return;if(k==='fat'&&!C.some(c=>c.fat>.05))return;if(k==='msnf'&&!dairy)return;add(k,C.map(c=>c[k]),t/100*B-F0[k],B*.01);});
   x=nnls(rows,rhs);
   m=analyze({tipo:o.tipo,vit:o.vit,recipe:fixed.concat(VARS.map((id,i)=>({id,g:x[i]})).filter(r=>r.g>.05)),proc,brix:{}});
   if(Math.abs(m.S-S)<2e-3)break;S=m.S;}
  const rec=fixed.concat(VARS.map((id,i)=>({id,g:x[i]}))).filter(r=>r.g>=.3).map(r=>({id:r.id,g:Math.round(r.g*10)/10}));
  return{rec,m:analyze({tipo:o.tipo,vit:o.vit,recipe:rec,proc,brix:{}})};};
 const W={mass:1e4,pac:3e3,pod:o.tipo==='gastro'?.6:4,fat:3,msnf:2.5,sol:dairy?0:1.2};
 let r=solve(W,tgt.sol);

/* ===================== SENSIBILIDADE (LAB) ===================== */
function sweep(st,id,lo,hi,n){const r=(st.recipe||[]).find(x=>x.id===id);if(!r)return[];const base=+r.g;const out=[];
 for(let i=0;i<n;i++){const k=lo+(hi-lo)*i/(n-1);const g=Math.max(0,Math.round(base*(1+k/100)*10)/10);const s2={...st,recipe:st.recipe.map(x=>x.id===id?{...x,g}:x)};const m=analyze(s2);const F=diagnose(s2,m);out.push({k,g,fz:m.fzVit,pod:m.pod,sol:m.sol,sc:score(s2,m,F).total,serve:m.serveT,fat:m.fat});}
 return out;}


/* ---------- VITRINE ---------- */
function vitrineAnalysis(items,temp){return items.map(it=>{const st={tipo:it.tipo,vit:temp,recipe:it.recipe,proc:it.proc||PROC0,brix:{},costs:{}};const m=analyze(st);const F=diagnose(st,m);return{it,st,m,sc:score(st,m,F).total,dev:m.serveT-temp};});}
function bestVitrineTemp(rows){const v=rows.map(r=>r.m.serveT).filter(x=>isFinite(x)).sort((a,b)=>a-b);if(!v.length)return -13;const med=v[Math.floor(v.length/2)];return Math.round(med*2)/2;}

/* ---------- PLANEJAMENTO E ESTOQUE ---------- */
/* saldo por ingrediente (puro: pode ser chamado no render) */
function invStock(inv){const by={};(inv||[]).forEach(e=>{if(+e.qty<=0)return;const b=by[e.ingId]=by[e.ingId]||{q:0,c:0};b.q+=+e.qty;b.c+=+e.qty*(+e.costKg||0);});return by;}
/* custo médio ponderado do estoque → custos das receitas; só invalida a memória de cálculo se mudou */
function invRecompute(inv){const by=invStock(inv);const nc={};for(const k in by)if(by[k].q>0&&by[k].c>0)nc[k]=by[k].c/by[k].q;
 if(JSON.stringify(nc)!==JSON.stringify(INVCOST)){INVCOST=nc;INVVER++;}return by;}
function planNeeds(plan,getRec,cap){const need={},runs=[];(plan||[]).forEach(p=>{const r=getRec(p);if(!r||!(+p.kg>0))return;const tot=r.recipe.reduce((a,x)=>a+(+x.g||0),0)||1;const g=+p.kg*1000;const f=g/tot;
  r.recipe.forEach(x=>{need[x.id]=(need[x.id]||0)+x.g*f;});runs.push({name:r.name,g,cycles:cap?Math.ceil(g/cap):1,perCycle:cap?g/Math.ceil(g/cap):g});});return{need,runs};}
function consumeFIFO(inv,id,g){let rest=g;inv.filter(e=>e.ingId===id&&+e.qty>0).sort((a,b)=>String(a.exp||'9999').localeCompare(String(b.exp||'9999'))).forEach(e=>{if(rest<=0)return;const t=Math.min(+e.qty,rest);e.qty=+e.qty-t;rest-=t;e._dirty=1;});return rest;}

/* ===================== IL FREDOLIN · BATERIA DE TESTES =====================
   Roda igual no Node (antes de publicar) e dentro do app (Dados e sincronização → Testes do motor).
   Usa todas as receitas dos mestres e as bases como referência fixa. A calibração pelos lotes do usuário
   fica desligada durante os testes, para que o resultado dependa só do motor. */
const TEST_VITS=[-11,-14.5,-18];
const GOLD_KEYS=['sol','fat','pod','pacKg','fzVit','serveT','ov','visc','ph','shelfVit'];
function testRecipes(){const out=[];
 MASTERS.forEach((p,k)=>out.push({key:'mas'+k,name:p.a+' · '+p.name,tipo:p.tipo,vit:p.vit,recipe:p.recipe.map(([id,g])=>({id,g}))}));
 PRESETS.forEach((p,k)=>out.push({key:'pre'+k,name:'Base · '+p.name,tipo:p.tipo,vit:p.vit,recipe:p.recipe.map(([id,g])=>({id,g}))}));
 return out;}
const stTest=(r,vit,proc)=>({tipo:r.tipo,vit:vit!=null?vit:r.vit,recipe:r.recipe,proc:Object.assign({},PROC0,proc||{}),brix:{},costs:{}});
function applyOps(recipe,ops){const rec=recipe.map(x=>({...x}));ops.forEach(([id,d])=>{const r=rec.find(x=>x.id===id);if(r)r.g=+r.g+d;else rec.push({id,g:d});});return rec.filter(r=>r.g>1e-9);}
function badNums(m){const bad=[];for(const k in m){const v=m[k];if(typeof v==='number'&&!isFinite(v))bad.push(k);}for(const k in m.nut)if(!isFinite(m.nut[k]))bad.push('nut.'+k);return bad;}
const badText=s=>/NaN|undefined|Infinity|\[object/.test(s);

function runTests(opt){opt=opt||{};const t0=(typeof performance!=='undefined'?performance:Date).now();
 const list=[];const T=(group,name,fn)=>{let ok,detail;try{const r=fn();ok=r===true||(r&&r.ok);detail=r&&r.detail||'';}catch(e){ok=false;detail='erro: '+(e&&e.message||e);}list.push({group,name,ok,detail});};
 const calPrev=CAL.on;CAL.on=false;
 try{
 const recs=testRecipes();
 /* ---- 1. banco de ingredientes ---- */
 T('Dados','Composição de cada ingrediente soma 98–100,6%',()=>{const bad=ING.filter(i=>{const t=MASS.reduce((a,f)=>a+(i.c[f]||0),0);return t<98||t>100.6;});return{ok:!bad.length,detail:bad.length?bad.map(i=>i.id).join(', '):ING.length+' ingredientes'};});
 T('Dados','Ids únicos e receitas só com ingredientes do banco',()=>{const ids=new Set();const dup=[];ING.forEach(i=>{if(ids.has(i.id))dup.push(i.id);ids.add(i.id);});const miss=[];recs.forEach(r=>r.recipe.forEach(x=>{if(!ING_BY[x.id])miss.push(r.name+': '+x.id);}));return{ok:!dup.length&&!miss.length,detail:[...dup,...miss].join('; ')||recs.length+' receitas'};});
 T('Dados','pH só em faixa física (2–7,5)',()=>{const bad=ING.filter(i=>i.ph!=null&&(i.ph<2||i.ph>7.5));return{ok:!bad.length,detail:bad.map(i=>i.id).join(', ')};});
 /* ---- 2. física ---- */
 T('Física','Curva Goff–Hartel crescente e invertível',()=>{let prev=-1;for(let se=0;se<=300;se+=5){const d=fpdSE(se);if(d<prev)return{ok:false,detail:'decresce em SE '+se};prev=d;if(se>0&&Math.abs(seFromFpd(d)-se)>.01)return{ok:false,detail:'inversa falha em SE '+se};}return true;});
 T('Física','Âncora: sacarose 10% em água congela a ≈ −0,6 °C',()=>{const se=10/90*100;const d=fpdSE(se);return{ok:d>.55&&d<.75,detail:'FPD '+f2(d)+' °C'};});
 T('Física','Âncora: leite integral congela a ≈ −0,52 °C',()=>{const m=analyzeRaw(stTest({tipo:'crema',recipe:[{id:'leite',g:1000}]},-13));return{ok:m.fp<-.45&&m.fp>-.62,detail:'ponto de congelamento '+f2(m.fp)+' °C'};});
 T('Física','Fração congelada cresce com o frio e inverte tempForFrozen',()=>{const SE=60,Sx=.8;let prev=-1;for(let t=-1;t>=-30;t-=.5){const f=frozenPct(t,SE,Sx);if(f<prev-1e-9)return{ok:false,detail:'não monotônica em '+t};prev=f;}for(const p of [40,55,68,74,85]){const t=tempForFrozen(p,SE,Sx);const back=frozenPct(t,SE,Sx);if(Math.abs(back-p)>.05)return{ok:false,detail:p+'% → '+t.toFixed(2)+' °C → '+back.toFixed(2)+'%'};}return true;});
 T('Física','Âncora Corvitto: fiordilatte serve entre −14 e −10 °C',()=>{const r=recs.find(x=>x.key==='pre0');const m=analyzeRaw(stTest(r));return{ok:m.serveT<-10&&m.serveT>-14,detail:'serviço '+f1(m.serveT)+' °C, PAC '+f0(m.pacKg)+'/kg'};});
 T('Física','Mais dextrose → mais mole; mais creme → mais gordura',()=>{const r=recs.find(x=>x.key==='pre0');const base=analyzeRaw(stTest(r));const dx=analyzeRaw(stTest({...r,recipe:applyOps(r.recipe,[['dextrose',30]])}));const cr=analyzeRaw(stTest({...r,recipe:applyOps(r.recipe,[['creme35',80]])}));return{ok:dx.fzVit<base.fzVit&&cr.fat>base.fat&&dx.SE>base.SE,detail:'congelada '+base.fzVit.toFixed(1)+' → '+dx.fzVit.toFixed(1)+'%'};});
 /* ---- 3. todas as receitas em três vitrines e no modo freezer ---- */
 T('Receitas',MASTERS.length+' mestres + '+PRESETS.length+' bases sem valores inválidos em 4 condições',()=>{const bad=[];let n=0;recs.forEach(r=>{[...TEST_VITS.map(v=>[v,{}]),[-18,{serveFrom:'freezer',storeT:-18,storeFluct:3}]].forEach(([v,pr])=>{const st=stTest(r,v,pr);const m=analyze(st);n++;const b=badNums(m);if(b.length)bad.push(r.name+' '+v+': '+b.join(','));});});return{ok:!bad.length,detail:bad.slice(0,3).join('; ')||n+' análises'};});
 T('Receitas','Laudo, índice e defeitos com texto válido',()=>{const bad=[];recs.forEach(r=>TEST_VITS.forEach(v=>{const st=stTest(r,v);const m=analyze(st);const F=diagnose(st,m);const sc=score(st,m,F);if(!(sc.total>=0&&sc.total<=100))bad.push(r.name+': índice '+sc.total);F.forEach(f=>{if(badText(f.title+f.why+f.fix))bad.push(r.name+': '+f.title);});DEFECTS.forEach(d=>rankDefect(d,m).forEach(x=>{if(badText(x.txt+x.fix))bad.push(r.name+': defeito '+d.id);}));}));return{ok:!bad.length,detail:bad.slice(0,3).join('; ')};});
 T('Receitas','Nenhuma sugestão de "0 g" ou gramas negativas',()=>{const bad=[];recs.forEach(r=>TEST_VITS.forEach(v=>{const st=stTest(r,v);const m=analyze(st);diagnose(st,m).forEach(f=>{const s=(f.fix||'')+(f.acts||[]).map(a=>a.t).join(' ');if(/(^|[^\d,])0 g\b|−\d+ g de|-\d+ g de/.test(s))bad.push(r.name+' '+v+': '+f.title);});}));return{ok:!bad.length,detail:bad.slice(0,3).join('; ')};});
 /* ---- 4. as soluções do laudo funcionam ---- */
 T('Soluções','Cada ajuste térmico sugerido leva à faixa de congelamento',()=>{let n=0;const bad=[];recs.forEach(r=>TEST_VITS.forEach(v=>{const st=stTest(r,v);const m=analyze(st);diagnose(st,m).filter(f=>f.acts).forEach(f=>f.acts.forEach(a=>{n++;const m2=analyze({...st,recipe:applyOps(st.recipe,a.ops)});const dz=m2.fzVit-m2.fzMid;if(Math.abs(dz)>3.2)bad.push(r.name+' '+v+' °C · '+a.t+' → '+m2.fzVit.toFixed(1)+'%');if(a.ops.some(([id,d])=>{const x=st.recipe.find(y=>y.id===id);return d<0&&(!x||+x.g+d<-1e-6);}))bad.push(r.name+': retira mais do que existe');}));}));return{ok:!bad.length,detail:bad.slice(0,3).join('; ')||n+' ajustes verificados'};});
 T('Soluções','Balanceador de açúcares não piora o congelamento',()=>{let n=0;const bad=[];recs.forEach(r=>TEST_VITS.forEach(v=>{const st=stTest(r,v);const b=balance(st);if(!b.ok)return;n++;const m0=analyze(st),m1=analyze({...st,recipe:b.newRecipe});const d0=Math.abs(m0.fzVit-m0.fzMid),d1=Math.abs(m1.fzVit-m1.fzMid);if(d1>Math.max(3,d0)+.3)bad.push(r.name+' '+v+': '+d0.toFixed(1)+' → '+d1.toFixed(1));if(b.newRecipe.some(x=>!(x.g>=0)))bad.push(r.name+': grama negativa');}));return{ok:!bad.length,detail:bad.slice(0,3).join('; ')||n+' balanceamentos'};});
 T('Soluções','Gerador por alvo: congelamento e sólidos na faixa em todos os tipos',()=>{const fx={sorbetto:[{id:'manga',g:450}],frutta:[{id:'morango',g:350}],gastro:[{id:'gorgonzola',g:80}]};const bad=[];Object.keys(GEN_DEF).forEach(t=>{[-11,-14.5].forEach(v=>{const g=generate({tipo:t,batch:1000,fixed:fx[t]||[{id:'pistache',g:100}],...GEN_DEF[t],stabId:'nx_fredolin',stabGkg:t==='sorbetto'?4:25,vit:v});if(!g.ok){bad.push(t+' '+v+': '+g.msg);return;}const dz=g.m.fzVit-g.m.fzMid;if(Math.abs(dz)>3.2)bad.push(t+' '+v+': '+g.m.fzVit.toFixed(1)+'%');const rs=g.m.P.sol;if(g.m.sol<rs[0]-1.5||g.m.sol>rs[1]+1.5)bad.push(t+' '+v+': sólidos '+g.m.sol.toFixed(1)+'%');});});return{ok:!bad.length,detail:bad.join('; ')};});
 /* ---- 5. regressão contra a referência ---- */
 if(typeof GOLDEN!=='undefined')T('Regressão','Métricas das receitas iguais à referência',()=>{const bad=[];let n=0;recs.forEach(r=>{const g=GOLDEN[r.key];if(!g)return;const st=stTest(r);const m=analyze(st);const sc=score(st,m,diagnose(st,m)).total;GOLD_KEYS.forEach((k,i)=>{n++;const a=g[i],b=m[k];if(Math.abs(a-b)>1e-4*Math.max(1,Math.abs(a)))bad.push(r.name+' '+k+' '+a+' → '+(+b).toFixed(4));});n++;if(g[GOLD_KEYS.length]!==sc)bad.push(r.name+' índice '+g[GOLD_KEYS.length]+' → '+sc);});return{ok:!bad.length,detail:bad.slice(0,3).join('; ')||n+' valores conferidos'};});
 /* ---- 6. memória de cálculo e neutros ---- */
 T('Motor','Neutro editado invalida a memória de cálculo',()=>{const r=recs.find(x=>x.key==='pre0');const nx={id:'nx_selftest',name:'teste',dose:5,parts:{lbg:40,guar:30,dex:430}};registerNeutro(nx);const st={...stTest(r),recipe:[...r.recipe.filter(x=>x.id!=='nx_fredolin'&&x.id!=='neutro'),{id:'nx_selftest',g:5}]};const a=analyze(st).visc;registerNeutro({...nx,parts:{xan:200,dex:300}});const b=analyze(st).visc;const k=ING.findIndex(i=>i.id==='nx_selftest');if(k>=0)ING.splice(k,1);delete ING_BY.nx_selftest;ING_VER++;return{ok:Math.abs(a-b)>1e-6,detail:'viscosidade '+a.toFixed(1)+' → '+b.toFixed(1)+' mPa·s'};});
 T('Motor','Calibração: 1 lote medido desloca pouco (prior de 3 lotes)',()=>{const keep=JSON.stringify(CAL);const r=recs.find(x=>x.key==='pre0');const c=fitCalibration([{id:1,tipo:'crema',vit:-13,recipe:r.recipe,proc:{machine:'maqp1'},meas:{ov:40,melt10:60}}]);const ov=c.ov.maqp1;Object.assign(CAL,JSON.parse(keep));CAL.on=false;CAL.ver++;return{ok:ov>0&&ov<15,detail:'viés de overrun '+ov+' pontos'};});
 T('Dados','Caminho da nuvem com número ímpar de segmentos',()=>{const p='data/users/u_x/fredolin/lib'.split('/');return{ok:p.length%2===1,detail:p.length+' segmentos'};});
 /* ---- 7. interface (todas as páginas, quando houver DOM) ---- */
 if(opt.ui&&typeof VIEW!=='undefined'){T('Interface','Todas as páginas desenham sem erro nem texto inválido',()=>{const bad=[];const st=S;const m=analyze(st),F=diagnose(st,m),sc=score(st,m,F);Object.keys(VIEW).forEach(k=>{try{const h=VIEW[k](m,F,sc);if(badText(h.replace(/<input[^>]*value=""[^>]*>/g,'')))bad.push(k+': texto inválido');}catch(e){bad.push(k+': '+e.message);}});return{ok:!bad.length,detail:bad.join('; ')||Object.keys(VIEW).length+' páginas'};});}
 }finally{CAL.on=calPrev;}
 const ms=Math.round((typeof performance!=='undefined'?performance:Date).now()-t0);
 return{list,pass:list.filter(x=>x.ok).length,fail:list.filter(x=>!x.ok).length,ms,date:new Date().toISOString()};}

 </div>`;}

/* ---------- LAUDO ---------- */

  ['Doçura POD',m.pod,'%',P.pod,1],['Estabilizantes',m.hydro,'%',P.stab,2],['Emulsificantes',m.emul,'%',null,2],['Gema',m.yolkPct,'%',null,1],

 return`<div class="pg">

 <div class="card"><div class="row" style="gap:20px;align-items:center">${ring(sc.total)}<div style="flex:1;min-width:240px;display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px 16px">
  ${sc.parts.map(([n,w,v])=>`<div><div class="row" style="justify-content:space-between"><span class="t2" style="font-size:12.5px">${n}</span><span class="mono" style="font-size:11px">${f0(v*100)}</span></div>${rbar(v*100,[85,100],0,100)}</div>`).join('')}</div></div>
  <div class="row" style="margin-top:12px">${groups.map(g=>{const n=F.filter(f=>f.sev===g).length;const PL={crit:['crítico','críticos'],warn:['alerta','alertas'],info:['observação','observações'],ok:['acerto','acertos']}[g];return n?`<span class="chip ${g}">${n} ${PL[n>1?1:0]}</span>`:'';}).join('')}</div></div>
 ${approveCard(m,F,sc)}
 ${groups.map(g=>{const L=F.filter(f=>f.sev===g);return L.length?`<div class="card"><h2>${{crit:'Erros críticos',warn:'Atenção',info:'Observações',ok:'Acertos'}[g]}</h2>${L.map(findHTML).join('')}</div>`:'';}).join('')}
 <div class="card"><h2>Balanceador de açúcares</h2>
  <p class="t2" style="margin:0 0 10px;max-width:80ch">Recalcula sacarose, dextrose e maltodextrina DE 19 para atingir ao mesmo tempo ${P.fz[0]}–${P.fz[1]}% de água congelada a ${f1(S.vit)} °C, a doçura central da faixa e os sólidos dentro do alvo. O restante da receita não muda.</p>
  <button class="btn pri" data-a="bal">Calcular proposta</button>
  ${bal?(bal.ok?`<div class="tw" style="margin-top:12px"><table class="tbl"><thead><tr><th>Açúcar</th><th class="r">Atual</th><th class="r">Proposto</th><th class="r">Diferença</th></tr></thead><tbody>${bal.prop.map((p,k)=>`<tr><td>${esc(ING_BY[p.id].n)}</td><td class="r mono">${f0(bal.cur[k])} g</td><td class="r mono c-ice">${f0(p.g)} g</td><td class="r mono">${p.g-bal.cur[k]>=0?'+':''}${f0(p.g-bal.cur[k])} g</td></tr>`).join('')}</tbody></table></div>
   <p class="t2" style="margin:10px 0">Resultado: ${f0(bal.m1.fzVit)}% congelada · POD ${f1(bal.m1.pod)}% · sólidos ${f1(bal.m1.sol)}% · lote ${f0(bal.m1.tot)} g${bal.mode!=='3'?' · <span class="c-warn">sólidos ficaram livres para atingir congelamento e doçura</span>':''}</p>
   <div class="row"><button class="btn okb" data-a="balApply">Aplicar na receita</button><button class="btn sm" data-a="balClose">Descartar</button></div>`:`<p class="c-warn" style="margin:10px 0 0">${esc(bal.msg)}</p>`):''}</div>
 <div class="card"><h2>Parâmetros</h2><div class="tw"><table class="tbl"><thead><tr><th>Parâmetro</th><th class="r">Valor</th><th class="r">Alvo</th><th style="width:30%">Posição</th></tr></thead><tbody>
  ${prm.map(([n,v,u,r,d])=>{const lo=r?Math.min(r[0],v)-(r[1]-r[0]||1)*.6:0,hi=r?Math.max(r[1],v)+(r[1]-r[0]||1)*.6:1;return`<tr><td>${n}</td><td class="r mono ${stCls(v,r)}">${d===0?f0(v):d===2?f2(v):f1(v)}${u}</td><td class="r mono muted">${r?(d===2?f2(r[0])+'–'+f2(r[1]):f0(r[0])+'–'+f0(r[1]))+u:'—'}</td><td>${r?rbar(v,r,lo,hi):''}</td></tr>`;}).join('')}
 </tbody></table></div></div>
 </div>`;}

/* ---------- CONGELAMENTO ---------- */
function chart(m){
 /* eixo até −25 °C, ou mais frio se o freezer/serviço estiver abaixo disso */
 const TM=Math.min(-25,Math.floor((Math.min(m.pr.storeT,+S.vit)-2)/5)*5),W=640,H=300,L=44,R=14,Tp=16,B=36,tx=t=>L+(-t)/(-TM)*(W-L-R),ty=p=>Tp+(100-p)/100*(H-Tp-B);
 const pts=[],raw=[];for(let t=0;t>=TM;t-=.25){pts.push([tx(t),ty(m.fz(t))]);if(m.hfAbs>0)raw.push([tx(t),ty(frozenPct(t,m.SEraw,m.S))]);}
 const path=a=>'M'+a.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join('L');
 const P=m.P;let g='';
 for(let p=0;p<=100;p+=20)g+=`<line x1="${L}" x2="${W-R}" y1="${ty(p)}" y2="${ty(p)}" stroke="var(--line)" stroke-width="1"/><text x="${L-8}" y="${ty(p)+4}" text-anchor="end" fill="var(--t3)" font-size="10">${p}%</text>`;
 for(let t=0;t>=TM;t-=5)g+=`<text x="${tx(t)}" y="${H-B+18}" text-anchor="middle" fill="var(--t3)" font-size="10">${t}°</text>`;
 g+=`<text x="${(W+L)/2}" y="${H-4}" text-anchor="middle" fill="var(--t3)" font-size="10">temperatura (°C)</text>`;
 g+=`<rect x="${L}" y="${ty(P.fz[1])}" width="${W-L-R}" height="${ty(P.fz[0])-ty(P.fz[1])}" fill="rgba(110,231,183,.1)"/>`;
 /* rótulos à esquerda da linha quando perto da borda direita; vitrine e estoque iguais viram um rótulo só */
 const mk=(t,lab,col,dy)=>{const x=tx(t),right=x>W-150;return`<line x1="${x}" x2="${x}" y1="${Tp}" y2="${H-B}" stroke="${col}" stroke-dasharray="3 3"/><text x="${right?x-4:x+4}" y="${Tp+10+dy}" text-anchor="${right?'end':'start'}" fill="${col}" font-size="10">${lab} ${f1(t)}°</text>`;};
 const same=Math.abs(+S.vit-m.pr.storeT)<.6;
 g+=mk(m.pr.drawT,'saída','var(--gold)',0)+(same?mk(+S.vit,'vitrine = estoque','var(--ice)',14):mk(+S.vit,'vitrine','var(--ice)',14)+mk(m.pr.storeT,'estoque','var(--info)',28));
 if(raw.length)g+=`<path d="${path(raw)}" fill="none" stroke="var(--t3)" stroke-width="1.5" stroke-dasharray="4 4"/>`;
 g+=`<path d="${path(pts)}" fill="none" stroke="var(--ice)" stroke-width="2.5"/>`;
 {const x=tx(+S.vit),r=x>W-60;g+=`<circle cx="${x}" cy="${ty(m.fzVit)}" r="5" fill="var(--ice)"/><text x="${r?x-8:x+8}" y="${ty(m.fzVit)+18}" text-anchor="${r?'end':'start'}" fill="var(--t1)" font-size="11">${f0(m.fzVit)}%</text>`;}
 if(m.serveT<0&&m.serveT>TM)g+=`<circle cx="${tx(m.serveT)}" cy="${ty(m.fzMid)}" r="4" fill="none" stroke="var(--ok)" stroke-width="2"/>`;
 return`<div class="tw"><svg viewBox="0 0 ${W} ${H}" style="width:100%;min-width:480px;height:auto" role="img" aria-label="Curva de água congelada por temperatura">${g}</svg></div>
 <div class="row note" style="gap:16px;margin-top:6px"><span><span class="c-ice">━</span> curva efetiva (com fator de dureza)</span>${raw.length?'<span>┅ curva sem fator de dureza</span>':''}<span><span class="c-ok">■</span> faixa de serviço ${P.fz[0]}–${P.fz[1]}%</span><span><span class="c-ok">○</span> ponto ideal</span></div>`;}
function pgCongel(m){
 if(m.empty)return`<div class="pg"><h1>Congelamento</h1><p class="lead">Monte uma receita primeiro.</p></div>`;
 return`<div class="pg"><div><h1>Congelamento</h1><p class="lead">Quanto da água vira gelo em cada temperatura. A textura de vitrine ideal fica com ${m.P.fz[0]}–${m.P.fz[1]}% da água congelada.</p></div>
 <div class="card">${chart(m)}</div>
 <div class="g3">
  <div class="card"><h2>Temperaturas</h2>
   <div class="kv"><span>Início do congelamento</span><span>${f2(m.fp)} °C</span></div>
   <div class="kv"><span>Serviço ideal desta receita</span><span class="c-ok">${f1(m.serveT)} °C</span></div>
   <div class="kv"><span>Faixa de serviço</span><span>${f1(m.serveRange[1])} a ${f1(m.serveRange[0])} °C</span></div>
   <div class="kv"><span>Vitrine configurada</span><span class="c-ice">${f1(S.vit)} °C</span></div></div>
  <div class="card"><h2>Água congelada</h2>
   <div class="kv"><span>Na saída (${f1(m.pr.drawT)} °C)</span><span class="${m.fzDraw>=45?'c-ok':'c-warn'}">${f0(m.fzDraw)}%</span></div>
   <div class="kv"><span>Na vitrine (${f1(S.vit)} °C)</span><span class="${stCls(m.fzVit,m.P.fz)}">${f0(m.fzVit)}%</span></div>
   <div class="kv"><span>No estoque (${f1(m.pr.storeT)} °C)</span><span>${f0(m.fzStore)}%</span></div></div>
  <div class="card"><h2>PAC (método Corvitto)</h2>
   <div class="kv"><span>PAC da mistura</span><span>${f0(m.pacKg)} /kg</span></div>
   <div class="kv"><span>Fator de dureza (HF)</span><span class="${m.hfKg>=.5?'c-gold':'muted'}">${m.hfKg>=.5?'−'+f0(m.hfKg):'0'} /kg</span></div>
   <div class="kv"><span>PAC efetivo</span><span class="c-ice">${f0(m.pacEffKg)} /kg</span></div>
   <div class="kv"><span>PAC necessário a ${f1(S.vit)} °C</span><span>${f0(m.pacNeedKg-m.hfKg)} /kg</span></div>
   <div class="kv"><span>Referência rápida Corvitto (≈23 × |T|)</span><span class="muted">${f0(m.corvittoRef)} /kg</span></div></div>
 </div>
 <div class="card flat"><h2>Como o motor calcula</h2><p class="note" style="margin:0">Cada açúcar, poliol, sal e álcool é convertido em equivalente de sacarose pelo seu peso molecular (sacarose 100, dextrose 190, frutose 190, lactose 100, eritritol 280, etanol 740, sal 1090). A concentração na água da mistura dá o ponto de congelamento pela tabela de Goff &amp; Hartel; os sais do leite entram pelo termo de Leighton (2,37 × MSNF / água). Conforme o gelo se forma, a água restante concentra e o motor resolve, grau a grau, a fração que ainda pode congelar. Cacau e oleaginosas entram pelo fator de dureza de Corvitto, recalibrado para que o Helado de nata (410 PAC) e o Helado de chocolate do Recetario sirvam ambos a −18 °C, como no livro.</p></div>
 </div>`;}

/* ---------- PROCESSO ---------- */
function pgProcesso(m,F){
 const p=S.proc,PF=F.filter(f=>f.area==='Processo'||f.area==='Segurança');
 const sel=(id,label,opts,val,hint)=>`<label class="field"><span class="lbl">${label}</span><select id="p-${id}" data-c="proc" data-k="${id}">${opts.map(([v,n])=>`<option value="${v}"${String(v)===String(val)?' selected':''}>${n}</option>`).join('')}</select>${hint?`<span class="hint">${hint}</span>`:''}</label>`;
 return`<div class="pg"><div><h1>Processo</h1><p class="lead">Pasteurização, maturação, mantecação e abatimento mudam o resultado tanto quanto a fórmula. Ajuste os valores reais da sua produção.</p></div>

 </div></div>
 <div class="card"><h2>Maturação</h2><div class="form">
  ${fieldNum('p-matH','Tempo (h)',p.matH,1,'Ideal 6–12 h · máx. 72 h')}
  ${fieldNum('p-matT','Temperatura (°C)',p.matT,.5,'Ideal 2–4 °C')}
  ${sel('fruitStage','Fruta ácida entra',[['depois','fria, após maturar'],['antes','antes de pasteurizar']],p.fruitStage)}
  ${sel('alcStage','Álcool entra',[['depois','na mistura fria'],['antes','antes do calor']],p.alcStage)}
 </div></div>
 <div class="card"><h2>Mantecação, abatimento e armazenamento</h2><div class="form">
  ${sel('machine','Equipamento',Object.entries(MACH).map(([k,v])=>[k,v.n]),p.machine)}
  ${fieldNum('p-drawT','Temperatura de saída (°C)',p.drawT,.5,'Ideal '+m.P.draw[1]+' a '+m.P.draw[0]+' °C')}
  ${fieldNum('p-drawMin','Tempo de mantecação (min)',p.drawMin,1,'Batch: 8–12 min')}
  ${fieldNum('p-blastT','Abatedor (°C)',p.blastT,1,'−35 a −40 °C')}
  ${fieldNum('p-hardMin','Até −18 °C no núcleo (min)',p.hardMin,5,'Ideal até 60 min')}
  ${fieldNum('p-storeT','Freezer de armazenamento (°C)',p.storeT,.5,'Meça no centro de uma cuba · ideal −18 a −22 °C')}
  ${fieldNum('p-storeFluct','Oscilação do freezer (± °C)',p.storeFluct,.5,'Diferença entre a máxima e a mínima do dia ÷ 2')}
  ${sel('serveFrom','Serviço',[['vitrine','Vitrine (sai do freezer para a vitrine)'],['freezer','Direto do freezer (sem vitrine)']],p.serveFrom)}
 </div></div>
 ${m.empty?'':`<div class="g3">
  <div class="card"><h2>Overrun previsto</h2><div class="big c-ice">${f0(m.ov)}%</div><p class="t2" style="margin:6px 0 0">≈ ${f0(m.gPerL)} g de gelato por litro · ${f2(1+m.ov/100)} L por kg de mistura</p><p class="note">Faixa usual: ${m.P.ov[0]}–${m.P.ov[1]}% · ${esc(m.mach.n)}</p></div>
  <div class="card"><h2>Cristalização</h2><div class="big ${m.ci>=80?'c-ok':m.ci>=60?'c-warn':'c-crit'}">${m.ci}<small class="muted" style="font-size:14px"> /100</small></div><p class="t2" style="margin:6px 0 0">Cristais estimados ≈ ${m.crystal} µm (acima de ~50 µm a língua percebe gelo)</p><p class="note">${m.ciNotes.length?'Pesam contra: '+m.ciNotes.join(', ')+'.':'Processo favorece cristais pequenos.'} ${f0(m.fzDraw)}% da água sai congelada da máquina.</p></div>
  <div class="card"><h2>Resistência ao derretimento</h2><div class="big ${m.melt>=65?'c-ok':m.melt>=45?'c-warn':'c-crit'}">${f0(m.melt)}<small class="muted" style="font-size:14px"> /100</small></div><p class="note">Combina estabilizantes, emulsificantes, ar incorporado, sólidos e o quanto a receita congela na vitrine.</p></div>
 </div>
 <div class="card"><h2>Verificações de processo</h2>${PF.map(findHTML).join('')||'<p class="muted">Nada a apontar.</p>'}</div>`}
 </div>`;}

/* ---------- BRIX ---------- */
function pgBrix(m){
 const fr=(S.recipe||[]).filter(r=>ING_BY[r.id]&&ING_BY[r.id].brix);
 const ref=analyze({...S,brix:{}});const dPod=m.A.pod-ref.A.pod,dPac=m.A.pac-ref.A.pac;
 return`<div class="pg"><div><h1>Calibração Brix</h1><p class="lead">A doçura de cada safra varia. Meça o °Brix da polpa no refratômetro e informe aqui: o motor corrige açúcares e água da fruta e recalcula toda a receita.</p></div>
 <div class="card"><h2>Frutas da receita</h2>${fr.length?`<div class="tw"><table class="tbl"><thead><tr><th>Fruta</th><th class="r">Gramas</th><th class="r">°Bx tabela</th><th class="r">°Bx medido</th><th class="r">Δ açúcar no lote</th><th></th></tr></thead><tbody>
  ${fr.map(r=>{const i=ING_BY[r.id],b=S.brix[r.id];const has=b!=null&&b!=='';const d=has?(+b-i.brix):0;return`<tr><td>${esc(i.n)}</td><td class="r mono">${f0(r.g)}</td><td class="r mono muted">${i.brix}</td><td class="r"><input type="number" id="bx-${r.id}" data-i="brix" data-id="${r.id}" value="${has?esc(b):''}" placeholder="${i.brix}" step=".1" min="0" max="40" aria-label="Brix medido de ${esc(i.n)}"></td><td class="r mono ${d>0?'c-gold':d<0?'c-crit':'muted'}">${has?(d>=0?'+':'')+f1(r.g*.9*d/100)+' g':'—'}</td><td class="r">${has?`<button class="btn sm" data-a="brixReset" data-v="${r.id}">Padrão</button>`:''}</td></tr>`;}).join('')}
 </tbody></table></div>
 ${Math.abs(dPod)>.5?`<div class="find" style="border:0;padding-bottom:0"><div class="bar ${dPod>0?'warn':'info'}"></div><div><h3>Compensação da safra</h3><p>A fruta medida traz ${dPod>0?'+':''}${f0(dPod)} g de doçura equivalente e ${dPac>0?'+':''}${f0(dPac)} de PAC em relação à tabela.</p><div class="fix"><b>Solução</b>Para manter a receita original, ${dPod>0?'retire':'acrescente'} ≈ ${f0(Math.abs(dPod))} g de sacarose; ou use o balanceador do laudo para redistribuir os açúcares.</div></div></div>`:''}`
 :'<p class="muted">Nenhuma fruta na receita. Polpas e sucos do banco aparecem aqui automaticamente.</p>'}</div>
 <div class="g2">
  <div class="card"><h2>Brix estimado da mistura</h2><div class="big c-ice">${m.empty?'—':f1(m.brixMix)}<small class="muted" style="font-size:14px"> °Bx</small></div>
   <p class="t2" style="margin:6px 0 0">${S.tipo==='sorbetto'?'Sorbetto: leitura no refratômetro entre 28 e 32 °Bx. Se medir diferente do previsto, a fruta ou a pesagem divergem.':'Em bases lácteas a gordura e a proteína distorcem a leitura do refratômetro; use o valor só como controle de lote para lote.'}</p></div>
  <div class="card"><h2>Relação Brix / acidez</h2><div class="big ${m.brixAcid==null?'muted':m.brixAcid<20?'c-warn':m.brixAcid>60?'c-info':'c-ok'}">${m.brixAcid==null||m.acd<.05?'—':f0(m.brixAcid)}</div>
   <p class="t2" style="margin:6px 0 0">Abaixo de 20: ácido dominante · 20–35: vivo, cítrico · 35–60: fruta madura equilibrada · acima de 60: plano. Acidez orgânica da mistura: ${f2(m.acd)}%.</p></div>
 </div></div>`;}

/* ---------- DEFEITOS ---------- */

const BRAL={leite:'LEITE E DERIVADOS',ovo:'OVOS E DERIVADOS',soja:'SOJA E DERIVADOS',amendoim:'AMENDOIM',peixe:'PEIXES',crustaceo:'CRUSTÁCEOS'};
