/* ===================== QUÍMICA E SENSORIAL ===================== */
function pgQuimica(m){if(m.empty)return`<div class="pg"><h1>Química e sensorial</h1><p class="lead">Monte uma receita primeiro.</p></div>`;
 const t0=Math.min(-20,Math.floor(m.vit/2)*2);const temps=[];for(let t=t0;t<=-6;t+=1)temps.push(t);const W=600,H=200,L=40,R=12,T=12,B=28;const pods=temps.map(t=>m.pod*podTempFactor(t));const lo=Math.min(...pods,m.P.pod[0])-2,hi=Math.max(...pods,m.P.pod[1])+2;
 const sx=t=>L+(t-t0)/(-6-t0)*(W-L-R),sy=v=>T+(1-(v-lo)/(hi-lo))*(H-T-B);let g=`<rect x="${L}" y="${sy(m.P.pod[1])}" width="${W-L-R}" height="${sy(m.P.pod[0])-sy(m.P.pod[1])}" fill="rgba(110,231,183,.1)"/>`;
 temps.forEach(t=>{if(t%2===0)g+=`<text x="${sx(t)}" y="${H-10}" text-anchor="middle" fill="var(--t3)" font-size="10">${t}°</text>`;});
 g+=`<path d="${temps.map((t,i)=>(i?'L':'M')+sx(t)+','+sy(pods[i])).join('')}" fill="none" stroke="var(--gold)" stroke-width="2.4"/><line x1="${sx(m.vit)}" x2="${sx(m.vit)}" y1="${T}" y2="${H-B}" stroke="var(--ice)" stroke-dasharray="3 3"/><circle cx="${sx(m.vit)}" cy="${sy(m.podPerc)}" r="5" fill="var(--ice)"/>`;
 [lo,hi].forEach(v=>g+=`<text x="${L-6}" y="${sy(v)+4}" text-anchor="end" fill="var(--t3)" font-size="10">${f0(v)}</text>`);
 const tg=m.tg;
 return`<div class="pg"><div><h1>Química e sensorial</h1><p class="lead">Propriedades que o balanceamento clássico não mostra: viscosidade da mistura, pH, transição vítrea da fase concentrada, cinética de recristalização e percepção de doçura e aroma.</p></div>
 <div class="g3">
  <div class="card"><h2>Viscosidade a 4 °C${natTag('viscosity')}</h2><div class="big ${m.visc<25||m.visc>800?'c-warn':'c-ok'}">${f0(m.visc)}<small class="muted" style="font-size:14px"> mPa·s</small></div><p class="note">Fase sérica pela concentração de solutos, proteínas, Krieger-Dougherty para gordura e insolúveis e contribuição de cada hidrocoloide. Faixa de trabalho 50–400 mPa·s; abaixo de 25 a mistura não segura ar, acima de 800 a mantecadora sofre.</p></div>
  <div class="card"><h2>pH e acidez${natTag('ph')}</h2><div class="big ${m.msnf>.5&&m.ph<5.2?'c-warn':''}">${f1(m.ph)}</div><p class="t2" style="margin:6px 0 0">Acidez titulável ${f2(m.ta)}% (ácido cítrico equivalente)</p><p class="note">Fonte ácida dominante diluída na água da mistura, tamponada pelas proteínas do leite. Com leite, abaixo de 5,2 a caseína coagula no calor; abaixo de 4,6 agrega mesmo a frio.</p></div>
  <div class="card"><h2>Transição vítrea Tg′${natTag('tg-prime')}</h2><div class="big c-ice">${f1(tg)}<small class="muted" style="font-size:14px"> °C</small></div><p class="t2" style="margin:6px 0 0">Vitrine a ${f0(m.dTgVit)} °C acima · estoque a ${f0(m.dTgStore)} °C acima</p><p class="note">Abaixo de Tg′ a fase concentrada vira vidro e os cristais param de crescer. A velocidade de recristalização segue a equação WLF da distância até Tg′.</p></div>
 </div>
 <div class="card"><div class="row"><h2 style="margin:0">Freezer de armazenamento</h2><span class="sp"></span><button class="btn sm" data-a="go" data-v="processo">Ajustar no Processo</button></div>
  <div class="g3" style="margin-top:10px;gap:12px">
   <div><span class="lbl">Temperatura medida</span><div class="big ${m.pr.storeT>-15?'c-crit':m.pr.storeT>-18?'c-warn':'c-ice'}">${f1(m.pr.storeT)}<small class="muted" style="font-size:14px"> °C ± ${f1(+m.pr.storeFluct||0)}</small></div></div>
   <div><span class="lbl">Água congelada no freezer</span><div class="big">${f0(m.fzStore)}<small class="muted" style="font-size:14px">%</small></div><p class="note" style="margin:4px 0 0">Ao retirar: ${m.storeHard}${m.pr.serveFrom==='freezer'?' · serviço direto do freezer':''}</p></div>
   <div><span class="lbl">${m.pr.serveFrom==='freezer'?'Textura estável no freezer':m.pr.serveFrom==='pote'?'Espera até o ponto':'Aclimatação até a vitrine'}</span><div class="big">${m.pr.serveFrom==='freezer'?(m.shelfStore>180?'180+':f0(m.shelfStore))+'<small class="muted" style="font-size:14px"> dias</small>':f0(m.temperMin)+'<small class="muted" style="font-size:14px"> min</small>'}</div><p class="note" style="margin:4px 0 0">${m.pr.serveFrom==='freezer'?'Com oscilação de ±'+f1(+m.pr.storeFluct||0)+' °C (fator ×'+f2(m.kin.fFluct)+').':(m.pr.serveFrom==='pote'?'Pote de '+f0(+m.pr.poteMl)+' mL fora do freezer numa cozinha a '+fT(+m.pr.ambT)+' °C.':'Cuba de 5 L, de '+f1(m.pr.storeT)+' a '+f1(m.vit)+' °C. Faça em etapas para evitar choque térmico.')}</p></div>
  </div>
  <p class="note">O freezer não muda a temperatura de serviço, que é a da vitrine; ele decide quanto o gelato endurece no estoque, quanto tempo precisa aclimatar e, sobretudo, a velocidade com que os cristais crescem. Oscilação (porta, degelo) pesa mais que a temperatura média. Se você serve direto do freezer, escolha "Direto do freezer" no Processo: o balanceamento passa a mirar a temperatura dele.</p></div>
 <div class="g2">
  <div class="card"><h2>Estabilidade da textura${natTag('texture-stability')}</h2><p class="note" style="margin-top:0">Tempo até os cristais de gelo chegarem a ~50 µm (arenosidade), por um modelo de crescimento ainda <b>não calibrado</b> com medições. <b>Não é prazo de validade:</b> segurança de consumo depende de pasteurização, higiene, cadeia de frio e da legislação.</p><div class="kv"><span>Na vitrine (${f1(m.vit)} °C)</span><span class="${m.shelfVit>=5?'c-ok':m.shelfVit>=2?'c-warn':'c-crit'}">${m.shelfVit>60?'60+':f1(m.shelfVit)} dias</span></div><div class="kv"><span>No freezer (${fT(m.pr.storeT)} °C)</span><span>${m.shelfStore>180?'180+':f0(m.shelfStore)} dias</span></div><div class="kv"><span>Cristal inicial</span><span>${m.crystal} µm</span></div>
   <div class="kv"><span>Fatores de K</span><span>estab. ${f2(m.kin.fStab)} · choque ${f2(m.kin.fShock)} · WLF ${f2(m.kin.fKinVit)}${m.kin.km!==1?' · calib. '+f2(m.kin.km):''}</span></div><p class="note">Dias até o cristal médio passar de 50 µm (Ostwald, d³ = d₀³ + K·t).</p></div>
  <div class="card"><h2>Percepção</h2><div class="kv"><span>Doçura percebida a ${f1(m.vit)} °C</span><span class="c-gold">${f1(m.podPerc)}%</span></div><div class="kv"><span>Liberação de aroma</span><span class="${m.aroma>=75?'c-ok':m.aroma>=55?'c-warn':'c-crit'}">${f0(m.aroma)}/100</span></div><div class="kv"><span>Derretido em 10 min a 20 °C</span><span>${f0(m.melt10)}%</span></div>${aromaRows(m)}
   <p class="note">O frio reduz a doçura percebida (cerca de 2,5% por grau abaixo de −12 °C). Gordura, gomas, ar e proteína em excesso prendem os voláteis: aromas delicados (flores, ervas, frutas brancas) pedem índice acima de 75.</p></div></div>
 ${fatCard(m)}
 <div class="card"><h2>Doçura percebida × temperatura de serviço</h2><div class="tw"><svg viewBox="0 0 ${W} ${H}" style="width:100%;min-width:460px;height:auto" role="img" aria-label="Doçura percebida por temperatura">${g}</svg></div><p class="note">Faixa verde: doçura-alvo de ${esc(m.P.n.toLowerCase())}. Ponto azul: vitrine atual.</p></div></div>`;}

  ${rows.map(r=>`<tr><td>${esc(ING_BY[r.id]?ING_BY[r.id].n:r.id)}</td><td class="r mono">${r.g>=1000?f2(r.g/1000)+' kg':f0(r.g)+' g'}</td><td class="r mono">${r.have>=1000?f2(r.have/1000)+' kg':f0(r.have)+' g'}</td><td class="r mono ${r.short>0?'c-crit':'c-ok'}">${r.short>0?(r.short>=1000?f2(r.short/1000)+' kg':f0(r.short)+' g'):'ok'}</td>${$cost(`<td class="r mono">R$ ${f2(r.cost)}</td>`)}</tr>`).join('')}
  ${$cost(`<tr><td colspan="4"><b>Custo de matéria-prima</b></td><td class="r mono"><b>R$ ${f2(tot)}</b></td></tr>`)}</tbody></table></div>

/* ==== 52-execucao.js ==== */
/* ===================== IL FREDOLIN · RECEITAS EM EXECUÇÃO E APROVAÇÃO =====================
   Fluxo: o Chef ou o Maestro cria e testa no laboratório → aprova → a receita vira uma versão "em execução"
   (congelada: ingredientes, processo e vitrine) → o Sous Chef produz exatamente aquela versão.
   Reaprovar a mesma receita gera a versão seguinte (v2, v3…); os lotes guardam a versão produzida. */
const fmtDate=d=>{try{return new Date(d).toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit',year:'numeric'});}catch(e){return'';}};
const execOfBench=()=>EXEC.find(e=>e.id===S.execId)||(S.libId?EXEC.find(e=>e.src===S.libId):null);
/* cartão de aprovação (Bancada e Laudo) */
function approveCard(m,F,sc){if(!can.approve()||m.empty)return'';
 const ex=execOfBench(),crit=F.filter(f=>f.sev==='crit').length;

/* ===================== CREATOR — MODELO DE MICROESTRUTURA ===================== */
/* Converte o resultado do motor em grandezas de microestrutura (campo de 400 µm):
   fração de gelo, de ar, diâmetro médio dos cristais, envelhecimento por Ostwald (LSW: d³ = d0³ + K·t),
   gordura parcialmente coalescida, proteína nas interfaces, lactose cristalizada e rede de hidrocoloides. */
const FIELD_UM=400,AIR_D=40,SENS_D=50;
function microModel(st,m,F,sc,days){
 const P=m.P,pr=m.pr,o={};
 const fz=m.fzVit/100,phiAir=m.ov/(100+m.ov);
 const iceVol=(m.wat/100)*fz/.917,mixVol=1/m.rhoMix;o.phiIce=clamp(iceVol/mixVol*(1-phiAir),0,.75);o.phiAir=phiAir;
 /* coarsening */
 const lo=P.stab[0],hiS=P.stab[1];const k=m.kin;
 o.K=k.Kvit;o.d0=m.crystal;o.d=Math.cbrt(Math.pow(o.d0,3)+o.K*days);o.shelf=m.shelfVit;o.shelfStore=m.shelfStore;
 o.fStab=k.fStab;o.fShock=k.fShock;o.fSerum=k.fKinVit;o.km=k.km;
 /* ar */
 const protOk=m.prot>=Math.max(.5,P.prot[0]-.5)||st.tipo==='sorbetto';const bubbleStable=protOk&&m.hydro>=P.stab[0]*.6;
 o.airD=AIR_D*(1+(bubbleStable?0:.05*days))*(m.ov>P.ov[1]+5?1.15:1);o.bubbleStable=bubbleStable;
 /* gordura e proteína (aglomerados ampliados para visibilidade) */
 o.nFat=Math.round(clamp(m.fat*7,0,90));o.destab=clamp((m.destab||0)/100,0,.9);o.butter=m.fat>11.5||(m.keyPct.mono||0)>.35||(m.fat>10.5&&pr.drawMin>13);
 o.nProt=Math.round(clamp(m.prot*9,0,50));
 o.nLac=m.lacW>9?Math.round((m.lacW-9)*5*(1+days/6)):(m.lacW>8.3&&days>6?Math.round((days-6)*.6):0);
 /* rede de estabilizante */
 o.net=m.hydro<.02?0:clamp(m.hydro/((lo+hiS)/2),0,2.2);o.netExcess=m.hydro>hiS*1.25||(m.keyPct.xan||0)>.12;
 /* estados */
 o.soft=m.fzVit<P.fz[0]-1;o.hard=m.fzVit>P.fz[1]+1;o.big=o.d>45;
 o.serumConc=m.SE/(1-fz||1);
 const crit=F.filter(f=>f.sev==='crit').length,warn=F.filter(f=>f.sev==='warn').length;
 o.imbalance=clamp(Math.abs(m.fzVit-m.fzMid)/12+crit*.35+warn*.08+(o.big?.3:0)+(o.nLac>0?.2:0)+(o.butter?.2:0),0,1.5);
 const structural=['Térmico','Sólidos','Estrutura','Lactose','Estabilização','Processo','Segurança'];
 o.perfect=sc>=92&&!F.some(f=>(f.sev==='crit'||f.sev==='warn')&&structural.includes(f.area))&&!o.big&&o.nLac===0;
 o.score=sc;
 /* indicadores do painel */
 const st3=(ok,warnC)=>ok?'ok':warnC?'warn':'crit';
 o.pills=[
  ['Congelamento',f0(m.fzVit)+'% a '+f1(m.vit)+'°',st3(Math.abs(m.fzVit-m.fzMid)<=3,Math.abs(m.fzVit-m.fzMid)<=8)],
  ['Cristais de gelo','≈'+f0(o.d)+' µm',st3(o.d<=42,o.d<=SENS_D)],
  ['Doçura','POD '+f1(m.pod)+'%',st3(m.pod>=P.pod[0]&&m.pod<=P.pod[1],m.pod>=P.pod[0]-3&&m.pod<=P.pod[1]+3)],
  ['Sólidos',f1(m.sol)+'%',st3(m.sol>=P.sol[0]&&m.sol<=P.sol[1],m.sol>=P.sol[0]-3&&m.sol<=P.sol[1]+3)],
  ['Emulsão',st.tipo==='sorbetto'?'sem gordura':f1(m.fat)+'% gordura',st.tipo==='sorbetto'?'ok':st3(m.fat>=P.fat[0]&&m.fat<=P.fat[1]&&!o.butter&&(m.fat<=8||m.hasEmul),!o.butter)],
  ['Ar incorporado',f0(m.ov)+'%',st3(m.ov>=P.ov[0]&&m.ov<=P.ov[1]&&bubbleStable,bubbleStable)],
  ['Rede estabilizante',m.hydro>.02?f2(m.hydro)+'%':'ausente',st3(m.hydro>=P.stab[0]&&!o.netExcess,m.hydro>0||st.tipo==='gastro')],
  ['Lactose',m.lac>0?f1(m.lacW)+'% da água':'sem lactose',st3(m.lacW<=9&&o.nLac===0,m.lacW<=10.5)]
 ];
 return o;
}

/* ===================== CREATOR — MODELO DA REDE DO NEUTRO ===================== */
const NSTYLE={starch:{col:'#fde68a',glob:1},konj:{col:'#38bdf8',seg:12,L:11,w:2.4,branch:1},lbg:{col:'#7dd3fc',seg:11,L:11,w:2},guar:{col:'#6ee7b7',seg:11,L:11,w:2,branch:1},tara:{col:'#5eead4',seg:9,L:11,w:2,branch:.5},xan:{col:'#f6c90e',seg:8,L:12,w:2.6,stiff:1},carr:{col:'#a78bfa',seg:5,L:10,w:1.6,helix:2},cmc:{col:'#f472b6',seg:8,L:11,w:2},pect:{col:'#fb923c',seg:6,L:10,w:2},citf:{col:'#a3e635',seg:6,L:9,w:1.4,fiber:1},gel:{col:'#fda4af',seg:7,L:10,w:1.4,helix:3},acacia:{col:'#e2e8f0',glob:1},inu:{col:'#cbd5e1',glob:1},lec:{col:'#fbbf24',surf:1},mono:{col:'#fbbf24',surf:1}};
function neutroModel(E,pastT,prIn){
 const pr=Object.assign({},PROC0,prIn||(typeof S!=='undefined'&&S&&S.proc)||{},{pastT:+pastT});
 const b=analyzeBlend(E,E.dairy);const comps=[];const keys={};for(const k in b.eff)if(NCOMP[k]&&NCOMP[k].dose&&b.eff[k]>0)keys[k]=b.eff[k];
 const hy=Object.keys(keys).length?hydRun(keys,pr):null;const hOf=k=>hy&&hy.h[k]!=null?hy.h[k]:1;
 for(const k in b.eff){const nc=NCOMP[k];if(!nc||!nc.dose)continue;const mid=(nc.dose[0]+nc.dose[1])/2;const load=b.eff[k]/mid;
  const n=NSTYLE[k]&&(NSTYLE[k].glob||NSTYLE[k].surf)?Math.round(clamp(load*5,0,14)):Math.round(clamp(load*3.2,0,9));
  if(n>0)comps.push({k,n,h:hOf(k),hydrated:hOf(k)>=.9,load});}
 const has=k=>(b.eff[k]||0)>0;
 const galacto=has('lbg')||has('guar')||has('tara');
 const floc=E.dairy&&galacto&&!has('carr')&&!(has('citf')&&b.eff.citf>.1)&&!has('cmc');
 const hydFrac=comps.length?comps.reduce((a,c)=>a+c.load*c.h,0)/comps.reduce((a,c)=>a+c.load,0):0;
 const bound=clamp(((b.P.visc+b.P.anti)/2/100)*hydFrac*1.05,0,.95);
 const excess=b.hydro>.7||(b.eff.xan||0)>.18;const weak=b.hydro<.15;
 const iceD=Math.round(18+(1-bound)*60);
 const unhyd=comps.filter(c=>!c.hydrated).map(c=>NCOMP[c.k].n);
 const warn=b.notes.filter(n=>n.sev==='warn').length;
 const inRange=NFUN.filter(([k])=>k!=='emul'&&k!=='siner').every(([k])=>b.P[k]>=50&&b.P[k]<=88);
 const perfect=!warn&&!floc&&!excess&&!weak&&!unhyd.length&&inRange;
 const st3=(ok,w)=>ok?'ok':w?'warn':'crit';
 const pills=[
  ['Água imobilizada',f0(bound*100)+'%',st3(bound>=.5&&bound<=.85,bound>=.35)],
  ['Cristais previstos','≈'+iceD+' µm',st3(iceD<=42,iceD<=SENS_D)],
  ['Hidrocoloides',f2(b.hydro)+'% da mistura',st3(!excess&&!weak,b.hydro>.1)],
  ['Hidratação',f0(hydFrac*100)+'% '+(unhyd.length?'· incompleta a '+pastT+' °C':'· completa a '+pastT+' °C'),st3(!unhyd.length,hydFrac>=.75)],
  ['Caseínas',E.dairy?(floc?'floculando':'dispersas'):'sem leite',E.dairy?st3(!floc,true):'ok'],
  ['Emulsificação','índice '+b.P.emul,st3(b.P.emul>=20||!E.dairy,true)]
 ];
 return{b,comps,floc,bound,excess,weak,iceD,unhyd,perfect,pills,hydFrac,hy};
}

/* ===================== MOTOR DE PARTÍCULAS ===================== */
const COL={ice:'#7dd3fc',air:'#e6ecf4',fat:'#f6c90e',prot:'#6ee7b7',lac:'#ffffff',net:'#a78bfa',ok:'#6ee7b7',warn:'#fbbf24',crit:'#fb7185',bg:'#0a1220'};
const rnd=(a,b)=>a+Math.random()*(b-a);
class SimBase{
 constructor(){this.cv=document.createElement('canvas');this.cv.className='simcv';this.cv.setAttribute('role','img');this.cx=this.cv.getContext('2d');this.W=640;this.H=420;this.t=0;this.running=false;this.rings=[];this.reduce=!!(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches);
  if('ResizeObserver' in window){this.ro=new ResizeObserver(()=>this.resize());this.ro.observe(this.cv);}}
 resize(){const r=this.cv.getBoundingClientRect();if(!r.width)return;const dpr=Math.min(2,window.devicePixelRatio||1);const w=r.width,h=Math.round(clamp(w*.66,280,470));
  if(this.cv.style.height!==h+'px')this.cv.style.height=h+'px';
  if(Math.abs(this.W-w)>1||Math.abs(this.H-h)>1||this.cv.width!==Math.round(w*dpr)){const sx=w/this.W,sy=h/this.H;this.scalePts(sx,sy);this.W=w;this.H=h;this.cv.width=Math.round(w*dpr);this.cv.height=Math.round(h*dpr);this.cx.setTransform(dpr,0,0,dpr,0,0);this.onResize&&this.onResize();}}
 mount(host){if(!host)return;if(this.cv.parentNode!==host)host.appendChild(this.cv);this.resize();if(!this.running){this.running=true;this.last=performance.now();requestAnimationFrame(t=>this.loop(t));}}
 loop(t){if(!this.cv.isConnected){this.running=false;return;}const dt=Math.min(.05,Math.max(0,(t-this.last)/1000));this.last=t;this.t+=dt;this.step(this.reduce?dt*.35:dt);this.draw();requestAnimationFrame(x=>this.loop(x));}
 ring(x,y,col){this.rings.push({x,y,r:4,a:.9,col});}
 drawRings(c,dt){this.rings=this.rings.filter(r=>r.a>.03);this.rings.forEach(r=>{r.r+=60*dt;r.a*=.94;c.strokeStyle=r.col;c.globalAlpha=r.a;c.lineWidth=1.5;c.beginPath();c.arc(r.x,r.y,r.r,0,7);c.stroke();});c.globalAlpha=1;}
 label(c,x,y,txt,col){c.font='500 11px "DM Mono",ui-monospace,monospace';const w=c.measureText(txt).width+12;let lx=clamp(x+14,4,this.W-w-4),ly=clamp(y-22,4,this.H-22);
  c.strokeStyle=col;c.lineWidth=1;c.beginPath();c.moveTo(x,y);c.lineTo(lx,ly+9);c.stroke();c.fillStyle='rgba(8,12,20,.88)';c.fillRect(lx,ly,w,18);c.strokeRect(lx,ly,w,18);c.fillStyle=col;c.fillText(txt,lx+6,ly+13);}
 frame(c,perfect,imb){const t=this.t;if(perfect){const a=.35+.25*Math.sin(t*1.6);c.strokeStyle=`rgba(110,231,183,${a})`;c.lineWidth=3;c.strokeRect(1.5,1.5,this.W-3,this.H-3);}
  else if(imb>.6){const a=.15+.15*Math.sin(t*5);c.strokeStyle=`rgba(251,113,133,${a})`;c.lineWidth=3;c.strokeRect(1.5,1.5,this.W-3,this.H-3);}}
}
/* ---------- gelato ---------- */
class GelSim extends SimBase{
 constructor(){super();this.P=[];this.p=null;this.cv.setAttribute('aria-label','Microestrutura simulada do gelato');}
 scalePts(sx,sy){this.P.forEach(q=>{q.x*=sx;q.y*=sy;});}
 get ppu(){return this.W/FIELD_UM;}
 set(p){if(!p){this.p=null;this.P=[];return;}const first=!this.p;this.p=p;this.reconcile(first);}
 onResize(){if(this.p)this.reconcile(false);}
 reconcile(first){const p=this.p,A=this.W*this.H,u=this.ppu;
  const rIce=Math.max(3,p.d/2*u*.92),rAir=p.airD/2*u*.9;
  const want={ice:Math.round(clamp(p.phiIce*A/(Math.PI*rIce*rIce),0,70)),air:Math.round(clamp(p.phiAir*A/(Math.PI*rAir*rAir),0,40)),fat:p.nFat,prot:p.nProt,lac:Math.min(40,p.nLac)};
  for(const ty in want){const alive=this.P.filter(q=>q.ty===ty&&!q.dying);const n=want[ty];
   for(let i=alive.length;i<n;i++)this.spawn(ty,first);for(let i=n;i<alive.length;i++)alive[alive.length-1-(i-n)].dying=1;}
  this.P.forEach(q=>{if(q.ty==='ice')q.tr=rIce*(.7+q.v*.6);else if(q.ty==='air')q.tr=rAir*(.8+q.v*.4);else if(q.ty==='fat')q.tr=p.butter&&q.v<.35?3.6+q.v*6:1.9;else if(q.ty==='prot')q.tr=1.2;else q.tr=7+q.v*6;});
  const airs=this.P.filter(q=>q.ty==='air'&&!q.dying);this.P.filter(q=>q.ty==='fat').forEach((q,i)=>{q.anchor=airs.length&&q.v<p.destab?airs[i%airs.length]:null;});
  this.P.filter(q=>q.ty==='prot').forEach((q,i)=>{q.anchor=airs.length?airs[i%airs.length]:null;});}
 spawn(ty,inside){let x,y,vx=0,vy=0;if(!inside&&ty==='ice'&&this.p&&this.p.stage==='mant'){x=3;y=rnd(0,this.H);vx=rnd(60,120);this.ring(4,y,COL.ice);}else if(inside){x=rnd(0,this.W);y=rnd(0,this.H);}else{const s=Math.floor(Math.random()*4);x=s===0?-10:s===1?this.W+10:rnd(0,this.W);y=s===2?-10:s===3?this.H+10:rnd(0,this.H);const ang=Math.atan2(this.H/2-y,this.W/2-x);vx=Math.cos(ang)*rnd(40,90);vy=Math.sin(ang)*rnd(40,90);if(ty==='ice'||ty==='air'||ty==='lac')this.ring(clamp(x,0,this.W),clamp(y,0,this.H),ty==='lac'?COL.crit:ty==='ice'?COL.ice:COL.air);}
  const q={ty,x,y,vx,vy,r:inside?0:0,tr:3,a:0,v:Math.random(),rot:rnd(0,6.28),vr:rnd(-.3,.3),ph:rnd(0,6.28),pts:Array.from({length:9},()=>rnd(.82,1.12))};this.P.push(q);return q;}
 step(dt){const p=this.p;if(!p)return;const amp=p.amp!=null?p.amp:.3;const agit=2+38*amp;const W=this.W,H=this.H;const sh=p.shear||0,cx=W/2,cy=H/2;this.ang=(this.ang||0)+sh*dt*1.4;
  const big=this.P.filter(q=>q.ty==='ice'||q.ty==='air');
  for(let i=0;i<big.length;i++){const a=big[i];for(let j=i+1;j<big.length;j++){const b=big[j];const dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy)||.01,min=(a.r+b.r)*(p.hard&&a.ty==='ice'&&b.ty==='ice'?.92:1.02);if(d<min){const f=(min-d)/d*.5;a.x-=dx*f*.5;a.y-=dy*f*.5;b.x+=dx*f*.5;b.y+=dy*f*.5;}}}
  const clumps=p.butter?this.P.filter(q=>q.ty==='fat'&&q.v<.35):[];
  this.P.forEach(q=>{
   q.a+=((q.dying?0:1)-q.a)*Math.min(1,dt*3);q.r+=(q.tr*(q.dying?.3:1)-q.r)*Math.min(1,dt*2.2);
   if(q.anchor&&!q.anchor.dying&&q.anchor.a>.2){q.ph+=dt*(.25+q.v*.3);const R=q.anchor.r+(q.ty==='prot'?1:2.5);const tx=q.anchor.x+Math.cos(q.ph+q.v*9)*R,ty=q.anchor.y+Math.sin(q.ph+q.v*9)*R;q.x+=(tx-q.x)*Math.min(1,dt*4);q.y+=(ty-q.y)*Math.min(1,dt*4);return;}
   /* Stokes-Einstein: difusão ∝ T/(η·r) — partículas grandes e fase viscosa se movem menos */

function phaseMap(m,p){const P=m.P,W=300,H=190,L=34,R=10,T=10,B=26;const x0=50,x1=90,y0=P.sol[0]-8,y1=P.sol[1]+8;const sx=v=>L+(clamp(v,x0,x1)-x0)/(x1-x0)*(W-L-R),sy=v=>T+(1-(clamp(v,y0,y1)-y0)/(y1-y0))*(H-T-B);
 U.trail=U.trail||[];const last=U.trail[U.trail.length-1];if(!last||Math.abs(last[0]-m.fzVit)>.05||Math.abs(last[1]-m.sol)>.05){U.trail.push([m.fzVit,m.sol]);if(U.trail.length>10)U.trail.shift();}
 let g=`<rect x="${sx(P.fz[0])}" y="${sy(P.sol[1])}" width="${sx(P.fz[1])-sx(P.fz[0])}" height="${sy(P.sol[0])-sy(P.sol[1])}" fill="rgba(110,231,183,.14)" stroke="rgba(110,231,183,.5)" stroke-dasharray="3 3"/>`;
 for(let v=50;v<=90;v+=10)g+=`<text x="${sx(v)}" y="${H-8}" text-anchor="middle" fill="var(--t3)" font-size="9.5">${v}%</text>`;
 [y0,(y0+y1)/2,y1].forEach(v=>g+=`<text x="${L-5}" y="${sy(v)+3}" text-anchor="end" fill="var(--t3)" font-size="9.5">${f0(v)}</text>`);
 g+=`<polyline points="${U.trail.map(t=>sx(t[0])+','+sy(t[1])).join(' ')}" fill="none" stroke="var(--t3)" stroke-width="1" stroke-dasharray="2 2"/>`;
 U.trail.slice(0,-1).forEach((t,i)=>g+=`<circle cx="${sx(t[0])}" cy="${sy(t[1])}" r="2" fill="var(--t3)" opacity="${.3+i*.06}"/>`);
 const col=p.perfect?'var(--ok)':p.imbalance>.6?'var(--crit)':'var(--warn)';g+=`<circle cx="${sx(m.fzVit)}" cy="${sy(m.sol)}" r="6" fill="${col}"><animate attributeName="r" values="5;8;5" dur="1.6s" repeatCount="indefinite"/></circle>`;
 return`<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto" role="img" aria-label="Mapa de equilíbrio: água congelada × sólidos">${g}<text x="${W-R}" y="${T+10}" text-anchor="end" fill="var(--t3)" font-size="9.5">sólidos ↑ · congelada →</text></svg>`;}

/* ==== 56-atelie.js ==== */
/* ===================== CREATOR · LABORATÓRIO (v17) =====================
   1. Processo: história térmica da calda até a boca, etapa por etapa, com a microestrutura calculada
      pelo motor em cada temperatura (curva de congelamento, overrun, desestabilização da gordura,
      gordura sólida por SFC, cristal na saída e no endurecimento, mobilidade molecular por WLF).
   2. Cinética de hidratação dos hidrocoloides (temperatura × tempo, componente por componente).
   3. Ateliê criativo: harmonização por famílias de compostos aromáticos, explorador de variações
      balanceadas pelo motor e cartas de método criativo. */

/* ---------- 1. HIDRATAÇÃO: fração hidratada por temperatura e tempo ----------
   Gomas de hidratação a frio (guar, xantana, CMC, fibra de citros…) chegam perto de 100% em qualquer
   temperatura acima de ~15 °C, mais devagar no frio (Q10 ≈ 2). As de hidratação a quente (jataí, tara,
   carragena, pectina, amido, gelatina, konjac) têm uma fração solúvel a frio (c0) e o restante só
   dissolve perto da sua temperatura (curva logística). Hidratação não volta atrás ao resfriar. */
const HYD_C0={lbg:.25,tara:.45,carr:.3,pect:.35,gel:.15,starch:0,konj:.55,mono:.1};
function hydMax(k,T){const nc=NCOMP[k];if(!nc)return 1;const Th=nc.hyd;if(Th<=20)return clamp(.9+.1*T/20,.85,1);
 const c0=HYD_C0[k]!=null?HYD_C0[k]:.2;return c0+(1-c0)/(1+Math.exp(-(T-(Th-8))/2.5));}
function hydTau(k,T){const nc=NCOMP[k];const Th=nc?Math.max(20,nc.hyd):20;const t90=(Th<=20?600:90)*Math.pow(2,(Th-T)/10);return clamp(t90,20,6*3600)/Math.LN10;}
const holdS=pr=>Math.max(0,(+pr.pastHold||0)*(pr.pastHoldU==='min'?60:1));
/* simula aquecimento (2 °C/min a partir de 25 °C), patamar, resfriamento e maturação */
function hydRun(keys,prIn){const pr=Object.assign({},PROC0,prIn||{});
 const past=+pr.pastT,matT=+pr.matT,T0=25;const ramp=past>T0?(past-T0)/2*60:0,cool=Math.max(0,+pr.coolMin||0)*60,mat=Math.max(0,+pr.matH||0)*3600;
 const ph=[{n:'Aquecimento',d:ramp,T:f=>T0+(past-T0)*f},{n:'Patamar',d:holdS(pr),T:()=>past},{n:'Resfriamento',d:cool,T:f=>matT+(past-matT)*Math.exp(-4*f)},{n:'Maturação',d:mat,T:()=>matT}];
 const h={};for(const k in keys)h[k]=0;const samp=[{i:0,f:0,T:T0,h:{...h}}];const ends=[];
 ph.forEach((p,i)=>{const N=24;for(let s=1;s<=N;s++){const f=s/N,T=p.T(f),dt=p.d/N;
   for(const k in h){const hm=hydMax(k,T);if(hm>h[k]&&dt>0)h[k]+=(hm-h[k])*(1-Math.exp(-dt/hydTau(k,T)));}
   samp.push({i,f,T,h:{...h}});}ends.push({...h});});
 let w=0,hw=0;for(const k in keys){w+=keys[k];hw+=keys[k]*h[k];}
 return{h,samp,ph,ends,frac:w?hw/w:1,ramp,past};}
/* menor temperatura de pasteurização (no patamar atual) que hidrata ≥ 95% de cada componente */
function hydMinT(keys,pr){for(let T=40;T<=95;T++){const r=hydRun(keys,{...pr,pastT:T});if(Object.values(r.h).every(x=>x>=.95))return T;}return null;}
/* componentes de estabilização de uma receita (pela chave do ingrediente ou pelo blend) */
const NEUTRO_STD={lbg:.5,guar:.35,carr:.15};
function recipeHydKeys(st){const o={};const add=(k,w)=>{if(NCOMP[k]&&NCOMP[k].dose&&w>0)o[k]=(o[k]||0)+w;};
 (st.recipe||[]).forEach(r=>{const i=ING_BY[r.id];if(!i||!(+r.g>0))return;
  if(i.blend&&i.blend.parts){const sh=blendShares(i.blend.parts);for(const k in sh)add(k,+r.g*sh[k]/100);}
  else if(i.key==='neutro'){const f=i.id==='neutrod'?.5:1;for(const k in NEUTRO_STD)add(k,+r.g*f*NEUTRO_STD[k]);}

const aDose=i=>ADOSE_ID[i.id]||ADOSE_CAT[i.cat]||30;
/* perfil aromático da receita: soma ponderada por massa × impacto, com compressão psicofísica (log) */
function aromaProfile(recipe,flavorOnly){const raw=AFAM.map(()=>0);let any=0;
 const use=(recipe||[]).filter(r=>!flavorOnly||!ABASE.has(r.id));const L=use.some(r=>AROMA[r.id]&&aImp(ING_BY[r.id]||{})>0)?use:(recipe||[]);
 L.forEach(r=>{const i=ING_BY[r.id],v=AROMA[r.id];if(!i||!v||!(+r.g>0))return;const w=+r.g*aImp(i);v.forEach((x,k)=>{raw[k]+=x*w;});any+=w;});
 if(!any)return null;const tot=(recipe||[]).reduce((a,r)=>a+(+r.g||0),0)||1;const p=raw.map(x=>Math.pow(x/tot,.6)); /* lei de Stevens (expoente ≈ 0,6 para odor) */const mx=Math.max(...p)||1;return p.map(x=>x/mx);}
const vNorm=v=>{const n=Math.hypot(...v)||1;return v.map(x=>x/n);};

/* gosto básico (não aroma): ácido, amargo, salgado, gordura, doce — o equilíbrio que o chef busca */
const ABITTER={cacau:1,cacau10:.8,massacacau:1,choc80:.9,choc70:.75,choc64:.6,choc55:.45,espresso:1,cafesol:1,extratocafe:1,matcha:.8,pompelmo:.7,tonica:.8,cerveja:.7,alhonegro:.3,balsamico:.2,azeite:.3,ervas:.3,especiaria:.4,cristal:.3};
function tasteOf(i){const c=i.c||{};const sug=(c.suc||0)+(c.glu||0)+(c.fru||0)+(c.lac||0)+(c.gs||0)*.5;return[clamp((c.acd||0)/3,0,1),ABITTER[i.id]||0,clamp((c.salt||0)/1.5,0,1),clamp((c.fat||0)/40,0,1),clamp(sug/60,0,1)];}
function recipeTaste(recipe){const tot=(recipe||[]).reduce((a,r)=>a+(+r.g||0),0)||1;const t=[0,0,0,0,0];
 (recipe||[]).forEach(r=>{const i=ING_BY[r.id];if(!i)return;const c=i.c||{},g=+r.g/tot;t[0]+=g*(c.acd||0);t[1]+=g*(ABITTER[r.id]||0);t[2]+=g*(c.salt||0);t[3]+=g*(c.fat||0);t[4]+=g*((c.suc||0)+(c.glu||0)+(c.fru||0)+(c.lac||0)+(c.gs||0)*.5+(c.alu||0)*.7+(c.ery||0)*.7);});
 return[clamp(t[0]/.8,0,1),clamp(t[1]/.06,0,1),clamp(t[2]/.3,0,1),clamp(t[3]/12,0,1),clamp(t[4]/20,0,1)];}
/* complemento de gosto: ácido corta gordura e doce, gordura arredonda ácido e amargo, sal levanta doce e gordura */
function tasteComp(c,R){return clamp(Math.max(c[0]*((R[3]+R[4])/2)*(1-R[0]),c[3]*Math.max(R[0],R[1]),c[2]*((R[4]+R[3])/2)*(1-R[2])*1.2,c[1]*R[4]*(1-R[1])*.9,c[4]*Math.max(R[0],R[1])*.6),0,1);}
/* ingredientes quase iguais contam uma vez por lista (o chef quer caminhos diferentes, não 4 chocolates) */
const AGRP={};[['cacau','cacau10','massacacau','choc80','choc70','choc64','choc55'],['espresso','cafesol','extratocafe'],['limao','lima'],['tangerina','tangerinaconc'],['laranja','sanguinea'],['pistache','pistachea'],['iogurte','grego','iogurte0'],['cococreme','cocoleite','cocopure','cocoralado'],['vinhodoce','eiswein','vinsanto'],['gorgonzola','roquefort'],['maca','macasuco'],['mascavo','demerara','garapa'],['amendoim','tahine'],['gema','gemap'],['creamcheese','cremefr','mascarpone'],['frutaliof','framboesa']].forEach(g=>g.forEach(id=>AGRP[id]=g[0]));
const ACAT_W={'Açúcares':.8,'Bebidas e aromas':.95};
/* acentos de gosto: entram pelo gosto básico, mesmo sem ponte aromática (sal no caramelo, ácido no creme) */
const AACC=['sal','citrico','balsamico','limao','especiaria','ervas','cacau','espresso','pompelmo','cristal','iogurte','tonica'];
/* ---------- TRADIÇÃO + ANALOGIA ----------
   Grafo de combinações consagradas (PAIRS, simétrico). Ingrediente fora do grafo herda as combinações do
   vizinho aromático mais parecido (analogia: tangerina ≈ laranja → combina com chocolate). */
let _PG=null;
function pairGraph(){if(_PG)return _PG;const G={};const add=(a,b,lab)=>{if(!a||!b||a===b)return;(G[a]=G[a]||{})[b]=1;};
 for(const a in PAIRS)PAIRS[a].forEach(([b])=>{if(b){add(a,b);add(b,a);}});
 for(const id in AGRP){const g=AGRP[id];if(G[g]&&!G[id])G[id]=Object.assign({},G[g]);if(G[id]&&!G[g])G[g]=Object.assign({},G[id]);}
 _PG=G;return G;}
function tradScores(recipe){const G=pairGraph();const flav=(recipe||[]).filter(r=>AROMA[r.id]&&!ABASE.has(r.id)&&ING_BY[r.id]&&aImp(ING_BY[r.id])>=.5);const out={};
 flav.forEach(r=>{const x=r.id;let srcs=[];if(G[x])srcs.push([x,1]);
  else{const vx=AROMA[x];const cand=Object.keys(G).filter(a=>AROMA[a]&&a!==x).map(a=>[a,vCos(vx,AROMA[a])*(ING_BY[a]&&ING_BY[x]&&ING_BY[a].cat===ING_BY[x].cat?1:.85)]).sort((p,q)=>q[1]-p[1]).slice(0,2).filter(p=>p[1]>=.75);srcs=cand;}
  srcs.forEach(([a,w])=>{for(const c in G[a]){const sc=w;if(!out[c]||out[c].s<sc)out[c]={s:sc,from:x,via:a===x?null:a};}});});
 return out;}
function aromaPairs(recipe,limit){const R=aromaProfile(recipe,true);if(!R)return null;const inRec=new Set((recipe||[]).map(r=>r.id));const lim=limit||6;const RT=recipeTaste(recipe);
 const fam=v=>v.map((x,k)=>[x,k]);const out=[];const grpIn=new Set([...inRec].map(id=>AGRP[id]).filter(Boolean));
 for(const id in AROMA){if(inRec.has(id)||!ING_BY[id]||ABASE.has(id)||(AGRP[id]&&grpIn.has(AGRP[id])))continue;const v=AROMA[id];const c=v.map(x=>x/3);const cs=c.reduce((a,b)=>a+b,0)||1;
  const cos=vCos(R,c),ov=c.reduce((a,x,k)=>a+Math.min(x,R[k]),0)/cs;const w=ACAT_W[ING_BY[id].cat]||1;const sim=(.55*cos+.45*ov)*w;
  const shared=fam(c).filter(([x,k])=>x>=.33&&R[k]>=.3).sort((a,b)=>b[0]*R[b[1]]-a[0]*R[a[1]]).map(([,k])=>k);
  const fresh=fam(c).filter(([x,k])=>x>=.6&&R[k]<.5).sort((a,b)=>(b[0]-R[b[1]])-(a[0]-R[a[1]])).map(([,k])=>k);
  const lift=c.reduce((a,x,k)=>a+Math.max(0,x-R[k]),0)/cs;
  const bridge=shared.length?Math.max(...shared.map(k=>Math.min(c[k],R[k]))):0;const comp=tasteComp(tasteOf(ING_BY[id]),RT);
  const contrast=bridge>=.25&&fresh.length?(bridge*.45+lift*.35+comp*.2)*w:0;
  out.push({id,sim,shared,fresh,bridge,comp,contrast});}
 const div=(L,cap)=>{const c={},g=new Set(),r=[];for(const x of L){const k=ING_BY[x.id].cat,gr=AGRP[x.id]||x.id;if((c[k]||0)>=(cap||3)||g.has(gr))continue;c[k]=(c[k]||0)+1;g.add(gr);r.push(x);if(r.length>=lim)break;}return r;};
 const T=tradScores(recipe);const trad=div(Object.keys(T).filter(id=>ING_BY[id]&&!inRec.has(id)&&!ABASE.has(id)&&!(AGRP[id]&&grpIn.has(AGRP[id]))).map(id=>({id,...T[id]})).sort((a,b)=>b.s-a.s),5).map(x=>({...x,sim:x.s}));
 const inT=new Set(trad.map(x=>AGRP[x.id]||x.id));
 const harm=div(out.filter(x=>x.shared.length&&!inT.has(AGRP[x.id]||x.id)).sort((a,b)=>b.sim-a.sim));
 const cont=div(out.filter(x=>x.contrast>0&&!harm.includes(x)&&!inT.has(AGRP[x.id]||x.id)).sort((a,b)=>b.contrast-a.contrast));
 const acc=AACC.filter(id=>ING_BY[id]&&!inRec.has(id)&&!(AGRP[id]&&grpIn.has(AGRP[id]))).map(id=>({id,comp:tasteComp(tasteOf(ING_BY[id]),RT),taste:tasteOf(ING_BY[id])})).filter(x=>x.comp>=.3).sort((a,b)=>b.comp-a.comp).slice(0,4);
 return{R,RT,harm,cont,acc,trad};}
function aromaWheel(R,C){const S0=220,c=S0/2,r0=78;const n=AFAM.length;const pt=(k,v)=>{const a=-Math.PI/2+k/n*2*Math.PI;return[c+Math.cos(a)*r0*v,c+Math.sin(a)*r0*v];};
 let g='';[.33,.66,1].forEach(v=>{g+=`<polygon points="${AFAM.map((_,k)=>pt(k,v).map(x=>x.toFixed(1)).join(',')).join(' ')}" fill="none" stroke="var(--line)" stroke-width="1"/>`;});
 AFAM.forEach((f,k)=>{const[x,y]=pt(k,1.18);const[x2,y2]=pt(k,1);g+=`<line x1="${c}" y1="${c}" x2="${x2}" y2="${y2}" stroke="var(--line)"/><text x="${x}" y="${y+3}" text-anchor="middle" font-size="8.6" fill="${R&&R[k]>.5?'var(--t1)':'var(--t3)'}">${f[1].split(' · ')[0]}</text>`;});
 if(R)g+=`<polygon points="${R.map((v,k)=>pt(k,Math.max(.03,v)).map(x=>x.toFixed(1)).join(',')).join(' ')}" fill="rgba(125,211,252,.22)" stroke="var(--ice)" stroke-width="1.6"/>`;
 if(C)g+=`<polygon points="${C.map((v,k)=>pt(k,Math.max(.03,v)).map(x=>x.toFixed(1)).join(',')).join(' ')}" fill="rgba(251,146,60,.12)" stroke="#fb923c" stroke-width="1.6" stroke-dasharray="4 3"/>`;

/* ---------- BALANCEADOR DO LABORATÓRIO ----------
   Para o que o balanceador clássico não cobre (gastronômico salgado, sem açúcar, álcool alto, sólidos fora
   da faixa): escolhe as alavancas pelo tipo da receita e minimiza, no motor completo, o desvio de
   congelamento, doçura e sólidos + alertas estruturais, com a menor mudança possível na receita.
   Busca por padrões com passo adaptativo (movimentos simples e trocas entre pares). */
const LAB_POLY=['eritritol','alulose','xilitol','maltitol','sorbitol','inulina','fibramilho','fos'];
function labLevers(st){const rec=st.recipe||[];const has=id=>rec.some(r=>r.id===id);const tot=rec.reduce((a,r)=>a+(+r.g||0),0)||1;const L=[];
 const add=(id,kind,lo,hi,sc)=>{if(ING_BY[id]&&!L.some(l=>l.id===id))L.push({id,kind,lo:lo||0,hi:hi!=null?hi:tot*.45,sc:sc||1});};
 const dairy=rec.some(r=>ING_BY[r.id]&&ING_BY[r.id].cat==='Lácteos');
 if(st.tipo==='semacucar'){['eritritol','alulose','fibramilho'].forEach(id=>add(id,'sug'));rec.forEach(r=>{if(LAB_POLY.includes(r.id))add(r.id,'sug');});add(has('stevia')?'stevia':'sucralose','hi',0,tot*.0006,.004);}

 else{add('sacarose','sug');add(dexPref(st),'sug');add('glicose38','sug');}
 rec.forEach(r=>{if(BAL_SUG.has(r.id)&&st.tipo!=='semacucar')add(r.id,'sug');});
 if(dairy&&st.tipo!=='vegan')add('lpd','sol',0,tot*.08);else if(st.tipo!=='semacucar')add('malto','sol',0,tot*.12);
 rec.forEach(r=>{const i=ING_BY[r.id];if(i&&(i.c.alc||0)>0)add(r.id,'alc',+r.g*.55,+r.g);});
 const BASEL=['agua','leite','leite15','leite0','aveia','amendoab','soja','arrozb','cocoleite','aguacoco'];const liq=rec.filter(r=>{const i=ING_BY[r.id];return i&&!L.some(l=>l.id===r.id)&&(i.c.w||0)>=85&&!(i.c.alc>0);}).sort((a,b)=>(BASEL.includes(b.id)-BASEL.includes(a.id))||b.g-a.g)[0];

 /* teto de custo: o creme (o lácteo mais caro por kg) pode ceder até 25% para o leite, dentro da faixa de gordura */
 if(+st.costCap>0){const cr=rec.filter(r=>/^creme(20|35|40|45)$/.test(r.id)).sort((a,b)=>b.g-a.g)[0];if(cr&&L.length<8)L.splice(Math.min(L.length,7),0,{id:cr.id,kind:'fat',lo:+cr.g*.75,hi:+cr.g,sc:1});}

function labLoss(m,F,x0,x,tot,L){const P=m.P;const d=(v,r)=>v<r[0]?r[0]-v:v>r[1]?v-r[1]:0;const mid=r=>(r[0]+r[1])/2;
 let l=Math.pow((m.fzVit-m.fzMid)/1.2,2)+1.6*Math.pow(d(m.pod,P.pod),2)+.25*Math.pow((m.pod-mid(P.pod))/(P.pod[1]-P.pod[0]||1),2)+Math.pow(d(m.sol,P.sol)/1.2,2);
 F.forEach(f=>{if(f.sev==='crit')l+=25;else if(f.sev==='warn'&&['Térmico','Doçura','Sólidos','Lactose'].includes(f.area))l+=2.5;});
 L.forEach((v,i)=>{const dx=Math.abs(x[i]-x0[i])/tot*100;l+=dx*(v.kind==='liq'?.35:v.kind==='alc'?.6:v.kind==='sol'?.25:v.kind==='salt'?1.5:v.kind==='hi'?40:v.kind==='fat'?.3:.08);if(v.kind==='fat')l+=4*Math.pow(d(m.fat,P.fat),2);if(x0[i]>0&&x[i]<.3&&v.kind!=='liq')l+=4;});

function balanceLab(st,maxE){maxE=maxE||900;const rec=(st.recipe||[]).filter(r=>ING_BY[r.id]&&+r.g>0);if(rec.length<2)return{ok:false,msg:'Monte a receita primeiro.'};
 const L=labLevers(st);const tot=rec.reduce((a,r)=>a+ +r.g,0);const ids=new Set(L.map(l=>l.id));const base=rec.filter(r=>!ids.has(r.id));

 const build=x=>base.concat(L.map((l,i)=>({id:l.id,g:l.sc<.05?Math.round(x[i]*1000)/1000:Math.round(x[i]*10)/10})).filter((r,i)=>r.g>=(L[i]&&L[i].sc<1?.001:.3)));
 /* na busca, o modo pote vira vitrine na mesma temperatura (mesmo congelamento; sem as simulações térmicas do pote, que não mudam com os açúcares) */
 const stF=st.proc&&(st.proc.serveFrom==='pote'||st.proc.hardAuto)?{...st,proc:{...st.proc,serveFrom:'vitrine',hardAuto:0}}:st;
 let evals=0;const f=x=>{evals++;const s2={...stF,recipe:build(x)};const m=analyze(s2);if(m.empty)return 1e9;const cap=+st.costCap||0;return labLoss(m,diagnose(s2,m),x0,x,tot,L)+(cap>0&&m.costKg>cap?Math.pow((m.costKg-cap)/cap*80,2):0);};

  if(!imp)for(let i=0;i<L.length;i++)for(let j=0;j<L.length;j++){if(i===j)continue;const y=x.slice();y[i]=clamp(y[i]+step*L[i].sc,L[i].lo,L[i].hi);y[j]=clamp(y[j]-step*L[j].sc,L[j].lo,L[j].hi);const v=f(y);if(v<best-1e-6){best=v;x=y;imp=true;}}
  if(!imp)step/=2;}
 /* limpeza: resíduos de alavanca (< 0,3% do lote) somem se não pioram a receita */
 L.forEach((l,i)=>{if(x[i]>0&&x[i]<tot*.003&&l.lo===0&&l.sc>=.05){const y=x.slice();y[i]=0;const v=f(y);if(v<=best+.3){x=y;best=Math.min(best,v);}}});
 const newRecipe=build(x);const m1=analyze({...st,recipe:newRecipe});const F1=diagnose({...st,recipe:newRecipe},m1);
 const prop=L.map((l,i)=>({id:l.id,g:x[i]})).filter((p,i)=>Math.abs(x[i]-x0[i])>=.3);const cur=prop.map(p=>x0[L.findIndex(l=>l.id===p.id)]);

 return{ok:best<l0-.05,mode:'lab',lab:1,prop,cur,newRecipe,m1,loss:best,loss0:l0,evals,crit:F1.filter(q=>q.sev==='crit').length,msg:best<l0-.05?'':'Nenhuma combinação melhora a receita.'};}
/* Testar um sabor do ateliê como um gelatiere faria: o sabor entra na dose sugerida; se for líquido (café, suco, infusão),
   ocupa o lugar da mesma quantidade de água do líquido-base (água, leite…), para não diluir gordura e sólidos;
   depois o balanceador completo acerta açúcares e sólidos, e o lote volta ao peso original. */
const AT_LIQ=['agua','leite','leite15','leite0','aveia','amendoab','soja','arrozb','cocoleite','aguacoco'];
function atAddBalanced(st,id){const i=ING_BY[id];if(!i)return null;const orig=st.recipe||[];const rec=orig.map(r=>({...r}));const T0=rec.reduce((a,r)=>a+(+r.g||0),0)||1000;
 const g=Math.round(aDose(i)*T0/1000*10)/10;const ex=rec.find(r=>r.id===id);if(ex)ex.g=Math.round((+ex.g+g)*10)/10;else rec.push({id,g});const wI=(i.c.w||0)/100;let swap=false;
 if(wI>=.6&&!(i.c.alc>0)){const car=rec.filter(r=>r.id!==id&&AT_LIQ.includes(r.id)).sort((a,b)=>AT_LIQ.indexOf(a.id)-AT_LIQ.indexOf(b.id))[0];
  if(car){const wC=(ING_BY[car.id].c.w||0)/100||1;const d=Math.min(+car.g*.5,g*wI/wC);if(d>=.5){car.g=Math.round((+car.g-d)*10)/10;swap=true;}}}
 let out=rec,bal=null;try{const b=balanceBest({...st,recipe:rec});if(b&&b.ok){out=b.newRecipe;bal=true;}else bal=(b&&b.msg)||'nenhum ajuste melhora';}catch(e){bal='não foi possível calcular';}
 const T1=out.reduce((a,r)=>a+(+r.g||0),0);if(T1>0&&Math.abs(T1-T0)>.5){const k=T0/T1;out=out.map(r=>({...r,g:Math.round(+r.g*k*10)/10}));}
 const gO=(R,x)=>{const q=R.find(r=>r.id===x);return q?+q.g:0;};const nm2=x=>ING_BY[x].n.split(' (')[0].replace(/ \d.*$/,'').toLowerCase();
 const ch=[...new Set([...orig,...out].map(r=>r.id))].filter(x=>x!==id&&Math.abs(gO(orig,x)-gO(out,x))>=.5).sort((x,y)=>Math.abs(gO(out,y)-gO(orig,y))-Math.abs(gO(out,x)-gO(orig,x)));
 const msg=i.n+' +'+fT(Math.round(gO(out,id)-gO(orig,id)))+' g'+(ch.length?' · '+ch.slice(0,4).map(x=>nm2(x)+' '+(gO(out,x)>gO(orig,x)?'+':'−')+fT(Math.round(Math.abs(gO(out,x)-gO(orig,x))))+' g').join(', '):'')+
  (bal===true?' · rebalanceada':' · sem rebalanceamento ('+bal+')')+', lote mantido em '+fT(Math.round(T0))+' g';
 return{recipe:out,msg,swap,balanced:bal===true};}
/* índice contínuo para comparar criações finas (o índice oficial satura em 100) */
function fineScore(st,m,F){if(m.empty)return 0;const sc=score(st,m,F);let q=sc.parts.reduce((s,p)=>s+p[1]*p[2],0);const crit=F.filter(f=>f.sev==='crit').length;if(crit)q=Math.min(q,62-crit*4);
 q-=Math.abs(m.fzVit-m.fzMid)*.25+Math.max(0,m.crystal-30)*.12+Math.max(0,7-Math.min(m.shelfVit,30))*.25+F.filter(f=>f.sev==='warn').length*.6;return Math.round(q*10)/10;}
/* o melhor entre o balanceador clássico e o do laboratório (pelo índice contínuo) */
function balanceBest(st,maxE){const pote=st.proc&&st.proc.serveFrom==='pote';let a=null;try{a=pote?balancePote(st):balance(st);}catch(e){a=null;}
 const ev=r=>{const s2=stReal({...st,recipe:r});const m=analyze(s2);return fineScore(s2,m,diagnose(s2,m));};
 const qa=a&&a.ok?ev(a.newRecipe):-1e9;
 const capOK=r=>!(+st.costCap>0)||(r&&r.length&&analyze(stReal({...st,recipe:r})).costKg<=+st.costCap*1.005);
 if(a&&a.ok&&qa>=90&&capOK(a.newRecipe))return a;
 let b=balanceLab(pote?{...st,vit:poteServeTemp(st)}:st,maxE);
 if(pote&&b.ok){const v=poteServeTemp({...st,recipe:b.newRecipe});const b2=balanceLab({...st,vit:v,recipe:b.newRecipe},maxE);if(b2.ok)b=b2;b.ok=true;}
 if(b.ok){const g=(R,id)=>{const r=(R||[]).find(q=>q.id===id);return r?+r.g:0;};const ids=[...new Set([...(st.recipe||[]),...b.newRecipe].map(r=>r.id))].filter(id=>Math.abs(g(st.recipe,id)-g(b.newRecipe,id))>=.3);
  b.prop=ids.map(id=>({id,g:g(b.newRecipe,id)}));b.cur=ids.map(id=>g(st.recipe,id));}
 if(b.ok){b.m1=analyze(stReal({...st,recipe:b.newRecipe}));const qb=ev(b.newRecipe);b.q=qb;
  const F1=diagnose(stReal({...st,recipe:b.newRecipe}),b.m1);const cr=F1.filter(f=>f.sev==='crit').length;
  b.note='Balanceador do laboratório'+(a&&!a.ok?' (o clássico não cobre este caso)':'')+': ajustou '+b.prop.map(p=>ING_BY[p.id].n.split(' (')[0].toLowerCase()).join(', ')+'.'+(cr?' Melhor compromisso possível; ainda resta '+cr+' alerta crítico — veja o laudo.':'');
  if(pote)b.poteVit=poteServeTemp({...st,recipe:b.newRecipe});
  if(qb>qa+.3||(+st.costCap>0&&!(a&&a.ok&&capOK(a.newRecipe))&&capOK(b.newRecipe)))return b;}
 return a&&a.ok?a:b.ok?b:(a||b);}


/* ---------- PERFIL SENSORIAL PREVISTO (0–100) ----------
   Traduz o motor em eixos de prova: doçura percebida na temperatura de serviço (a percepção cai ~1,5% por °C
   abaixo de −12), firmeza à colher (água congelada), cremosidade (gordura, sólidos e cristal), resistência ao
   derretimento, aroma liberado (volatilidade na temperatura), acidez e sal. É previsão: valide no Painel cego. */
const SENS_AX=[['doce','Doçura','Doçura percebida'],['firme','Firmeza','Firmeza à colher'],['creme','Cremosidade','Cremosidade'],['derr','Derretimento','Resistência ao derretimento'],['aroma','Aroma','Aroma liberado no frio'],['acido','Acidez','Acidez'],['sal','Salgado','Salgado']];
function sensProfile(m){if(!m||m.empty)return null;const v=+m.vit;
 return{doce:clamp(m.pod*(1+.015*(v+12))/30*100,0,100),firme:clamp((m.fzVit-58)/24*100,0,100),creme:clamp(m.fat*3.2+(m.sol-26)*2.6+(45-m.crystal)*1.3,0,100),
  derr:clamp(m.melt||0,0,100),aroma:clamp((m.aromaTemp||0)*100-(m.fzVit-70)*1.5,0,100),acido:clamp((m.acd||0)/1.4*100,0,100),sal:clamp((m.salt||0)/.8*100,0,100)};}
function sensRadar(a,b){const S0=230,c=S0/2,r0=80,n=SENS_AX.length;const pt=(k,v)=>{const g=-Math.PI/2+k/n*2*Math.PI;return[c+Math.cos(g)*r0*v,c+Math.sin(g)*r0*v];};
 let g='';[.25,.5,.75,1].forEach(v=>{g+=`<polygon points="${SENS_AX.map((_,k)=>pt(k,v).map(x=>x.toFixed(1)).join(',')).join(' ')}" fill="none" stroke="var(--line)"/>`;});
 SENS_AX.forEach(([k,n2],i)=>{const[x,y]=pt(i,1.2);g+=`<text x="${x}" y="${y+3}" text-anchor="middle" font-size="9" fill="var(--t2)">${n2}</text>`;});
 const poly=(p,st)=>`<polygon points="${SENS_AX.map(([k],i)=>pt(i,Math.max(.02,p[k]/100)).map(x=>x.toFixed(1)).join(',')).join(' ')}" ${st}/>`;
 if(a)g+=poly(a,'fill="rgba(125,211,252,.2)" stroke="var(--ice)" stroke-width="1.6"');if(b)g+=poly(b,'fill="rgba(251,146,60,.12)" stroke="#fb923c" stroke-width="1.6" stroke-dasharray="4 3"');
 return`<svg viewBox="-24 -8 ${S0+48} ${S0+16}" style="width:100%;max-width:300px;height:auto;display:block;margin:auto" role="img" aria-label="Perfil sensorial previsto">${g}</svg>`;}

/* ---------- 4. EXPLORADOR DE VARIAÇÕES ----------
   Gera variações por operadores de criação (troca de açúcares, gordura, proteína, laticínio fermentado,
   acento aromático, minimalismo, sal), balanceia cada uma no motor e avalia com o índice completo. */
function atRng(seed){let s=(seed>>>0)||1;return()=>{s=(s+0x6D2B79F5)>>>0;let t=s;t=Math.imul(t^(t>>>15),t|1);t^=t+Math.imul(t^(t>>>7),t|61);return((t^(t>>>14))>>>0)/4294967296;};}
const SUG_SWAP=['dextrose','trealose','invertido','mel','mascavo','glicose38','isomaltulose','alulose'];
function recShares(rec){const t=rec.reduce((a,r)=>a+(+r.g||0),0)||1;const o={};rec.forEach(r=>o[r.id]=(o[r.id]||0)+(+r.g||0)/t);return o;}
function novelty(a,b){const x=recShares(a),y=recShares(b);let d=0;new Set([...Object.keys(x),...Object.keys(y)]).forEach(k=>d+=Math.abs((x[k]||0)-(y[k]||0)));return d/2;}
function exploreGelato(st,n,seed){
 const R=(st.recipe||[]).filter(r=>ING_BY[r.id]&&+r.g>0).map(r=>({id:r.id,g:+r.g}));if(R.length<2)return null;
 const tot=R.reduce((a,r)=>a+r.g,0);const s0=stReal(st),m0=analyze(s0),F0=diagnose(s0,m0);const base0={sol:m0.sol,P:m0.P};
 const rnd=atRng(seed);const pick=a=>a[Math.floor(rnd()*a.length)];const nm=id=>ING_BY[id]?ING_BY[id].n.split(' (')[0]:id;
 const AP=aromaPairs(R,8);const accents=AP?[...AP.trad.slice(0,4).map(x=>[x.id,'consagrada']),...AP.harm.slice(0,3).map(x=>[x.id,'ponte']),...AP.cont.slice(0,3).map(x=>[x.id,'contraste']),...AP.acc.slice(0,2).map(x=>[x.id,'acento'])]:[];
 const find=(rec,f)=>rec.filter(r=>ING_BY[r.id]&&f(ING_BY[r.id],r));
 const ops=[
  rec=>{const s=find(rec,(i,r)=>r.id==='sacarose')[0]||find(rec,i=>i.cat==='Açúcares').sort((a,b)=>b.g-a.g)[0];if(!s)return null;const to=pick(SUG_SWAP.filter(x=>x!==s.id&&ING_BY[x]));const p=.25+rnd()*.25;const g=s.g*p;s.g-=g;const ex=rec.find(r=>r.id===to);if(ex)ex.g+=g;else rec.push({id:to,g});return f0(p*100)+'% da '+nm(s.id).toLowerCase()+' → '+nm(to).toLowerCase();},
  rec=>{const c=find(rec,i=>/^creme/.test(i.id))[0],l=find(rec,i=>/^leite/.test(i.id))[0];if(!c||!l)return null;const up=rnd()<.5;const d=c.g*(up?.3:.25);if(!up&&c.g-d<1)return null;c.g+=up?d:-d;l.g=Math.max(0,l.g+(up?-d:d));return'gordura '+(up?'+':'−')+' (creme '+(up?'+30':'−25')+'%)';},
  rec=>{const p=rec.find(r=>r.id==='lpd');if(p){const up=rnd()<.5;p.g*=up?1.35:.65;return'leite em pó '+(up?'+35':'−35')+'%';}if(!find(rec,i=>i.cat==='Lácteos').length)return null;rec.push({id:'lpd',g:tot*.02});return'+ leite em pó 2% (corpo)';},
  rec=>{const c=find(rec,i=>/^creme/.test(i.id))[0];if(!c)return null;const to=pick(['mascarpone','cremefr','grego','ricota','iogurte']);if(!ING_BY[to])return null;const g=c.g*.4;c.g-=g;const ex=rec.find(r=>r.id===to);if(ex)ex.g+=g;else rec.push({id:to,g});return'40% do creme → '+nm(to).toLowerCase();},
  rec=>{if(!accents.length)return null;const[id,kind]=pick(accents);if(rec.some(r=>r.id===id))return null;rec.push({id,g:aDose(ING_BY[id])*tot/1000});return'+ '+nm(id).toLowerCase()+' ('+kind+')';},
  rec=>{if(rec.length<=4)return null;const c=rec.filter(r=>{const i=ING_BY[r.id];return i&&!['Estabilizantes','Açúcares','Meus neutros'].includes(i.cat)&&!/^leite$|^agua$/.test(r.id)&&r.g<tot*.04;}).sort((a,b)=>a.g-b.g)[0];if(!c)return null;rec.splice(rec.indexOf(c),1);return'− '+nm(c.id).toLowerCase()+' (minimalismo)';},
  rec=>{if(rec.some(r=>r.id==='sal')||!ING_BY.sal)return null;rec.push({id:'sal',g:tot*.0015});return'+ sal 0,15% (realça o sabor)';},
  rec=>{const a=find(rec,i=>(i.c.alc||0)>0)[0];if(!a)return null;a.g*=.7;return nm(a.id).toLowerCase()+' −30% (álcool)';},
  rec=>{if(base0.sol<=base0.P.sol[1])return null;const w=find(rec,i=>(i.c.w||0)>=85&&!(i.c.alc>0)).sort((a,b)=>b.g-a.g)[0];if(!w)return null;w.g+=tot*.08;return nm(w.id).toLowerCase()+' +8% (sólidos altos)';},
  rec=>{if(base0.sol>=base0.P.sol[0])return null;const id=find(rec,i=>i.cat==='Lácteos').length&&st.tipo!=='vegan'?'lpd':'fibramilho';if(!ING_BY[id])return null;const ex=rec.find(r=>r.id===id);if(ex)ex.g+=tot*.03;else rec.push({id,g:tot*.03});return'+ '+nm(id).toLowerCase()+' 3% (sólidos baixos)';},
  rec=>{if(st.tipo==='sorbetto'||st.tipo==='vegan')return null;const id=pick(['gema','mascarpone','creamcheese']);if(!ING_BY[id]||rec.some(r=>r.id===id))return null;rec.push({id,g:tot*(id==='gema'?.04:.06)});return'+ '+nm(id).toLowerCase()+' (corpo e emulsão)';}];
 const out=[],seen=new Set();
 for(let tries=0;tries<n*5&&out.length<n;tries++){
  const rec=R.map(r=>({...r}));const labs=[];const k=rnd()<.45?2:1;
  for(let j=0;j<k;j++){const l=pick(ops)(rec);if(l&&!labs.includes(l))labs.push(l);}
  if(!labs.length)continue;const key=labs.slice().sort().join('|');if(seen.has(key))continue;seen.add(key);
  rec.forEach(r=>r.g=Math.round(r.g*10)/10);const rc=rec.filter(r=>r.g>0);
  let fin=rc,ok=false,how='';try{const b=balanceBest({...st,recipe:rc},260);if(b&&b.ok){fin=b.newRecipe;ok=true;how=b.lab?'lab':'clássico';}}catch(e){}
  const s3=stReal({...st,recipe:fin});const m=analyze(s3);if(m.empty)continue;const F=diagnose(s3,m),sc=score(s3,m,F).total;
  out.push({labs,recipe:fin,ok,how,sc,sens:sensProfile(m),q:fineScore(s3,m,F),crit:F.filter(f=>f.sev==='crit').map(f=>f.title),pod:m.pod,sol:m.sol,fat:m.fat,fz:m.fzVit,d:m.crystal,shelf:m.shelfVit,melt:m.melt,cost:m.costKg,nov:novelty(R,fin),prof:aromaProfile(fin)});}
 const base={sc:score(s0,m0,F0).total,q:fineScore(s0,m0,F0),pod:m0.pod,sol:m0.sol,fat:m0.fat,fz:m0.fzVit,d:m0.crystal,shelf:m0.shelfVit,melt:m0.melt,cost:m0.costKg};
 const goal=EXP_GOALS[st._goal]?st._goal:'equil';out.forEach(x=>x.rank=EXP_GOALS[goal].f(x,base));

const EXP_GOALS={
 equil:{n:'Equilíbrio',f:(x,b)=>x.q+x.nov*4},

function exploreMap(E,sel){const W=360,H=236,L=36,R=10,T=22,B=30;const all=[E.base,...E.list];

 const seen=new Set();const out=[];ids.forEach(id=>PAIRS[id].forEach(([pid,lab])=>{const k=pid||lab;if(seen.has(k)||(pid&&have.has(pid)))return;seen.add(k);out.push([pid,lab,id]);}));

 return`<div style="margin-top:12px"><span class="lbl">Combina com</span><div class="chips" style="margin-top:6px">${out.slice(0,12).map(([pid,lab,src])=>pid&&ING_BY[pid]&&can.edit()?`<button data-a="crAdd" data-v="${pid}" title="Clássico com ${esc(ING_BY[src].n)} · toque para adicionar">+ ${esc(lab)}</button>`:`<span class="chip" title="Clássico com ${esc(ING_BY[src].n)}">${esc(lab)}</span>`).join('')}</div></div>`;}

/* ---------- COMPONENTES: variegato, crocante, pedaços de fruta ---------- */
const COMP_KINDS={variegato:'Variegato / calda',crocante:'Crocante',fruta:'Pedaços de fruta'};
const compSt=c=>({tipo:'sorbetto',vit:S.vit,recipe:(c.recipe||[]).filter(r=>ING_BY[r.id]),proc:Object.assign({},S.proc,{lossPct:+c.loss||0}),brix:S.brix,costs:S.costs});
/* açúcar que a fruta precisa absorver (calda/confitagem) para não virar gelo dentro de uma base que congela fzBase% */
function candySugar(c,fzBase){const base=compSt(c);let lo=0,hi=200;const fzAt=g=>analyze(Object.assign({},base,{recipe:[...base.recipe,{id:'sacarose',g}]})).fzVit;
 const tot=base.recipe.reduce((s,r)=>s+(+r.g||0),0);if(!tot||fzAt(0)<=fzBase+5)return 0;if(fzAt(hi*tot/100)>fzBase+5)return null;
 for(let i=0;i<14;i++){const mid=(lo+hi)/2;if(fzAt(mid*tot/100)>fzBase+5)lo=mid;else hi=mid;}return hi;}
function compAnalysis(m){const comps=S.comps||[];const res=comps.map(c=>{const st=compSt(c);const cm=analyze(st);const out={c,m:cm,notes:[]};if(cm.empty)return out;
  const add=(sev,t)=>out.notes.push([sev,t]);
  if(c.kind==='variegato'){
   if(cm.fzVit>35)add('warn','A '+fT(S.vit)+' °C '+f0(cm.fzVit)+'% da água do variegato congela: fica duro e "vítreo" no meio do gelato. Suba açúcares (dextrose ou xarope de glicose) até ficar abaixo de 35%.');
   else add('ok','Fica macio na vitrine ('+f0(cm.fzVit)+'% da água congelada).');
   if(cm.fzVit<12&&cm.stab<.3)add('info','Quase não congela: tende a escorrer e "sangrar" na cuba. Engrosse com 1–2% de amido ou 0,3% de pectina.');
   if(cm.wat>52)add('warn','Água alta ('+f0(cm.wat)+'%): migra para a base e cria uma faixa de gelo ao redor do veio. Reduza (cozinhe até Brix ≥ 50) ou troque parte do líquido por gordura (pasta, chocolate).');}
  else if(c.kind==='crocante'){
   if(cm.wat>4)add('crit','Água '+f1(cm.wat)+'%: acima de 4% o crocante amolece em poucas horas no frio. Seque no forno ou troque por ingredientes secos.');
   else add('ok','Água '+f1(cm.wat)+'% (crocante até 4%).');
   /* barreira = gordura de cobertura (manteiga de cacau, coco) que forma película contínua; gordura dentro da massa do biscoito não protege */
   const cocoaFat=(cm.fatTypes.cocoa||0)+(cm.fatTypes.coco||0);
   if(cm.fat<25||cocoaFat<30)add('warn','Sem barreira de gordura sólida: a umidade da base ('+f0(m.wat)+'% de água) migra para o crocante em 1–3 dias. Banhe em chocolate ou manteiga de cacau (película fina) antes de incorporar.');
   else add('ok','Gordura sólida protege da umidade ('+f0(cm.fat)+'% de gordura, '+f0(cocoaFat)+'% dela dura).');}
  else{
   const d=cm.fzVit-m.fzVit;
   if(d>12){const sg=candySugar(c,m.fzVit);add('warn','Os pedaços congelam bem mais que a base ('+f0(cm.fzVit)+'% contra '+f0(m.fzVit)+'%): ficam duros como gelo.'+(sg!=null?' Confite em calda até absorver ≈'+f0(sg)+' g de açúcar por 100 g de fruta (ou use dextrose para menos doçura).':' Mesmo confitando não iguala: use a fruta em variegato.'));}
   else add('ok','Pedaços com dureza parecida com a da base ('+f0(cm.fzVit)+'% contra '+f0(m.fzVit)+'% de água congelada).');}
  return out;});
 /* produto final: base + componentes, por peso */
 const pTot=comps.reduce((s,c)=>s+clamp(+c.pct||0,0,60),0);const fb=Math.max(0,1-pTot/100);
 const mix=(fn)=>fb*fn(m)+res.reduce((s,r)=>s+(r.m.empty?0:clamp(+r.c.pct||0,0,60)/100*fn(r.m)),0);
 const al=new Set(m.A.al);res.forEach(r=>{if(!r.m.empty)r.m.A.al.forEach(a=>al.add(a));});
 return{res,pTot,fb,tot:{fat:mix(x=>x.fat),swt:mix(x=>x.swt),prot:mix(x=>x.prot),sol:mix(x=>x.sol),kcal:mix(x=>x.nut.kcal),sat:mix(x=>x.nut.sat),add:mix(x=>x.nut.add),costKg:mix(x=>x.costKg||0)},al};}
/* v17.8 · ponto de servir do produto montado (base + variegato/calda + pedaços).
   A colherada é dura pelo gelo: soma-se o gelo de cada fase pela sua própria curva de congelamento, ponderado pela água que ela traz.
   Crocantes quase não têm água: não mudam esse gelo, mas endurecem a colherada (aviso qualitativo). Alvo: o mesmo % de água congelada
   que a base sozinha tem no seu ponto ideal. Modelo de fases separadas (sem migração de água/açúcar entre elas, que acontece com os dias). */
function compServe(m){if(!m||m.empty)return null;const C=(S.comps||[]).filter(c=>(+c.pct||0)>0&&(c.recipe||[]).length);if(!C.length)return null;
 const pT=C.reduce((s,c)=>s+clamp(+c.pct||0,0,60),0);const ph=[{n:'Base',kind:'base',w:Math.max(0,1-pT/100),m}];
 C.forEach(c=>{const cm=analyze(compSt(c));if(!cm.empty)ph.push({n:c.name||COMP_KINDS[c.kind],kind:c.kind,w:clamp(+c.pct||0,0,60)/100,m:cm});});
 const F=T=>{let a=0,b=0;ph.forEach(p=>{const wat=p.w*(p.m.wat/100);a+=wat*p.m.fz(T);b+=wat;});return b>0?a/b:0;};
 const ref=m.fz(m.serveT);let lo=-40,hi=-1;if(F(hi)>ref)return{ph,T:hi,d:hi-m.serveT,ref,F,pT};if(F(lo)<ref)return{ph,T:lo,d:lo-m.serveT,ref,F,pT};
 for(let i=0;i<40;i++){const mid=(lo+hi)/2;if(F(mid)>ref)lo=mid;else hi=mid;}const T=(lo+hi)/2;
 const croc=C.filter(c=>c.kind==='crocante').reduce((s,c)=>s+clamp(+c.pct||0,0,60),0);
 return{ph,T,d:T-m.serveT,ref,F,pT,croc,fzVit:F(+S.vit)};}
function compServeCard(m,compact){const R=compServe(m);if(!R)return'';const pote=S.proc.serveFrom==='pote';const sh=R.d;
 const lbl=Math.abs(sh)<.15?'igual ao da base':(sh>0?'mais quente':'mais frio');
 return`<div class="card${compact?' flat':''}"><h2>Ponto de servir do produto montado</h2>
  <div class="row" style="gap:18px;align-items:baseline;flex-wrap:wrap"><div><span class="lbl">Base sozinha</span><div class="big mono" style="font-size:22px">${f1(m.serveT)} °C</div></div><div><span class="lbl">Com ${f0(R.pT)}% de componentes</span><div class="big mono c-ice" style="font-size:22px">${f1(R.T)} °C</div></div><div><span class="lbl">Diferença</span><div class="big mono ${Math.abs(sh)>=.5?'c-warn':'c-ok'}" style="font-size:22px">${sh>=0?'+':''}${f1(sh)} °C</div><small class="muted">${lbl}</small></div></div>
  ${compact?'':`<div class="tw" style="margin-top:10px"><table class="tbl"><thead><tr><th>Fase</th><th class="r">% do produto</th><th class="r">Água</th><th class="r">Congelada a ${fT(+S.vit)}°</th></tr></thead><tbody>${R.ph.map(p=>`<tr><td>${esc(p.n)}</td><td class="r mono">${f0(p.w*100)}%</td><td class="r mono">${f0(p.m.wat)}%</td><td class="r mono">${p.m.wat<5?'—':f0(p.m.fz(+S.vit))+'%'}</td></tr>`).join('')}</tbody></table></div>`}
  ${pote?'':`<label class="row" style="gap:8px;margin-top:12px;font-size:13.5px"><input type="checkbox" id="compBal" data-c="compBal"${S.compBal?' checked':''}> Balancear a base para o produto montado</label>
  <p class="note" style="margin:4px 0 0">${S.compBal?'Ligado: o balanceamento ajusta a base para o conjunto ficar no ponto a '+fT(+S.vit)+' °C (a base sozinha fica '+(sh<0?'mais dura':'mais macia')+').':'Desligado: a base continua balanceada sozinha. Alternativa: servir com a vitrine a '+f1(+S.vit+sh)+' °C.'}</p>`}
  <p class="note" style="margin:8px 0 0">${pote?'Servindo do pote, o balanceamento segue o tempo de espera; use esta diferença como referência.':''}${R.croc>0?' Crocantes ('+f0(R.croc)+'%) não mudam o gelo, mas deixam a colherada mais resistente: na dúvida, sirva alguns décimos mais quente e confirme no teste de textura do lote.':''} Estimativa por fases separadas; com os dias a água e o açúcar migram entre elas.</p></div>`;}

function compBenchCard(m){if(m.empty||!can.edit())return'';const C=(S.comps||[]);const R=compServe(m);

   ${R?`<p class="t2" style="margin:10px 0 0">Ponto de servir do produto montado: <b class="mono c-ice">${f1(R.T)} °C</b> (base sozinha ${f1(m.serveT)} °C, ${R.d>=0?'+':''}${f1(R.d)} °C).${S.compBal&&S.proc.serveFrom!=='pote'?' O balanceamento já mira o produto montado.':''}</p>`:''}`
  :`<p class="note" style="margin:6px 0 10px">Variegato/calda, crocante ou pedaços de fruta mudam a dureza da colherada e o ponto de servir. Inclua para o app balancear o produto montado.</p>
   <div class="row" style="gap:6px"><button class="btn sm" data-a="compAdd" data-v="variegato">+ Variegato / calda</button><button class="btn sm" data-a="compAdd" data-v="crocante">+ Crocante</button><button class="btn sm" data-a="compAdd" data-v="fruta">+ Pedaços de fruta</button></div>`}</div>`;}

 const C=S.comps||[];const R=m.empty?null:compAnalysis(m);

function masterIndex(){const key=idxKey();if(MIDX.key===key&&MIDX.list)return MIDX.list;if(MIDX.busy===key)return null;
 MIDX.busy=key;const proc=Object.assign({},S.proc);
 const sync=()=>{/* sem worker: calcula em fatias para não travar a tela */let k=0;const out=[];const step=()=>{if(MIDX.busy!==key)return;const t0=Date.now();while(k<MASTERS.length&&Date.now()-t0<25){out.push(recMetrics(MASTERS[k],proc));k++;}
  if(k<MASTERS.length){MIDX.prog=k;setTimeout(step,0);}else{MIDX.key=key;MIDX.list=out;MIDX.busy=false;render();}};
  if(typeof requestAnimationFrame!=='function'||typeof setTimeout!=='function'){while(k<MASTERS.length){out.push(recMetrics(MASTERS[k],proc));k++;}MIDX.key=key;MIDX.list=out;MIDX.busy=false;return;}step();};
 let w=null;if(!MIDX.failed&&typeof Worker==='function'&&typeof Blob==='function'){try{const src=workerSrc();if(src){if(MIDX.worker)MIDX.worker.terminate();w=new Worker(URL.createObjectURL(new Blob([src],{type:'text/javascript'})));MIDX.worker=w;}}catch(e){w=null;MIDX.failed=true;}}
 if(!w){sync();return MIDX.list&&MIDX.key===key?MIDX.list:null;}
 w.onmessage=e=>{const d=e.data;if(d.progress){MIDX.prog=d.progress;return;}if(d.error||d.key!==key){if(d.error){MIDX.failed=true;MIDX.busy=false;masterIndex();}return;}MIDX.key=key;MIDX.list=d.list;MIDX.busy=false;w.terminate();MIDX.worker=null;render();};
 w.onerror=()=>{MIDX.failed=true;MIDX.busy=false;try{w.terminate();}catch(e){}masterIndex();};
 w.postMessage({key,masters:MASTERS,proc,cust:CUST,nx:NXLIB,lots:LOTS,calOn:CAL.on,invcost:INVCOST});return null;}
/* distância entre receitas: composição (peso 0,6) + ingredientes em comum (peso 0,4) */
function recDist(a,b){const f=[['fat',8],['msnf',8],['swt',20],['sol',30],['pod',15],['fruit',40],['cocoa',8],['nut',8]];let d=0;f.forEach(([k,s])=>{const x=(a[k]-b[k])/s;d+=x*x;});d=Math.sqrt(d/f.length);
 const ks=new Set([...Object.keys(a.ids),...Object.keys(b.ids)]);let mn=0,mx=0;ks.forEach(k=>{mn+=Math.min(a.ids[k]||0,b.ids[k]||0);mx+=Math.max(a.ids[k]||0,b.ids[k]||0);});const jac=mx?mn/mx:0;
 return .6*Math.min(1,d)+.4*(1-jac);}
function similarTo(ref,idx,n=6,skip){return idx.map((x,k)=>({k,d:recDist(ref,x)})).filter(x=>x.k!==skip).sort((a,b)=>a.d-b.d).slice(0,n);}

function recDiff(a,b){const by=r=>{const o={};(r||[]).forEach(x=>o[x.id]=(o[x.id]||0)+ +x.g);return o;};const A=by(a),B=by(b);const ks=new Set([...Object.keys(A),...Object.keys(B)]);const out=[];
 ks.forEach(k=>{const d=(B[k]||0)-(A[k]||0);if(Math.abs(d)>=.05)out.push([k,A[k]||0,B[k]||0,d]);});return out;}

/* ---------- conflito de edição (receita editada em dois aparelhos sem ver a versão do outro) ---------- */
/* cur = cópia local; rd = registro remoto; ts = hora da edição remota. Conflito: a cópia local é uma edição feita aqui
   (sem _by), o remoto não partiu dela (base diferente) e o conteúdo difere. */
function libConflict(cur,rd,ts){if(!cur||cur._by||!(ts>(cur.updatedAt||0)))return false;if((rd.base||0)===(cur.updatedAt||0))return false;
 try{return JSON.stringify(cur.st)!==JSON.stringify(rd.st);}catch(e){return false;}}
function conflictCopy(cur){const d=new Date();const c=JSON.parse(JSON.stringify(cur));c.id=String(Date.now())+'c';c.name=cur.name+' (conflito '+d.toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'})+' '+d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})+')';delete c._by;delete c.base;c.conflict=1;if(c.st)c.st.name=c.name;return c;}

/* ===================== MATURAÇÃO · MODELO CINÉTICO E PROBABILÍSTICO =====================
   Por receita, a cada alteração: quanto tempo maturar, a partir de quando não compensa esperar e o máximo
   antes de a espera prejudicar o gelato. Processos simulados hora a hora na temperatura real da geladeira:
   1. resfriamento da calda dentro do pote (lei de Newton; o pote leva horas para chegar à temperatura do ar)
   2. cristalização da gordura por tipo (Avrami n=2; equilíbrio pelo SFC; emulsificantes e gema aceleram a nucleação)
   3. troca de proteína por emulsificante na superfície das gotas (acompanha a gordura cristalizada)
   4. hidratação de cada hidrocoloide e das proteínas do leite; rede da gelatina
   5. extração de infusões (baunilha, especiarias, ervas, café) e amalgamação dos aromas
   Prejuízos: multiplicação microbiana (modelo de Ratkowsky para Listeria, Tmin −1,5 °C: 72 h-equivalentes a 4 °C),
   separação de soro (galactomananas sem carragena), retrogradação do amido, nata subindo, extração excessiva de
   ervas, enzimas e oxidação de fruta fresca na calda, leve queda de viscosidade depois de ~24 h.
   Incerteza: 240 simulações de Monte Carlo variando temperatura da geladeira, velocidades de cristalização e
   hidratação, resfriamento do pote e crescimento microbiano → faixas P10–P90.
   Referências: Goff & Hartel (Ice Cream; Univ. Guelph — ≥ 4 h, ideal de um dia para o outro, ≤ 5 °C);
   Dogan & Kayacier (viscosidade máxima por volta de 24 h); tese Unibo (gordura cristaliza em 4–5 h; 4–12 h);
   escola italiana 6–12 h a 4–5 °C; Corvitto 12 h; manuais APPCC: mistura pasteurizada em até 72 h a ≤ 4 °C. */

/* Panasonic NR-BB53GV3WB · refrigerador com controle Mín/Méd/Máx. Temperaturas típicas de cada posição
   (estimativa até você medir; o valor medido substitui). */
const FRIDGE={min:{n:'Mín',T:6.5},med:{n:'Méd',T:4.5},max:{n:'Máx',T:2.5}};
/* set Professionale: a temperatura é o setpoint do processo (Maturação °C); o maturador agita e troca calor pela parede */
const MAT_PRO={maturador:{n:'Maturador com agitação',sd:.3,tau:.25},camara:{n:'Câmara fria',sd:.7,tau:null},geladeira:{n:'Geladeira comercial',sd:1,tau:null}};
const FRIDGE_POS={porta:{n:'Porta',d:2.5},sup:{n:'Prateleira de cima',d:.8},meio:{n:'Prateleira do meio',d:0},inf:{n:'Prateleira de baixo, no fundo',d:-.7}};
const MAT0={fridge:'med',pos:'meio',reads:'',entryT:10,probe:'',fruitIn:0};
function matState(){const x=Object.assign({},MAT0,S.mat||{});if(!FRIDGE[x.fridge]&&!MAT_PRO[x.fridge])x.fridge='med';if(!FRIDGE_POS[x.pos])x.pos='meio';x.entryT=clamp(+x.entryT||10,0,40);
 x.reads=String(x.reads||'').slice(0,200);x.probe=String(x.probe||'').slice(0,40);x.fruitIn=x.fruitIn?1:0;return x;}
const parseReads=s=>String(s||'').split(/[;\s]+/).filter(v=>v.trim()!=='').map(v=>+v.replace(',','.')).filter(v=>isFinite(v)&&v>-5&&v<20).slice(0,30);
/* temperatura do ar onde a calda fica: medida (média e desvio) ou estimada pelo ajuste + posição */
function fridgeT(ms){const r=parseReads(ms.reads);
 if(r.length){const mu=r.reduce((a,b)=>a+b,0)/r.length;const sd=r.length>1?Math.sqrt(r.reduce((a,b)=>a+(b-mu)*(b-mu),0)/(r.length-1)):.6;return{mu,sd:Math.max(.3,sd),src:'medida',n:r.length};}
 if(MAT_PRO[ms.fridge]){const sp=+((S&&S.proc&&S.proc.matT)||4);return{mu:sp+(ms.fridge==='maturador'?0:FRIDGE_POS[ms.pos].d),sd:MAT_PRO[ms.fridge].sd,src:'setpoint',n:0};}
 return{mu:FRIDGE[ms.fridge].T+FRIDGE_POS[ms.pos].d,sd:1,src:'estimada',n:0};}
/* constante de tempo do pote (h): massa × cp / (h × área), convecção natural na geladeira */
function potTau(m){const kg=Math.max(.05,(m.tot||1000)/1000),V=kg/((m.rhoMix||1.08)*1000);const A=6*Math.pow(V,2/3)*.85;return kg*3300/(9*A)/3600;}

function probeFit(ms,Tf){const p=String(ms.probe||'').split('@');if(p.length!==2)return null;const Tm=+p[0].replace(',','.'),min=+p[1].replace(',','.');
 if(!isFinite(Tm)||!isFinite(min)||min<=0)return null;const r=(Tm-Tf)/(ms.entryT-Tf);if(!(r>0&&r<1))return null;return-min/60/Math.log(r);}
const MAT_FAT_T50={milk:1.3,egg:1.1,coco:.5,palm:1,cocoa:3,nut:.6,oil:.4};
const MAT_INF={fava:8,especiaria:6,ervas:4,cocoralado:6,alfarroba:5,cacau:2,tamara:4,matcha:.5};
const MAT_PROT={abacaxi:1,mamao:1,figo:.8};const MAT_OX={banana:1,maca:.8,macasuco:.8,pera:.8,abacate:1,pessego:.6,damasco:.5};
const sig=x=>1/(1+Math.exp(-x));
/* contexto da receita: pesos de cada processo (o que esta receita tem para ganhar ou perder maturando) */
function matCtx(st,m){const A=m.A,fat=m.fat||0,ids=new Set((st.recipe||[]).map(r=>r.id));const keys=recipeHydKeys(st);
 const fatT={};let fatEq=0;for(const k in (A.fatT||{}))if(A.fatT[k]>0){fatT[k]=A.fatT[k]/A.fat;}
 const emulAcc=1-.35*Math.min(1,(m.keyPct.mono||0)/.2)-.15*Math.min(1,(m.keyPct.lec||0)/.3)-.12*Math.min(1,(m.yolkPct||0)/4);
 const dairy=(m.msnf||0)>1;const has=k=>(keys[k]||0)>0;
 const floc=dairy&&(has('lbg')||has('guar')||has('tara'))&&!has('carr')&&!has('cmc')&&!(has('citf')&&keys.citf>.1*Object.values(keys).reduce((a,b)=>a+b,0));
 const inf=[...ids].filter(id=>MAT_INF[id]);const fr=st.mat&&st.mat.fruitIn;
 const prot=fr&&dairy?[...ids].filter(id=>MAT_PROT[id]):[];const ox=fr?[...ids].filter(id=>MAT_OX[id]):[];

 return{fat,fatT,emulAcc,hasEmul:!!m.hasEmul,keys,h0:hy?hy.h:{},hydro:m.hydro||0,msnf:m.msnf||0,dairy,floc,starch:(m.keyPct.starch||0)>.3||has('starch'),gel:has('gel'),inf,prot,ox,fruitIn:!!fr,
  w:{fat:fat>1?clamp(fat/8,0,1.3)*1.2:0,emul:fat>1?clamp(fat/8,0,1)*(m.hasEmul?.8:.35):0,hyd:clamp((m.hydro||0)/.3,0,1.2)*(Object.keys(keys).length?1:0),prot:clamp((m.msnf||0)/10,0,1)*.4,gel:has('gel')?.6:0,inf:inf.length?.5:0,mel:.25}};}
/* uma simulação (parâmetros p) na grade de tempo; devolve curvas e tempos-chave */
const MAT_GRID=(()=>{const g=[];for(let t=0;t<=24;t+=.25)g.push(t);for(let t=25;t<=96;t+=1)g.push(t);return g;})();
function matRun(C,p){const G=MAT_GRID,n=G.length;const Tf=p.Tf,tau=p.tau,T0=p.T0;
 const B=new Float64Array(n),H=new Float64Array(n),comp={fat:[],emul:[],hyd:[],aroma:[],T:[],dose:[]};
 let teF=0,dose=0,X={},Xeq={};for(const k in C.fatT){X[k]=0;}let h={...C.h0},gelP=0,prevT=T0,aIn=0,mel=0,prevt=0,protP=.6; /* proteínas já bem hidratadas na pasteurização */
 for(let i=0;i<n;i++){const t=G[i],dt=t-prevt;prevt=t;const T=Tf+(T0-Tf)*Math.exp(-t/tau);
  if(dt>0){const Tm=(T+prevT)/2;prevT=T;
   /* microbiano (h-equivalentes a 4 °C) */dose+=dt*(Tm>-1.5?Math.pow((Tm+1.5)/5.5,2):0)*p.micro;
   /* gordura: tempo efetivo de cristalização abaixo de 15 °C */if(Tm<15)teF+=dt*Math.exp(-(Tm-4)/5)/(C.emulAcc*p.fatK);
   for(const k in C.fatT){const t50=MAT_FAT_T50[k]||1.2;const eq=sfcOf(k,Tm)/100;X[k]=Math.max(X[k],eq*(1-Math.exp(-Math.LN2*Math.pow(teF/t50,2))));Xeq[k]=sfcOf(k,Tf)/100;}
   for(const k in h){const hm=hydMax(k,Tm);if(hm>h[k])h[k]+=(hm-h[k])*(1-Math.exp(-dt*3600/(hydTau(k,Tm)*p.hydK)));}
   if(C.gel)gelP+=(1-gelP)*(1-Math.exp(-dt/(6*Math.exp((Tm-4)/4)*p.hydK)));
   protP+=(1-protP)*(1-Math.exp(-dt/1));const tI=(C.inf.length?C.inf.reduce((a,id)=>a+MAT_INF[id],0)/C.inf.length:4)*Math.exp(-(Tm-4)/15);aIn+=(1-aIn)*(1-Math.exp(-dt/tI));mel+=(1-mel)*(1-Math.exp(-dt/4));}
  let fx=0,fe=0;for(const k in C.fatT){fx+=C.fatT[k]*X[k];fe+=C.fatT[k]*(Xeq[k]||sfcOf(k,Tf)/100);}const F=fe>.005?clamp(fx/fe,0,1):1;
  const E=clamp(1-Math.exp(-teF/(C.hasEmul?2:3)),0,1)*F;

  B[i]=(w.fat*F+w.emul*E+w.hyd*Hy+w.prot*protP+w.gel*gelP+w.inf*aIn+w.mel*mel)/bw;

/* ===================== PRODUÇÃO AO VIVO =====================
   Cada calda em produção é um lote (coleção "lots", já sincronizada com a equipe e com regras de acesso no banco)
   com um fluxo: preparo → pasteurização → resfriamento → maturação → mantecação → endurecimento → freezer.
   Ideias das cozinhas de alta performance e das suítes de equipe:
   • KDS (kitchen display): cartão por calda, cronômetro com cor por urgência (verde pronto, âmbar atenção,
     vermelho fora do limite), "avançar" com um toque, voltar por engano (recall), contagem do dia;
   • quadro (Trello/Linear): colunas por etapa, cartões com responsável e etiqueta de cor;
   • linha do tempo (Gantt/Asana): o que já aconteceu e a previsão de cada etapa até o freezer;

/* ==== 60-store.js ==== */
/* ===================== IL FREDOLIN · ARMAZENAMENTO (aparelho + nuvem) =====================
   Cada coleção vive neste aparelho (localStorage) e, com a conta conectada, na nuvem.
   A nuvem é plugável: no artefato usa o banco privado do Claude; no aplicativo usa o Supabase da equipe.
   Conflitos: vence o registro com updatedAt mais recente. Exclusões viram "lápides" ({id, deleted, updatedAt})
   para que um item apagado num aparelho não ressuscite quando outro aparelho, ainda com a cópia antiga, sincronizar. */
const COLS={lib:{get:()=>LIB,set:v=>{LIB=v;},lk:LIBKEY},lots:{get:()=>LOTS,set:v=>{LOTS=v;},lk:K10.lots},ings:{get:()=>CUST,set:v=>{CUST=v;},lk:K10.ings},nx:{get:()=>NXLIB,set:v=>{NXLIB=v;},lk:NXKEY},inv:{get:()=>INV,set:v=>{INV=v;},lk:K10.inv},
 exec:{get:()=>EXEC,set:v=>{EXEC=v;},lk:EXECKEY},vit:{get:()=>VITS,set:v=>{VITS=v;},lk:VITSKEY}};
const TOMBKEY='fredolin_v11_tomb';
const byNewest=(a,b)=>(b.updatedAt||0)-(a.updatedAt||0);
const plain=r=>JSON.parse(JSON.stringify(r));
/* ingredientes próprios e neutros do usuário que foram apagados (aqui ou em outro aparelho) saem do banco de cálculo */
function syncRegistry(){const keepC=new Set(CUST.map(c=>c.id)),keepN=new Set(NXLIB.map(n=>n.id)),pre=new Set(NEUTRO_PRESETS.map(n=>n.id));let ch=false;
 for(let k=ING.length-1;k>=0;k--){const i=ING[k];const goneC=i.custom&&!keepC.has(i.id),goneN=i.blend&&!pre.has(i.id)&&i.id!=='nx_tmp'&&!keepN.has(i.id);if(goneC||goneN){ING.splice(k,1);delete ING_BY[i.id];ch=true;}}
 CUST.forEach(registerCustom);NXLIB.forEach(registerNeutro);if(ch)ING_VER++;}
const STORE={backend:null,status:'local',msg:'Salvando somente neste aparelho.',tomb:LS.get(TOMBKEY)||{},
 saveLocal(c){LS.set(COLS[c].lk,COLS[c].get());},
 saveTomb(){LS.set(TOMBKEY,this.tomb);},
 after(c){if(c==='ings'||c==='nx')syncRegistry();if(c==='inv')invRecompute(INV);if(c==='lots')fitCalibration(LOTS);if(c==='vit'){const v=VITS.find(x=>x.id==='main')||VITS.find(x=>!x.kind);if(v)S.vitrine={temp:v.temp,items:v.items||[]};if(typeof setsFromCloud==='function')setsFromCloud();}},
 setStatus(st,msg){this.status=st;this.msg=msg;render();},
 put(c,rec){const arr=COLS[c].get();const k=arr.findIndex(x=>String(x.id)===String(rec.id));
  /* receitas guardam de qual versão partiram (base): assim duas edições paralelas viram conflito, não perda */
  if(c==='lib')rec.base=k>=0?(arr[k]===rec?rec.base||0:arr[k].updatedAt||0):0;
  rec.updatedAt=Date.now();if(k>=0)arr[k]=rec;else arr.unshift(rec);
  if(this.tomb[c]&&this.tomb[c][rec.id]){delete this.tomb[c][rec.id];this.saveTomb();}
  this.saveLocal(c);this.after(c);if(this.backend)this.backend.push(c,rec);},
 del(c,id){const now=Date.now();COLS[c].set(COLS[c].get().filter(x=>String(x.id)!==String(id)));(this.tomb[c]=this.tomb[c]||{})[id]=now;this.saveTomb();this.saveLocal(c);this.after(c);
  if(this.backend)this.backend.push(c,{id:String(id),deleted:true,updatedAt:now});},
 /* aplica uma coleção vinda da nuvem (já sem lápides) */
 replace(c,list){COLS[c].set(safeList(list).filter(r=>!r.deleted).sort(byNewest));this.saveLocal(c);this.after(c);},
 /* junta o que está no aparelho com o que está na nuvem (função pura: testável sem rede) */
 merge(local,remote,tomb,col){const out=new Map(remote),push=[];
  local.forEach(r=>{const id=String(r.id),rr=out.get(id);if(rr&&rr.deleted&&(rr.updatedAt||0)>=(r.updatedAt||0))return;if(!rr||(r.updatedAt||0)>(rr.updatedAt||0)){out.set(id,r);push.push(r);}
   /* receita editada aqui e, em paralelo, em outro aparelho: guarda as duas */
   else if(col==='lib'&&rr&&!rr.deleted&&(rr.updatedAt||0)>(r.updatedAt||0)&&libConflict(r,rr,rr.updatedAt||0)){const cp=conflictCopy(r);cp.updatedAt=Date.now();out.set(cp.id,cp);push.push(cp);}});
  for(const id in tomb||{}){const rr=out.get(String(id));if(!rr||(!rr.deleted&&(rr.updatedAt||0)<=tomb[id])){const t={id:String(id),deleted:true,updatedAt:tomb[id]};out.set(String(id),t);push.push(t);}}
  return{list:[...out.values()].filter(r=>!r.deleted).sort(byNewest),push};},
 /* apaga todos os dados deste aparelho (troca de usuário ou "Sair" num aparelho compartilhado) */
 wipe(){for(const c in COLS){COLS[c].set([]);this.saveLocal(c);}this.tomb={};this.saveTomb();syncRegistry();invRecompute(INV);fitCalibration(LOTS);},
 init(){const b=APP_MODE==='app'?SUPA_BACKEND:CLAUDE_BACKEND;this.backend=b;/* já recebe as gravações; envia quando a conexão estiver pronta */return b.start(this).catch(e=>this.setStatus('error','Não foi possível sincronizar ('+(e&&e.message||'erro')+'). Salvando neste aparelho.'));}
};

/* ---------- nuvem do artefato (banco privado do Claude) ---------- */
const CLAUDE_BACKEND={db:null,uid:null,
 path(c){return'data/users/'+this.uid+'/fredolin/'+c;},
 push(c,rec){if(this.db)this.db.collection(this.path(c)).doc(String(rec.id)).set(plain(rec)).catch(e=>STORE.setStatus('error','Falha ao gravar na nuvem ('+(e&&e.code||'erro')+'). Os dados continuam neste aparelho.'));},
 async start(st){if(!window.claude||typeof window.claude.use!=='function')return false;const [db,user]=await Promise.all([claude.use('db'),claude.use('user')]);
  if(!db||!user){st.setStatus('local','Sincronização indisponível nesta visualização; salvando neste aparelho.');return false;}
  const id=await user.id();if(!id){st.setStatus('local','Entre na sua conta para sincronizar.');return false;}this.db=db;this.uid=id;st.setStatus('syncing','Sincronizando…');
  for(const c in COLS){const col=db.collection(this.path(c));const snap=await col.get();
   const r=st.merge(COLS[c].get(),new Map(snap.docs.map(d=>[d.id,d.data()])),st.tomb[c],c);
   r.push.forEach(x=>col.doc(String(x.id)).set(plain(x)).catch(()=>{}));
   st.replace(c,r.list);
   col.onSnapshot(sn=>{if(sn.metadata&&sn.metadata.hasPendingWrites)return;st.replace(c,sn.docs.map(d=>d.data()));render();},()=>{});}
  st.setStatus('cloud','Sincronizado com sua conta: biblioteca, lotes, ingredientes, neutros e estoque aparecem em todos os seus aparelhos.');return true;}
};
